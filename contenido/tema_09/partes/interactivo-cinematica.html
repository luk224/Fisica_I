  <figcaption><b>Pruébalo tú:</b> un punto $P$ del borde de un disco gira con $\theta=\omega_0t+\tfrac12\alpha t^2$. Mueve el instante $t$ (o pulsa «En marcha») y mira cómo $a_{tan}=r\alpha$ <i>no cambia</i> mientras $a_{rad}=r\omega^2$ crece con $\omega^2$: la aceleración total $a$ se va girando hacia el eje y el ángulo que forma con él cumple $\tan=\alpha/\omega^2$. Pon $\alpha=0$ y ves solo la radial (movimiento circular uniforme); con $\omega_0$ y $\alpha$ de signo opuesto, $a_{tan}$ apunta contra $v$ y el punto frena. Los valores iniciales ($r=0{,}30$ m, $\omega_0=0$, $\alpha=0{,}60$ rad/s², $t=1{,}87$ s) reproducen el problema 9.23 b): $60^\circ$ girados, $a_{tan}=0{,}180$, $a_{rad}=0{,}377$ y $a=0{,}418$ m/s²; con $t=2{,}64$ s, el apartado c) ($120^\circ$). La flecha $v$ tiene escala fija; las de aceleración se reescalan en cada instante para que la total mida siempre lo mismo (sus proporciones sí son las reales). <span class="src" data-l="P" data-ref="Interactivo propio de U §9.3, ecs. 9.13-9.15 y problema 9.23">P</span></figcaption>
