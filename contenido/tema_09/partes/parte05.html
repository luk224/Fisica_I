  <figcaption><b>Pruébalo tú:</b> elige un cuerpo de la tabla 9.2 y desplaza el eje (círculo con punto) una distancia $d$ del centro de masa. A la derecha, $I_P$ dibuja una parábola de mínimo en $d=0$; el tramo rojo es $Md^2$. Cambia la masa o el tamaño y verás que todo escala igual: lo que decide la forma es el coeficiente $c$ de $I_{cm}=cMs^2$. Los valores iniciales (varilla, $M=4$ kg, $L=2$ m, eje a $d=L/2$, es decir, en el extremo) dan $I_P=1{,}333+4=5{,}333=\tfrac13ML^2$: el valor de la tabla 9.2b. <span class="src" data-l="P" data-ref="Interactivo propio de U §9.5, ec. 9.19 y tabla 9.2">P</span></figcaption>
</figure>
