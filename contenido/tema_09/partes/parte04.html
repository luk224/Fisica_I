  <img class="int-static" src="../assets/img/int_polea-masa.png" alt="Interactivo: bloque que cuelga de un cable enrollado en una rueda; reparto de la energía entre el bloque y la rueda">
  <figcaption><b>Pruébalo tú:</b> el bloque ($m$) cae y hace girar la rueda ($M$, $R$, $I=cMR^2$). Mueve el tiempo (o «En marcha») y observa las barras: la barra apilada (energía cinética del bloque + de la rueda) siempre alcanza la altura de la barra gris (energía potencial perdida $mgs$). Aumenta $M$ o $c$ y la rueda se lleva más energía: el bloque cae más despacio ($a=mg/(m+cM)$); con $M$ muy pequeña, el bloque casi cae libre. Observa que <i>cambiar el radio $R$ no cambia $v$</i> (solo $\omega=v/R$ y $I$). Los valores iniciales ($m=4{,}20$ kg, $M=46{,}5$ kg, $R=0{,}28$ m, $h=3{,}00$ m, $c=\tfrac12$) reproducen el problema 9.45: llega con $v=3{,}00$ m/s en $2{,}00$ s. Con $c=\tfrac12$ la fórmula es la del ejemplo 9.8 de U. <span class="src" data-l="P" data-ref="Interactivo propio de U ejemplo 9.8 y problema 9.45">P</span></figcaption>
</figure>
