  <figcaption><b>Pruébalo tú: el ciclo de Carnot.</b> Mueve $T_H$, $T_C$ y la razón de expansión $r=V_b/V_a$ y elige si funciona como máquina o como refrigerador. <b>Observa:</b> (1) con $T_H=500$ K, $T_C=300$ K y $r=2$: $Q_H=+2881$ J, $Q_C=-1729$ J, $W=1153$ J y $e=40\,\%=1-T_C/T_H$; (2) <b>sube $T_H$ a 900 K</b>: $Q_H=5187$ J y $W=3458$ J con el mismo $|Q_C|=1729$ J, así que $e=66{,}7\,\%$; (3) la <b>razón $r$</b> cambia el tamaño del ciclo ($Q$ y $W$ crecen con $\ln r$) pero <b>no la eficiencia</b>; (4) acerca $T_C$ a $T_H$ y $e\to0$ mientras que, en modo refrigerador, $K=T_C/(T_H-T_C)$ se dispara (con $T_C=450$ K, $K=9$); (5) las entropías de las dos isotermas son siempre iguales y opuestas ($\pm nR\ln r=\pm5{,}76$ J/K con $r=2$): $\Delta S_{ciclo}=0$; (6) $V_c/V_d=V_b/V_a$ siempre. El selector <i>Ejes</i> alterna entre ejes lineales (el área es $W$) y <b>logarítmicos</b>, donde isotermas y adiabáticas son rectas y se ve mejor la forma del ciclo. Las adiabáticas son $TV^{\gamma-1}=$ cte con $\gamma=1{,}4$ (diatómico), $V_a=5{,}00$ L y $n=1$ mol. <span class="src" data-l="P" data-ref="Interactivo propio de U §20.6, ec. (20.10)-(20.15), pp. 659-662">P</span></figcaption>
</figure>
