  <img class="int-static" src="../assets/img/int_motor-diesel.png" alt="Interactivo: motor Diesel de cuatro tiempos con cilindro, pistón, biela y cigüeñal enlazados al ciclo en el diagrama pV; se gira el cigüeñal a mano o con el reproductor y se cambian la razón de compresión y la razón de corte">
  <figcaption><b>Juega con el motor Diesel.</b> Pulsa ▶ o <b>agarra el círculo del cigüeñal y gíralo a mano</b>: pistón, válvulas, inyector y el punto del diagrama pV se mueven a la vez (el aire se pone naranja al calentarse). Cambia la <b>razón de compresión</b> $r=V_a/V_b$ (deslizador o <b>sube y baja la culata</b>; el hueco sobre el pistón está exagerado para que se vea) y la <b>razón de corte</b> $r_c=V_c/V_b$, que es lo que dura la inyección (deslizador o <b>arrastra el punto c</b>). <b>Observa:</b> (1) con $r=18$ y $r_c=2$: $T_b=953$ K sin ninguna chispa, $T_c=1907$ K, $Q_H=597$ J, $|Q_C|=220$ J, $W=377$ J y $e=63{,}2\,\%$; (2) el tramo $b\to c$ es a <b>presión constante</b> (el pistón ya baja mientras se quema el gasóleo) y $d\to a$, a <b>volumen constante</b> (se abre el escape); (3) <b>sube $r_c$ a 4</b>: más combustible, $T_c$ se dispara a 3813 K pero $e$ baja a $55{,}3\,\%$; con $r_c=1{,}1$ (inyección casi instantánea) se acerca al Otto, $67{,}9\,\%$ frente a $68{,}5\,\%$ del Otto con el mismo $r$; (4) <b>con el mismo $r$ el Otto rinde más</b>, pero el Diesel puede subir $r$ porque comprime solo aire: con $r=24$ y $r_c=2$, $e=67{,}2\,\%$; (5) la eficiencia de Carnot entre 300 K y $T_c$ (84 % con $r=18$) es siempre una cota superior. <b>Reto:</b> consigue $e\ge60\,\%$ sin pasar de $T_c=2000$ K (el material no lo aguanta). Fórmula: $e=1-\dfrac{r_c^{\gamma}-1}{r^{\gamma-1}\,\gamma\,(r_c-1)}$, con $\gamma=1{,}4$, $V_d=500$ cm³ y aire inicial a 300 K y 1 atm. <span class="src" data-l="P" data-ref="Interactivo propio de U §20.3, pp. 652-654 (ciclo Diesel)">P</span></figcaption>
</figure>
