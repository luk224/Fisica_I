  <figcaption><b>Pruébalo tú: ¿cuánto crece la entropía?</b> <b>Modo 1</b> (ej. 20.10): dos masas de 1,00 kg de agua; con 373,15 K y 273,15 K sale $\Delta S_{caliente}=-603$ J/K, $\Delta S_{\text{fría}}=+704$ J/K y <b>total $+102$ J/K</b>. Acerca las dos temperaturas (p. ej. 330 K y 300 K: total $+9{,}5$ J/K): el total tiende a 0, que es el límite de un proceso reversible; con $T_1=T_2$ vale exactamente 0 y nunca sale negativo. La entropía de la parte fría siempre sube más de lo que baja la de la caliente. <b>Modo 2</b> (ej. 20.8 y 20.11): 1 mol de gas ideal pasa de $V_1$ a $V_2=rV_1$ sin calor ni trabajo; $\Delta S=nR\ln r$ (con $r=2$: $5{,}76$ J/K; con $r=6$: $14{,}9$ J/K). La curva crece cada vez más despacio (logaritmo) y los puntos de la caja muestran las moléculas repartidas por un volumen mayor: más posiciones posibles, más desorden, $S=k\ln w$. <span class="src" data-l="P" data-ref="Interactivo propio de U §20.7-20.8, ejemplos 20.8, 20.10 y 20.11, pp. 666-672">P</span></figcaption>
</figure>
