  <figcaption><b>Pruébalo tú:</b> arriba, la cuerda en el instante $t$ (el eje $y$ está ampliado ×4); abajo, la gráfica $y(t)$ de la partícula marcada (punto rojo). Pon el ejemplo 15.2 ($\lambda=6{,}0$ m, $f=2{,}00$ Hz, $A=7{,}5$ cm) y lee $v=12{,}0$ m/s, $k=1{,}05$ rad/m, $\omega=12{,}6$ rad/s. <b>Observa:</b> (1) la <b>cresta violeta avanza</b> con $v=\lambda f$, mientras que la <b>partícula solo sube y baja</b> en su $x$; (2) mueve $f$: $T$ cambia y la gráfica de abajo se estrecha, pero la rapidez $v=\lambda f$ cambia también; mueve $\lambda$ con $f$ fija y comprueba que $v$ sigue a $\lambda$; (3) la flecha naranja ($v_y$) es cero en cresta y valle y máxima al pasar por el equilibrio, como en (15.9); (4) cambia el sentido a $-x$ y fíjate en que la partícula repite el movimiento pero invertida en el tiempo. <span class="src" data-l="P" data-ref="Interactivo propio de U §15.2-15.3 (ejemplo 15.2, ec. 15.1, 15.7-15.10, figs. 15.9-15.10)">P</span></figcaption>
