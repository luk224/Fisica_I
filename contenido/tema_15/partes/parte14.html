  <img class="int-static" src="../assets/img/int_onda-estacionaria.png" alt="Interactivo: una cuerda fija en los dos extremos que vibra en un modo normal, como suma de dos ondas viajeras opuestas; se varían el modo n, la tensión y la amplitud">
  <figcaption><b>Pruébalo tú:</b> la cuerda del ejercicio 15.58 ($L=0{,}800$ m, $\mu=7{,}50$ g/m). Con <i>«la suma y las dos ondas viajeras»</i> verás que la onda naranja (hacia $-x$, invertida al reflejarse) y la verde (hacia $+x$) <b>viajan</b>, pero su suma (línea gruesa) <b>no avanza</b>: es $(2A\sin kx)\sin\omega t$. <b>Observa:</b> (1) cambia el modo $n$: aparecen $n+1$ nodos (puntos rojos) y $n$ antinodos, y siempre $L=n\lambda/2$ (el corchete inferior mide una media longitud de onda); (2) cambia la <b>tensión $F$</b>: la forma <b>no cambia</b>, solo la frecuencia $f_n=n\sqrt{F/\mu}/2L$ (con $F\approx467$ N sale $f_1=156$ Hz; cuadruplica $F$ y $f$ se duplica); (3) cambia $A$: la envolvente $\pm2A|\sin kx|$ crece, los nodos siguen quietos; (4) detén el reproductor en $t=T/4$: la cuerda pasa por el máximo y las dos ondas viajeras se <b>refuerzan</b> en los antinodos; en $t=T/2$ la suma es cero en toda la cuerda aunque las ondas siguen viajando. <span class="src" data-l="P" data-ref="Interactivo propio de U §15.6-15.8 (ec. 15.27-15.35, figs. 15.23-15.26) y ejercicio 15.58">P</span></figcaption>
</figure>
