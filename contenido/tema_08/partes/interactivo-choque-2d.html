<figure class="interactivo" data-escena="choque-2d" data-params='{"dim":2,"marcas":false}' aria-label="Interactivo: choque de dos discos lisos en el plano con parámetro de impacto, masas y coeficiente de restitución ajustables, y triángulo de cantidad de movimiento">
  <img class="int-static" src="../assets/img/int_choque-2d.png" alt="Interactivo: choque de dos discos lisos en el plano con parámetro de impacto, masas y coeficiente de restitución ajustables, y triángulo de cantidad de movimiento">
  <figcaption><b>Pruébalo tú:</b> un disco incide sobre otro en reposo y la trayectoria pasa a una distancia $b$ (parámetro de impacto) del centro del segundo. Al ser lisos, la fuerza va según la recta de los centros (línea discontinua): con $b=0$ el choque es frontal y con $b$ grande los discos casi se rozan. Cambia $b$, las masas y $e$ y observa el triángulo de la derecha: $\vec p_1'+\vec p_2'=\vec P$ siempre; la energía cinética solo se conserva con $e=1$. Con <b>masas iguales y $e=1$ los dos discos salen formando $90^\circ$</b> (por ejemplo $m_1=m_2$, $v_0=5{,}0$ m/s, $b=0{,}50$ m: $2{,}5$ m/s a $60^\circ$ y $4{,}33$ m/s a $-30^\circ$). Con $m_1=0{,}5$ kg, $m_2=0{,}3$ kg, $v_0=4{,}0$ m/s, $b\approx0{,}45$ m y $e=1$ se reproduce el ejemplo 8.12: $2{,}0$ m/s a $36{,}9^\circ$ y $4{,}47$ m/s a $-26{,}7^\circ$. <span class="src" data-l="P" data-ref="Interactivo propio de choques bidimensionales (U §8.4, pp. 251-254, ejemplo 8.12)">P</span></figcaption>
</figure>
