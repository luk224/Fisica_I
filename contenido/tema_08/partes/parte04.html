  <figcaption><b>Pruébalo tú:</b> cambia las masas, las velocidades y el coeficiente de restitución $e$, y mueve el tiempo (o pulsa «En marcha»). Las barras de la izquierda muestran $p_A$, $p_B$ y el total $P$ antes y después: <i>las dos barras totales siempre son iguales</i>. Las de la derecha muestran $K_A$, $K_B$ y el total: solo son iguales con $e=1$. El punto del CM (centro de masa) avanza con velocidad constante. Con $m_A=0{,}50$ kg, $m_B=0{,}30$ kg, $v_{A1}=2{,}0$ m/s y $v_{B1}=-2{,}0$ m/s: $e=1$ da $v_{A2}=-1{,}0$ y $v_{B2}=3{,}0$ m/s (ejemplo 8.10); $e=0$ da $0{,}50$ m/s para los dos (ejemplo 8.7); $e=0{,}6$ da $-0{,}40$ y $2{,}0$ m/s (ejemplo 8.5). Las masas $m_A=0{,}3$ kg y $m_B=0{,}1$ kg (10 veces las masas reales; solo importa su razón) con $v_{A1}=0{,}2$ m/s, $v_{B1}=-0{,}4$ m/s y $e=1$ reproducen el problema 8.48: $-0{,}1$ m/s para la canica de 30 g y $+0{,}5$ m/s para la de 10 g. <span class="src" data-l="P" data-ref="Interactivo propio de choques en una dimensión (U §8.2-8.4, pp. 243-254; Solucionario 8-17 Prob. 8.48)">P</span></figcaption>
</figure>
