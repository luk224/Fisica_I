  <img class="int-static" src="../assets/img/int_explosion-cm.png" alt="Interactivo: un obús estalla en el vértice de su trayectoria y los fragmentos caen mientras el centro de masa sigue la parábola original">
  <figcaption><b>Pruébalo tú:</b> el obús estalla en el vértice de su parábola en dos fragmentos que salen en horizontal (por eso caen a la vez). Cambia la velocidad y el ángulo de disparo, la razón de masas y la velocidad con que sale el fragmento pesado hacia atrás respecto al obús, y mueve el tiempo: <i>el punto del CM (el centro de masa), recorre siempre la parábola del obús entero</i> y cae en el alcance $R$ sin explosión; los puntos de caída cumplen $m_A x_A+m_Bx_B=MR$. Con $v_0=150$ m/s, $\alpha=55^\circ$, $m_A/m_B=3$, $M=12$ kg y $u_A\approx172$ m/s ($=2v_x$) el fragmento pesado vuelve al punto de lanzamiento, el ligero cae a unos $8{,}63$ km y se liberan $5{,}33\times10^5$ J (problema 8.98). Con $v_0=39{,}6$ m/s (vértice a 80 m), $\alpha=90^\circ$, $m_A/m_B=5$, $M=1{,}68$ kg y $u_A=14{,}31$ m/s sale el examen de Feb. 2020: $-14{,}3$ y $+71{,}5$ m/s, caída a $57{,}8$ m y $289{,}1$ m, y $860$ J. (Si el alcance es mucho mayor que la altura, el eje horizontal se dibuja comprimido; los números de los ejes son metros reales.) <span class="src" data-l="P" data-ref="Interactivo propio del movimiento del centro de masa (U §8.5, pp. 256-258; Solucionario 8-36 Prob. 8.98; Examen Febrero 2020 (1ª semana) P-2)">P</span></figcaption>
</figure>
