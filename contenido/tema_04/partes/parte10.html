<div class="box intu"><span class="h">Idea intuitiva</span><p>Cuando empujas la pared, la pared te empuja a ti con la misma fuerza en sentido contrario — por eso te duele la mano. Toda fuerza es una interacción <i>entre dos cuerpos</i>, así que siempre viene acompañada de otra fuerza igual y opuesta que el segundo cuerpo ejerce sobre el primero.</p></div>
