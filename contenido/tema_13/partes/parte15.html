  <img class="int-static" src="../assets/img/int_g-radial.png" alt="Interactivo: gráfica de la gravedad frente a la distancia al centro de un planeta, con tres modelos (esfera uniforme, cascarón delgado y planeta con densidad que baja linealmente, problema 13.71) y un punto que se arrastra con un deslizador">
  <figcaption><b>Pruébalo tú:</b> mueve el punto de $r=0$ hasta $4R_T$ y cambia el modelo. En la <b>esfera uniforme</b>, $g$ sube linealmente hasta $9{,}81$ m/s² en la superficie y luego baja como $1/r^2$ (a $\sqrt{10}\,R_T$ vale la décima parte). En el <b>cascarón</b> toda la masa está en la superficie: dentro $g=0$ y fuera es idéntico al de la esfera. En el <b>planeta con densidad que baja linealmente</b> (problema 13.71, ejercicio E13) $g$ llega a un máximo de $10{,}27$ m/s² en $r=0{,}77R$ y luego baja un poco hasta $9{,}34$ m/s²: bajar un trecho al interior puede <i>aumentar</i> la gravedad. Fíjate en la lectura «masa que cuenta»: fuera es el 100 %; dentro, solo la que hay a menos de $r$. A trazos, la esfera uniforme de la Tierra como comparación. <span class="src" data-l="P" data-ref="Interactivo propio de U §13.6 (ejemplo 13.10) y del problema 13.71">P</span></figcaption>
</figure>
