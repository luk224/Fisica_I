  <img class="int-static" src="../assets/img/int_orbitas-kepler.png" alt="Interactivo: una nave lanzada tangente a la superficie terrestre desde 300 km de altura; se varía la rapidez de lanzamiento y se ve la órbita (círculo, elipse, parábola o hipérbola), los sectores de igual tiempo y las energías">
  <figcaption><b>Pruébalo tú:</b> una nave sale desde 300 km de altura, siempre <b>tangente</b> a la superficie, con rapidez $v_0=k\,v_{circ}$ (con $v_{circ}=7{,}73$ km/s). Con $k=1$ la órbita es un círculo. Si subes $k$ un poco, aparece una <b>elipse</b>: el punto de salida es ahora el perigeo (el más cercano) y el punto opuesto es el apogeo; con $k=1{,}2$ lees $e=0{,}44$, $r_a=1{,}72\times10^7$ m y $T=216$ min. Mira cómo la nave <b>acelera al acercarse</b> y frena al alejarse, y cómo los dos <b>sectores</b> (mismo intervalo de tiempo) tienen la misma área aunque parezcan distintos: es la segunda ley. Fíjate en las barras de la izquierda: $E=K+U$ no cambia (raya fina) aunque $K$ y $U$ sí. Con $k\ge\sqrt2=1{,}414$ ($v_0\ge10{,}9$ km/s: la rapidez de escape) la órbita se abre: <b>parábola</b> o <b>hipérbola</b> y la nave no vuelve. Con $k\lt1$ el punto de lanzamiento es el apogeo y, si el perigeo cae dentro de la Tierra, la nave se estrella. <span class="src" data-l="P" data-ref="Interactivo propio de U §13.4-13.5 (ejemplos 13.5, 13.6 y 13.9)">P</span></figcaption>
</figure>
