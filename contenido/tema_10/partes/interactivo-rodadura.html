  <figcaption><b>Pruébalo tú:</b> cinco cuerpos parten a la vez del reposo por la misma rampa (cada carril representa la distancia recorrida a lo largo de la rampa). Pulsa «Reproducir» (la cámara va lenta, el tiempo mostrado es el real). Verás que llegan siempre en el mismo orden, <i>sin importar la masa ni el radio</i> (M y R no aparecen en la fórmula): el bloque liso gana, y entre los que ruedan, cuanto más masa lejos del eje, más tarda. Baja la fricción $\mu$ por debajo del valor «$\mu$ mín» que indica cada lectura: ese cuerpo <b>resbala</b> (la marca de giro se pone roja), la fricción cinética lo frena menos y gira menos, y llega antes que si rodara. Con $\theta=50^\circ$ y $\mu=0{,}40$ reproduces el examen de Febrero 2023: el cilindro macizo rueda justo ($\mu_{mín}=0{,}397$) y el hueco (aro, $0{,}596$) resbala. Las aceleraciones son las de la receta de la rampa de arriba; los giros se dibujan con $R=10$ cm. <span class="src" data-l="P" data-ref="Interactivo propio de U §10.3, ejemplos 10.5-10.7, y examen Febrero 2023 (1ª semana) P-2">P</span></figcaption>
</figure>
