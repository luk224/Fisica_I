  <figcaption><b>Pruébalo tú:</b> mueve el deslizador de la distancia $r$ de las mancuernas y mira (vista desde arriba, a cámara lenta) cómo la mesa gira más deprisa al acercarlas. La barra azul, $L=I\omega$, <i>no se mueve nunca</i> (está normalizada: su altura fija representa el valor constante de $L$, sin escala numérica); la barra naranja, $K$, sube y baja: la línea discontinua marca la $K_1$ inicial, y el exceso es el trabajo de los brazos. Con los valores iniciales ($m=5{,}0$ kg, $\omega_1=0{,}50$ rev/s) y $r=0{,}20$ m obtienes los 2,5 rev/s, 64 J → 320 J del ejemplo 10.10. Pon $m=0$ y comprueba que solo cambia $I_{cuerpo}$ (interpolado linealmente entre los 3,0 y los 2,2 kg·m² del ejemplo). <span class="src" data-l="P" data-ref="Interactivo propio de U §10.6, ejemplo 10.10 (p. 321)">P</span></figcaption>
</figure>
