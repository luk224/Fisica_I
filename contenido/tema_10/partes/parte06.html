  <figcaption><b>Pruébalo tú</b> (arrastra para girar la vista en 3D): el volante gira alrededor de su eje y el eje precesa en horizontal. $\vec L$ (verde) va por el eje, el peso (rojo) tira hacia abajo y la torca $\vec\tau=\vec r\times\vec w$ (morada) es horizontal y perpendicular a $\vec L$: por eso $\vec L$ <i>gira</i> en vez de caer. Sube $\omega$ y la precesión se hace más lenta ($\Omega\propto1/\omega$); aleja el centro del pivote y se acelera ($\Omega\propto r$); un volante de mayor radio $R$, con más $I$, precesa más despacio ($\Omega\propto1/R^2$); la masa no influye. Con $\omega=277$ rad/s, $r=2{,}0$ cm y $R=3{,}0$ cm se reproduce el ejemplo 10.13 ($\Omega=1{,}57$ rad/s, 4,0 s por vuelta). El giro propio se dibuja mucho más lento que el real, y las flechas no están a escala entre sí. <span class="src" data-l="P" data-ref="Interactivo propio de U §10.7, ecs. 10.32-10.33 y ejemplo 10.13 (p. 325)">P</span></figcaption>
</figure>
