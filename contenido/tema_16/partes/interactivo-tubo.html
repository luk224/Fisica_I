  <img class="int-static" src="../assets/img/int_tubo-sonoro.png" alt="Interactivo: un tubo sonoro abierto o cerrado con sus nodos y antinodos de desplazamiento, la amplitud de presión y las partículas de aire que oscilan; se varían el tipo de tubo, el modo, la longitud, el gas y la temperatura y se leen la longitud de onda y la frecuencia">
  <figcaption><b>Pruébalo tú:</b> el tubo (arriba, la amplitud de desplazamiento; abajo, la de presión; en el centro, las partículas de aire, con la amplitud muy exagerada). <b>Observa:</b> (1) con aire a 20 °C y $L=0{,}50$ m, el <b>abierto</b> da $f_1=344$ Hz y el <b>cerrado</b> $f_1=172$ Hz: la misma longitud, una octava más grave; (2) en el cerrado, los modos que ofrece el selector son $n=1,3,5,7$ (faltan los pares); (3) donde el azul tiene un <b>antinodo</b> (A) el naranja tiene un <b>nodo</b>, y viceversa; las partículas se amontonan y separan alrededor de los nodos de desplazamiento (compresión y rarefacción); (4) cambia a <b>helio</b> (999 m/s): $\lambda$ no cambia (solo depende de $L$ y del tipo de tubo), pero $f$ sube a 999 Hz para el abierto, como la voz «de pito» del que inhala helio; (5) sube la <b>temperatura</b>: $v\propto\sqrt T$ y todas las frecuencias suben (los instrumentos de viento suenan más agudos al calentarse). <span class="src" data-l="P" data-ref="Interactivo propio de U §16.4-16.5 (ec. 16.10, 16.16-16.23, figs. 16.13, 16.17 y 16.18; cuestión C1 y problemas 16.26 y 16.64)">P</span></figcaption>
</figure>
