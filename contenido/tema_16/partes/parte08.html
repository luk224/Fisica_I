<div class="box warn"><span class="h">Error típico</span><p>(1) Sumar decibelios: dos máquinas de 60 dB no dan 120 dB, sino 63 dB (se suman las <b>intensidades</b> y luego se pasa a dB). (2) Pensar que el nivel en dB cumple el inverso del cuadrado: es la intensidad la que lo cumple. (3) Olvidar el 10 delante del $\log$ (con el bel serían 1).</p></div>
