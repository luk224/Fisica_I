  <figcaption><b>Pruébalo tú:</b> la fuente S emite 100 Hz y se mueve hacia la derecha; cada círculo azul es una cresta, centrada donde estaba S al emitirla (cruces grises); el receptor L₁, delante (a la derecha), es rojo, y el L₂, detrás (a la izquierda), verde. <b>Observa:</b> (1) con $u_S=100$ m/s, delante las crestas se aprietan ($\lambda=2{,}40$ m, $f_1=141{,}7$ Hz) y detrás se separan ($\lambda=4{,}40$ m, $f_2=77{,}3$ Hz); (2) con la fuente parada y el receptor L₁ acercándose a 30 m/s lees $f_1=108{,}8$ Hz: el receptor móvil <b>no cambia $\lambda$</b>, solo cambia la rapidez con que cruza las crestas (compara con el ejemplo 16.16); (3) compara $u_S=170$ m/s ($v/2$) con $v_L=+170$ m/s: aunque la velocidad relativa es la misma, $f$ sale $2f_S=200$ Hz en el primer caso y $1{,}5f_S=150$ Hz en el segundo (problema 16.48); (4) sube $u_S$ hasta $v=340$ m/s: las crestas se apilan delante ($\lambda\to0$, $f_L\to\infty$: la «barrera del sonido»); (5) por encima de 340 m/s aparece la <b>onda de choque</b> (cono de líneas de trazo) con $\sin\alpha=v/u_S$. <span class="src" data-l="P" data-ref="Interactivo propio de U §16.8-16.9 (ec. 16.25-16.29 y 16.31, figs. 16.27, 16.28 y 16.36; ejemplos 16.14-16.16 y problema 16.48)">P</span></figcaption>
</figure>
