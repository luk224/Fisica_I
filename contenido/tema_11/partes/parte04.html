  <figcaption><b>Pruébalo tú:</b> la curva de la fig. 11.19 con tus propios números. Al subir el <b>módulo de Young $Y$</b> la recta se hace más empinada (material más rígido: menos deformación con el mismo esfuerzo). Mueve el <b>punto de carga</b>: mientras estés antes de $b$ y descargues, vuelves a $\varepsilon=0$; pasado $b$, la descarga (recta a trazos de pendiente $Y$) te deja con una <b>deformación permanente</b>. Con «Ampliar la zona elástica» ves la recta y los puntos $a$ y $b$, que a escala real son estrechísimos (menos del 1 %). Con $\varepsilon_f$ pequeña tienes un material frágil. El modelo es didáctico, no una aleación concreta. <span class="src" data-l="P" data-ref="Interactivo propio de U §11.5, fig. 11.19, p. 353">P</span></figcaption>
