  <figcaption><b>Pruébalo tú:</b> la escalera del ejemplo 11.3. Con los valores iniciales ($\theta=53{,}1^\circ$, 800 N, 180 N, $s\approx1{,}67$ m) lees $n_2=980$ N, $n_1=f_s\approx268$ N y $\mu_{s,\text{mín}}=0{,}27$. Sube al hombre con el deslizador de posición: $n_2$ <b>no cambia</b>, pero $n_1$ y la fricción necesaria crecen, hasta que $f_s$ supera $\mu_sn_2$ y la escalera resbala. Prueba a <b>enderezar</b> la escalera (ángulo mayor): disminuye la fricción necesaria. Con 160 N de escalera, 740 N de hombre y $\mu_s=0{,}40$ reproduces el ejercicio 11.10 (E4): el hombre llega a 2,7 m. <span class="src" data-l="P" data-ref="Interactivo propio de U Ejemplo 11.3 y Ejercicio 11.10, pp. 345 y 357">P</span></figcaption>
