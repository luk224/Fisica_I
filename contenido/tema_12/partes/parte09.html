  <img class="int-static" src="../assets/img/int_flotacion.png" alt="Interactivo: un cubo en un líquido, libre o colgado de un hilo; se pueden variar el líquido, la densidad del cuerpo y su tamaño, y se ven el peso, el empuje, las fuerzas de presión en las caras, la parte sumergida y la tensión">
  <figcaption><b>Pruébalo tú:</b> un cubo en un líquido. Con el cuerpo <b>libre</b>, sube la densidad del cuerpo: mientras $\rho_c\le\rho_f$ flota con la fracción sumergida $f=\rho_c/\rho_f$ (compruébalo: hielo, 920 kg/m³, en agua de mar queda sumergido el 89 %), y cuando $\rho_c\gt\rho_f$ se va al fondo. Observa que el empuje $B$ es siempre la diferencia entre la fuerza de la presión en la cara inferior y en la superior, y que las dos caras están a profundidades distintas (la recta de la derecha, con pendiente $\rho_fg$). Con el cuerpo <b>colgado</b> y totalmente sumergido, $T=mg-B$: con la estatua del ejemplo 12.5 ($\rho_c=19\,300$ kg/m³, $a\approx9{,}2$ cm, agua de mar) lees $B\approx7{,}9$ N y $T\approx139$ N; si $\rho_c\lt\rho_f$ sale $T\lt0$ (el hilo no puede empujar). Cambia a mercurio: casi todo flota. <span class="src" data-l="P" data-ref="Interactivo propio de §12.3 y del ejemplo 12.5 de U, pp. 376-378">P</span></figcaption>
</figure>
