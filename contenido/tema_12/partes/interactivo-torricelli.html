  <img class="int-static" src="../assets/img/int_torricelli.png" alt="Interactivo: tanque con un orificio lateral; se pueden variar la altura del líquido, la profundidad del orificio, la presión del aire sobre el líquido y el diámetro del orificio, y se ven la rapidez de salida, el caudal y el alcance del chorro">
  <figcaption><b>Pruébalo tú:</b> un tanque grande con un orificio. Con presión manométrica del aire 0 (tanque abierto) $v=\sqrt{2gh}$: el alcance horizontal $x=2\sqrt{h(H-h)}$ es máximo, $x=H$, con el orificio a media altura ($h=H/2$). Con $H=15$ m, $h=14{,}0$ m y $d=6$ mm reproduces el ejercicio 12.44 (E9): $v=16{,}6$ m/s y $Q=0{,}468$ L/s. Con agua de mar, $H=11$ m, $h=11$ m y 3,00 atm reproduces el 12.41 (E11): $v=28{,}4$ m/s (frente a 14,7 abierto). Al subir la presión del aire, $v$ crece como $\sqrt{2p/\rho+2gh}$ aunque $h$ no cambie. La lectura de Bernoulli de abajo muestra que $p+\rho gh$ en la superficie coincide con $\tfrac12\rho v^2$ en el chorro. <span class="src" data-l="P" data-ref="Interactivo propio del ejemplo 12.8 de U, pp. 383-384 y de los ejercicios 12.41 y 12.44, pp. 392-393">P</span></figcaption>
</figure>
