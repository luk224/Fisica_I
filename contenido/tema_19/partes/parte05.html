  <figcaption><b>Pruébalo tú: los cuatro procesos.</b> Elige el proceso, el tipo de gas y cuánto cambia el volumen (o la presión en el isocórico); el área sombreada es $W$. <b>Observa:</b> (1) con gas monoatómico, $T_1=300$ K y $V_2/V_1=2$: el <b>isobárico</b> da $W=+2494$ J, $\Delta U=+3741$ J y $Q=+6235$ J ($Q=\tfrac52W$); el <b>isotermo</b>, $W=Q=+1729$ J y $\Delta U=0$; el <b>adiabático</b>, $T_2=189$ K, $W=+1384$ J, $\Delta U=-1384$ J y $Q=0$ (el gas se enfría); (2) en el <b>isocórico</b> ($p_2/p_1=2$) $W=0$ y $Q=\Delta U=+3741$ J; (3) con $V_2/V_1&lt;1$ el área cambia de color: $W&lt;0$ (compresión); (4) cambia a diatómico: $\gamma=7/5$ y la adiabática es menos empinada; (5) la primera ley $Q-W=\Delta U$ se cumple siempre. Los estados 1 usan $p_1=1$ atm y $V_1=nRT_1/p_1$ ($24{,}6$ L a 300 K). <span class="src" data-l="P" data-ref="Interactivo propio de U §19.5, §19.7 y §19.8, pp. 628-636">P</span></figcaption>
</figure>
