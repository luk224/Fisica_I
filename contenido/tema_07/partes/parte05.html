  <figcaption><b>Pruébalo tú:</b> elige la curva $U(x)$ (resorte, pozo doble o Lennard-Jones simplificado), sube o baja la energía total $E$ y mueve la partícula. El tramo entre la curva y la línea $E$ (región permitida) mide $K=E-U$; los puntos de retorno, los mínimos (equilibrio estable) y los máximos (inestable) se distinguen en la leyenda; la flecha sobre la partícula es $F=-dU/dx$. Con el pozo doble y $E=-5$ J, la partícula en $x=1{,}1$ m tiene $U=-9{,}75$ J, $K=4{,}75$ J y $F=+4{,}88$ N, y oscila entre $x=0{,}65$ y $1{,}57$ m sin poder cruzar la barrera central: súbela por encima de $E=0$ y cruzará. Con $E<0$ en Lennard-Jones queda ligada; con $E\ge0$ escapa. <span class="src" data-l="P" data-ref="Interactivo propio de diagramas de energía (U §7.4-7.5, pp. 221-225)">P</span></figcaption>
</figure>
