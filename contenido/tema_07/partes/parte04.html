  <figcaption><b>Pruébalo tú:</b> mueve el bloque con el deslizador «recorrido s» y mira cómo la barra apilada se reparte entre $U_{el}$, $K$, $U_{grav}$ y la energía interna $\Delta U_{int}$ ganada por la fricción, <i>siempre sumando</i> la energía inicial del resorte. Con $m=1{,}5$ kg, $\theta=30^\circ$, $\mu_k=0{,}50$, $U_{el,0}=119$ J y $s=6$ m obtienes $K\approx36{,}7$ J ($v\approx7$ m/s), $U_{grav}=44{,}1$ J y $\Delta U_{int}=38{,}2$ J (examen Feb. 2022 2ª sem. y problema 7.73); con $m=1{,}5$ kg, $\theta=25^\circ$, $\mu_k=0{,}4$, $g=9{,}81$, $U_{el,0}=84{,}8$ J y $s=5$ m: $K=27{,}0$ J ($v=6$ m/s), $U_{grav}=31{,}1$ J y $\Delta U_{int}=26{,}7$ J (examen Sep. 2024). Con el resorte de $k=2000$ N/m el bloque se separa de él tras recorrer $x_0=\sqrt{2U_{el,0}/k}$ (unos 0,3 m). <span class="src" data-l="P" data-ref="Interactivo propio de la conservación de la energía con resorte, rampa y fricción (U §7.2-7.3, pp. 212-220; Examen Febrero 2022 (2ª semana) P-1; Examen Septiembre 2024 P-1)">P</span></figcaption>
</figure>
