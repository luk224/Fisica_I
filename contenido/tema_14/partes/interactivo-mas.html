  <figcaption><b>Pruébalo tú:</b> el MAS completo en una imagen (con el eje $x$ girado a la vertical para que todo quede a la misma altura). El <b>fasor</b> (flecha azul) de longitud $A$ gira con $\omega$; el punto rojo sobre el círculo y el punto de la curva $x(t)$ están a la <b>misma altura</b> que el bloque: la altura del fasor <i>es</i> la posición. Pon primero el ejemplo 14.3 ($m=0{,}5$, $k=200$, $x_0=1{,}5$ cm, $v_{0x}=0{,}40$ m/s) y lee $A=0{,}0250$ m y $\phi=-0{,}927$ rad; luego el ejercicio 14.14 ($m=2$, $k=300$, $x_0=20$ cm, $v_{0x}=-4$ m/s): $A=0{,}383$ m, $\phi=1{,}02$ rad, $T=0{,}513$ s. Mueve $x_0$ y $v_{0x}$: cambian $A$ y $\phi$ pero <b>$T$ no se mueve</b>. Mueve $m$ o $k$: ahora sí cambia $T$. Mira las barras: $K$ y $U$ se intercambian pero siempre suman $E=\tfrac12kA^2$ (la barra gris); pon $v_{0x}=0$ ($\phi=0$) y detén el reproductor en $t=T/8$: comprobarás que $K=U$ (ocurre cuando $|x|=A/\sqrt2$, cuatro veces por periodo). <span class="src" data-l="P" data-ref="Interactivo propio de U §14.2-14.3 (ejemplos 14.3 y 14.4, figs. 14.5 y 14.14) y ejercicio 14.14">P</span></figcaption>
</figure>
