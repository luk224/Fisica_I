  <figcaption><b>Pruébalo tú:</b> el mismo oscilador ($m$, $k$) y el mismo amortiguamiento $b$ en dos situaciones. <b>A la izquierda</b>, se suelta desde el reposo y se deja oscilar (§7); <b>a la derecha</b>, se empuja con una fuerza de frecuencia $\omega_d$ (§8, ec. 14.46). Empieza con $b/b_{crít}=0{,}10$: ves muchos ciclos decayendo con la envolvente punteada y, a la derecha, un pico alto y estrecho ($5F_{máx}/k$) en $\omega_d\approx\omega$. Sube $b$: la envolvente cae más deprisa, el periodo $T'$ crece ($\omega'$ baja) y el pico se achata y se corre hacia la izquierda. En $b/b_{crít}=1$ (crítico) la curva de la izquierda <b>deja de oscilar</b> y vuelve al equilibrio sin pasarse; con $b/b_{crít}\ge0{,}71$ (es decir, $b\ge\sqrt{2km}$) el pico de la derecha ya no existe. Pon $m=0{,}30$ kg, $k=2{,}5$ N/m y $b/b_{crít}=0{,}52$ ($b=0{,}90$ kg/s): $\omega'=2{,}47$ rad/s, $f'=0{,}393$ Hz, $b_{crít}=1{,}73$ kg/s. Las curvas tenues de la derecha son las de la figura 14.28 de U. <span class="src" data-l="P" data-ref="Interactivo propio de U §14.7-14.8 (ec. 14.42-14.46, figs. 14.26 y 14.28)">P</span></figcaption>
</figure>
