<div class="box tip"><span class="h">Truco de examen</span><p>Si el enunciado da $a$ (o $g$, o una fuerza) como función de $t$ en vez de un número fijo, es la señal de que hay que integrar (sección 2.6), no usar las cuatro ecuaciones de la sección 2.4. Es exactamente el caso del ejercicio del cohete más abajo, en «Ejercicios resueltos».</p></div>
