<div class="box intu"><span class="h">Idea intuitiva</span><p>Igual que la velocidad mide cómo cambia la posición, la <b>aceleración</b> mide cómo cambia la <i>velocidad</i>. Es el mismo patrón otra vez: aceleración media = "cuerda" en una gráfica $v_x$-$t$; aceleración instantánea = "tangente" en esa misma gráfica.</p></div>
