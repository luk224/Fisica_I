  <img class="int-static" src="../assets/img/int_maxwell.png" alt="Interactivo: distribución de rapideces de Maxwell-Boltzmann de dos gases con su temperatura, con las rapideces más probable, media y eficaz, y la fracción de moléculas por encima de una rapidez elegida, en escala lineal o logarítmica">
  <figcaption><b>Pruébalo tú:</b> la curva azul es el gas A y la naranja el gas B; las líneas a trazos marcan $v_{mp}&lt;v_{med}&lt;v_{rms}$ de A y el área roja es la fracción de moléculas de A con $v>v_A$. <b>Observa:</b> (1) por defecto, N$_2$ a 298,15 K (curva azul): $v_{mp}=421$, $v_{med}=475$ y $v_{rms}=515$ m/s (proporción $1:1{,}128:1{,}225$); el CO$_2$ (naranja) a la misma $T$ tiene la misma energía cinética media pero es más lento ($v_{rms}=411$ m/s); (2) cambia B a H$_2$: $v_{rms}=1921$ m/s, la curva se aplana y se ensancha; (3) <b>sube $T_A$</b>: el máximo se desplaza a la derecha y la curva se aplana, con $v_{rms}\propto\sqrt T$ (cuadruplica la temperatura para duplicar $v_{rms}$); (4) con $v_A=2025$ m/s (la rapidez de escape de Europa, problema práctico) la fracción es $4{,}85\times10^{-10}$: en escala <b>lineal</b> la cola es invisible; pasa a escala <b>logarítmica</b> y verás el área sombreada; (5) acércate a $v_A=v_{rms}$ y la fracción baja a $0{,}39$, y a $2v_{rms}$, a $0{,}007$ (tabla 18.2). <span class="src" data-l="P" data-ref="Interactivo propio de U §18.5 (ec. 18.32-18.36; tabla 18.2; fig. 18.23; problema práctico p. 608)">P</span></figcaption>
</figure>
