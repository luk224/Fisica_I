  <img class="int-static" src="../assets/img/int_gas-ideal.png" alt="Interactivo: gas ideal en un cilindro con partículas que rebotan y su isoterma pV, y las isotermas del CO2 con la ecuación de van der Waals frente al gas ideal; se varían los moles, la temperatura y el volumen">
  <figcaption><b>Pruébalo tú:</b> en el modo de <b>partículas</b> pulsa ▶ y mueve los deslizadores (el número de puntos es ilustrativo: 12 por mol; no son las $N=nN_A$ reales). <b>Observa:</b> (1) por defecto $n=1$ mol, $T=300$ K, $V=24$ L: $p=nRT/V=1{,}026$ atm (el estado marcado en la isoterma); (2) <b>reduce $V$ a la mitad</b> con $T$ fija: la presión se duplica y $pV$ no cambia (isoterma: hipérbola); (3) <b>sube $T$</b> con $V$ fijo: las partículas van más deprisa (rapidez dibujada $\propto\sqrt T$), la presión sube proporcionalmente y la energía cinética media $\tfrac32kT$ también; (4) con más moles hay más choques y más presión a igual $T$ y $V$. En el modo <b>CO$_2$</b>: a $T=350$ K y $V=0{,}200$ L, el gas ideal da $14{,}55$ MPa y el de van der Waals $9{,}40$ MPa (una diferencia del 35 %); a $V$ grande ambos coinciden; la isoterma de $T_c=304$ K tiene el punto de inflexión del punto crítico ($V_c=0{,}128$ L, $p_c=7{,}39$ MPa); por debajo de $T_c$ (prueba 270 K) la isoterma se curva en un lazo. <span class="src" data-l="P" data-ref="Interactivo propio de U §18.1 (ec. 18.3 y 18.7; figs. 18.6-18.7; ejemplos 18.1-18.3)">P</span></figcaption>
</figure>
