<div class="box intu"><span class="h">Idea intuitiva</span><p>Sumar vectores gráficamente (con regla y transportador) es lento e impreciso. Es mucho mejor descomponer cada vector en sus "sombras" sobre los ejes $x$ e $y$ (sus <b>componentes</b>) y sumar número con número: la parte horizontal con la horizontal, la vertical con la vertical.</p></div>
