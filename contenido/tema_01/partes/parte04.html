<p>Un <b>modelo idealizado</b> es una simplificación deliberada: tratar la Tierra como una esfera perfecta, un cable como si no tuviera masa, un gas como "ideal". No es hacer trampa: es quedarte con lo que importa para el problema y descartar lo que complica sin cambiar la respuesta de forma relevante.
