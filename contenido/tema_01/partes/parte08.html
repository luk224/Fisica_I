<div class="box tip"><span class="h">Truco de examen</span><p>Antes de dar por bueno cualquier resultado numérico, comprueba las <b>unidades</b> (análisis dimensional): si te piden una velocidad y te sale en kg, algo se rompió por el camino. Es la revisión más barata y más eficaz de la estrategia IPEE (paso "Evaluar").</p></div>
