<div class="box tip"><span class="h">Truco de examen</span><p>Para comparar «quién se calienta más rápido» con el mismo calor y masa, mira el calor específico: $\Delta T=Q/(mc)$; a menor $c$ (metales), mayor $\Delta T$. El agua tiene un $c$ enorme: por eso modera el clima junto al mar y por eso se usa como refrigerante.</p></div>
