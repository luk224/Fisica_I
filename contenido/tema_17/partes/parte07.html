  <img class="int-static" src="../assets/img/int_dilatacion-termica.png" alt="Interactivo: una barra metálica entre dos paredes; se eligen el material, la longitud, las temperaturas inicial y final, y el hueco o la sujeción, y se leen la dilatación libre y el esfuerzo térmico">
  <figcaption><b>Pruébalo tú:</b> la barra (contorno a trazos: tamaño inicial; la dilatación dibujada está <b>multiplicada por 100</b>). <b>Observa:</b> (1) con <b>acero</b>, $L_0=12$ m, de $-9$ a $33$ °C y <b>hueco 0</b>: dilatación libre 6,05 mm y esfuerzo $\approx-1{,}0\times10^{8}$ Pa (el problema 17.21 de §8); (2) con un <b>hueco de 6,0 mm</b> el esfuerzo casi desaparece ($-0{,}8$ MPa), y con 7,0 mm la barra se dilata libre y es cero; (3) el esfuerzo <b>no depende de $L_0$</b> (muévelo y comprueba) pero la dilatación libre sí; (4) con el <b>aluminio</b> y de 17 a 22 °C ($\Delta T=5$ C°) sale $\approx-8{,}4$ MPa: el cilindro del ejemplo 17.4; (5) con la barra <b>soldada</b> a las dos paredes y bajando la temperatura, la barra queda <b>estirada</b> (tracción, esfuerzo positivo). <span class="src" data-l="P" data-ref="Interactivo propio de U §17.4 (ec. 17.6, 17.7 y 17.12; ejemplo 17.4; problema 17.21)">P</span></figcaption>
</figure>
