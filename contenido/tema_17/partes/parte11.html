  <figcaption><b>Pruébalo tú:</b> en el modo «curva de calentamiento» mueve el <b>avance</b> y mira el punto. <b>Observa:</b> (1) por defecto es el problema 17.45 (18,0 g de hielo a $-10$ °C): los cuatro tramos valen 378 J, 6012 J, 7542 J y 40 608 J, y la <b>vaporización es el 74 %</b> del total; (2) en las <b>mesetas</b> el calor sigue entrando pero $T$ no cambia; (3) con más masa los tramos se alargan en proporción, pero las temperaturas de las mesetas son siempre 0 y 100 °C; (4) con el eje <b>Q</b> la potencia no cambia la curva; elige el eje <b>tiempo</b> ($t=Q/P$) y la potencia estira o encoge la curva horizontalmente (el doble de potencia, la mitad de tiempo). En el modo «mezcla de agua e hielo», el agua que se enfría (azul, baja) y el hielo que se calienta (verde, sube) se cruzan en el equilibrio: con 1,5 kg de agua a 28 °C y 0,6 kg de hielo a $-22$ °C (problema 17.93) la temperatura final es 0 °C, se funden 0,444 kg y <b>quedan 0,156 kg de hielo</b>; sube el agua a 60 °C y el cruce pasa a ser $T\approx16{,}9$ °C con todo fundido. <span class="src" data-l="P" data-ref="Interactivo propio de U §17.5-17.6 (ec. 17.13 y 17.20; fig. 17.20; ejemplos 17.7-17.9; problemas 17.45 y 17.93)">P</span></figcaption>
</figure>
