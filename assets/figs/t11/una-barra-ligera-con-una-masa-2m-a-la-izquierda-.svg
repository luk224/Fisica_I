  <text x="138.0" y="98" class="bd" text-anchor="middle" style="fill:var(--X)">cg</text>
  <line x1="66.0" y1="125" x2="138.0" y2="125" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="138.0" y1="125" x2="282.0" y2="125" stroke="var(--A)" stroke-width="1.5"/>
  <line x1="66.0" y1="120" x2="66.0" y2="130" stroke="var(--fg)" stroke-width="1.2"/>
