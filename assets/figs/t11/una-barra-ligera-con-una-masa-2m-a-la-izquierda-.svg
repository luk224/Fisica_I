  <text x="170" y="14" class="" text-anchor="middle">Torcas respecto al cg: (2mg)d<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> = (mg)d</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3"></tspan></text>
