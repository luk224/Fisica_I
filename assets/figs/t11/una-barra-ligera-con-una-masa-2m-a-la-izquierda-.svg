<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 160" width="100%" role="img" aria-label="Una barra ligera con una masa 2m a la izquierda y una masa m a la derecha, apoyada en su centro de gravedad, que queda más cerca de la masa mayor">
  <defs><marker id="macg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbcg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmcg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgcg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpcg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfcg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="30" y="60" width="288" height="8" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <circle cx="66.0" cy="50" r="11" fill="var(--acc)" fill-opacity="0.25" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="282.0" cy="50" r="7" fill="var(--acc)" fill-opacity="0.25" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="66.0" y="54" class="bd" text-anchor="middle">2m</text>
  <text x="282.0" y="54" class="bd" text-anchor="middle">m</text>
  <line x1="66.0" y1="68" x2="66.0" y2="110" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#mfcg)"/>
  <line x1="282.0" y1="68" x2="282.0" y2="90" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#mfcg)"/>
  <text x="72.0" y="104" class="">2mg</text>
  <text x="288.0" y="88" class="">mg</text>
