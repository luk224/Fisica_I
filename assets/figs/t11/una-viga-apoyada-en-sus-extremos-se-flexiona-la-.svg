<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 200" width="100%" role="img" aria-label="Una viga apoyada en sus extremos se flexiona: la parte superior está en compresión y la inferior en tensión; la sección en I es ancha arriba y abajo y estrecha en el centro">
  <defs><marker id="macw" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbcw" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmcw" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgcw" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpcw" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfcw" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="20" y="14" class="bd">Viga apoyada en los extremos</text>
  <path d="M 30 70 L 130 78 L 230 70" fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M 30 70 L 130 78 L 230 70" fill="none" stroke="var(--acc)" stroke-width="3.5"/>
  <path d="M 30 64 L 130 72 L 230 64" fill="none" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="100" y1="50" x2="100" y2="70" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#mfcw)"/>
  <line x1="130" y1="50" x2="130" y2="74" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#mfcw)"/>
  <line x1="160" y1="50" x2="160" y2="74" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#mfcw)"/>
  <text x="130" y="46" class="sm" text-anchor="middle">carga</text>
  <text x="246" y="62" class="sm">arriba:</text>
  <text x="246" y="76" class="bd" style="fill:var(--A)">compresión</text>
  <text x="246" y="98" class="sm">abajo:</text>
  <text x="246" y="112" class="bd" style="fill:var(--acc)">tensión</text>
  <text x="130" y="110" class="sm" text-anchor="middle">línea central: ni una ni otra</text>
  <rect x="40" y="138" width="60" height="10" rx="2" fill="var(--acc)" fill-opacity="0.35" stroke="var(--acc)" stroke-width="1.5"/>
  <rect x="65" y="148" width="10" height="30" rx="2" fill="var(--acc)" fill-opacity="0.2" stroke="var(--acc)" stroke-width="1.5"/>
  <rect x="40" y="178" width="60" height="10" rx="2" fill="var(--acc)" fill-opacity="0.35" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="112" y="146" class="sm">ancho: aguanta compresión</text>
  <text x="112" y="186" class="sm">ancho: aguanta tensión</text>
  <text x="112" y="166" class="sm">estrecho: ahorra peso</text>
</svg>
