  <text x="236" y="40" class="sm">V₀ = 1,000 m³</text>
  <text x="10" y="82" class="bd">Fondo (p = 1,16×10⁸ Pa)</text>
  <rect x="10" y="90" width="208.3" height="22" rx="2" fill="var(--A)" fill-opacity="0.25" stroke="var(--A)" stroke-width="1.5"/>
  <text x="224" y="106" class="sm">0,947 m³</text>
  
  <text x="10" y="138" class="">ρ: 1,03×10³ → 1,09×10³ kg/m³</text>
