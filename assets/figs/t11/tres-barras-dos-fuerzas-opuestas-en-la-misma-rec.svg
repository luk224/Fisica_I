<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 150" width="100%" role="img" aria-label="Tres barras: dos fuerzas opuestas en la misma recta (equilibrio), un par de fuerzas (la barra gira aunque la fuerza neta es cero) y una fuerza única (la barra se acelera)">
  <defs><marker id="maca" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbca" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmca" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgca" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpca" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfca" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="55" y="14" class="bd" text-anchor="middle">Equilibrio</text>
  <text x="170" y="14" class="bd" text-anchor="middle">Gira</text>
  <text x="285" y="14" class="bd" text-anchor="middle">Se acelera</text>
  <rect x="15" y="60" width="80" height="10" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="50" y1="65" x2="8" y2="65" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#maca)"/>
  <line x1="60" y1="65" x2="102" y2="65" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#maca)"/>
  <text x="55" y="52" class="bd" text-anchor="middle">F</text>
  <text x="55" y="98" class="" text-anchor="middle">ΣF = 0</text>
  <text x="55" y="114" class="" text-anchor="middle">Στ = 0</text>
  <rect x="130" y="60" width="80" height="10" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="140" y1="100" x2="140" y2="74" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#maca)"/>
  <line x1="200" y1="30" x2="200" y2="56" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#maca)"/>
  <path d="M 150.9 54.0 A 22 22 0 0 0 189.1 54.0" fill="none" stroke="var(--A)" stroke-width="1.3"/>
  <line x1="192" y1="52" x2="197" y2="55" stroke="var(--A)" stroke-width="2" fill="none" marker-end="url(#mbca)"/>
  <text x="170" y="98" class="" text-anchor="middle">ΣF = 0</text>
  <text x="170" y="114" class="" text-anchor="middle">Στ ≠ 0</text>
  <rect x="245" y="60" width="80" height="10" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="285" y1="100" x2="285" y2="74" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#maca)"/>
  <text x="285" y="52" class="bd" text-anchor="middle">a<tspan dy="3" font-size="9">cm</tspan><tspan dy="-3"></tspan></text>
  <text x="285" y="125" class="" text-anchor="middle">ΣF ≠ 0</text>
  <text x="170" y="142" class="sm" text-anchor="middle">Solo hay equilibrio si ΣF = 0 y Στ = 0</text>
</svg>
