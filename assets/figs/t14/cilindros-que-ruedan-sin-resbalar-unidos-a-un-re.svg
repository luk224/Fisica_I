<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 216" width="100%" role="img" aria-label="Cilindros que ruedan sin resbalar unidos a un resorte: fuerza del resorte en el eje y fricción estática en el contacto">
  <defs><marker id="map1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbp1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmp1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgp1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpp1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfp1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="10" y1="150" x2="330" y2="150" stroke="var(--fg)" stroke-width="2.5"/>
  <rect x="300" y="70" width="8" height="80" rx="2" fill="var(--mut)" fill-opacity="0.4" stroke="var(--mut)" stroke-width="1.5"/>
  <circle cx="140" cy="105" r="45" fill="var(--acc)" fill-opacity="0.2" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="140" cy="105" r="3" fill="var(--fg)"/>
  <path d="M 140 105 L 150.0 105.0 L 155.8 112.0 L 167.5 98.0 L 179.2 112.0 L 190.8 98.0 L 202.5 112.0 L 214.2 98.0 L 225.8 112.0 L 237.5 98.0 L 249.2 112.0 L 260.8 98.0 L 272.5 112.0 L 284.2 98.0 L 290.0 105.0 L 300 105" fill="none" stroke="var(--fg)" stroke-width="1.6"/>
  <line x1="140" y1="105" x2="171.5" y2="73.5" stroke="var(--mut)" stroke-width="1.2"/>
  <text x="162" y="93" class="sm">R</text>
  <line x1="143" y1="93" x2="202" y2="93" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#map1)"/>
  <text x="206" y="89" class="bd" style="fill:var(--acc)">k|x|</text>
  <line x1="140" y1="156" x2="112" y2="156" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbp1)"/>
  <text x="108" y="170" class="sm bd" text-anchor="end" style="fill:var(--A)">f = k|x|/3</text>
  <line x1="140" y1="109" x2="140" y2="141" stroke="var(--X)" stroke-width="2.5" fill="none" marker-end="url(#mgp1)"/>
  <text x="134" y="135" class="sm bd" text-anchor="end" style="fill:var(--X)">Mg</text>
  <path d="M 150.8 88.2 A 20 20 0 0 0 122.1 113.9" fill="none" stroke="var(--E)" stroke-width="1.3"/>
  <text x="132" y="79" class="sm bd" text-anchor="end" style="fill:var(--E)">α</text>
  <line x1="40" y1="30" x2="14" y2="30" stroke="var(--fg)" stroke-width="2" fill="none" marker-end="url(#mfp1)"/>
  <text x="48" y="34" class="sm">x &lt; 0 al soltar (resorte estirado)</text>
  <text x="170" y="190" class="sm bd" text-anchor="middle">masa efectiva M<tspan dy="3" font-size="9">ef</tspan><tspan dy="-3"> = M + I/R² = 3M/2</tspan></text>
  <text x="170" y="206" class="sm" text-anchor="middle">(sin fricción no habría torque ni giro)</text>
</svg>
