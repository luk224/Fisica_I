<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 218" width="100%" role="img" aria-label="Masa efectiva de un oscilador que rueda: 1,4 M para una esfera maciza, 1,5 M para un cilindro, 2 M para un aro">
  <defs><marker id="mae16" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe16" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme16" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge16" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe16" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe16" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="130" y="28" width="60.0" height="24" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="124" y="45" class="sm" text-anchor="end">sin rodar (bloque)</text>
  <text x="196.0" y="45" class="sm bd">M<tspan dy="3" font-size="9">ef</tspan><tspan dy="-3"> = 1,0 M</tspan></text>
  <rect x="130" y="68" width="84.0" height="24" rx="2" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <text x="124" y="85" class="sm" text-anchor="end">esfera maciza</text>
  <text x="220.0" y="85" class="sm bd">M<tspan dy="3" font-size="9">ef</tspan><tspan dy="-3"> = 1,4 M</tspan></text>
  <rect x="130" y="108" width="90.0" height="24" rx="2" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="124" y="125" class="sm" text-anchor="end">cilindro macizo</text>
  <text x="226.0" y="125" class="sm bd">M<tspan dy="3" font-size="9">ef</tspan><tspan dy="-3"> = 1,5 M</tspan></text>
  <rect x="130" y="148" width="120.0" height="24" rx="2" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="124" y="165" class="sm" text-anchor="end">aro</text>
  <text x="256.0" y="165" class="sm bd">M<tspan dy="3" font-size="9">ef</tspan><tspan dy="-3"> = 2,0 M</tspan></text>
  <line x1="130" y1="18" x2="130" y2="188" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="170" y="208" class="sm bd" text-anchor="middle">T = T₀ √(M<tspan dy="3" font-size="9">ef</tspan><tspan dy="-3">/M),  T₀ = 2π√(M/k)</tspan></text>
</svg>
