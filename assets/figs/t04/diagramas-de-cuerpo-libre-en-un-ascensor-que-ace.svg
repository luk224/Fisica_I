<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 330 200" width="100%" role="img" aria-label="Diagramas de cuerpo libre en un ascensor que acelera hacia arriba">
  <defs><marker id="mag3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbg3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmg3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgg3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpg3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfg3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="90" y="18" class="sm bd" text-anchor="middle">Persona (63.8 kg)</text>
  <text x="250" y="18" class="sm bd" text-anchor="middle">Paquete (3.85 kg)</text>
  <rect x="60" y="85" width="60" height="50" rx="2" fill="var(--mut)" fill-opacity="0.2" stroke="var(--mut)" stroke-width="1.5"/>
  <rect x="220" y="90" width="60" height="36" rx="2" fill="var(--mut)" fill-opacity="0.2" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="90" y1="85" x2="90" y2="30.1" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mag3)"/>
  <text x="98" y="50" class="sm bd" style="fill:var(--acc)">n = 784 N</text>
  <line x1="90" y1="135" x2="90" y2="178.8" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbg3)"/>
  <text x="98" y="170" class="sm bd" style="fill:var(--A)">w = 625 N</text>
  <line x1="250" y1="90" x2="250" y2="37.9" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mag3)"/>
  <text x="258" y="50" class="sm bd" style="fill:var(--acc)">T = 47.4 N</text>
  <line x1="250" y1="126" x2="250" y2="167.5" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbg3)"/>
  <text x="258" y="156" class="sm bd" style="fill:var(--A)">mg = 37.7 N</text>
  <line x1="150" y1="150" x2="150" y2="120" stroke="var(--X)" stroke-width="2.5" fill="none" marker-end="url(#mgg3)"/>
  <text x="158" y="140" class="sm bd" style="fill:var(--X)">a = 2.50 m/s²</text>
  <text x="158" y="154" class="sm">(hacia arriba)</text>
  <text x="165" y="188" class="sm" text-anchor="middle">n > w y T > mg porque ΣF debe apuntar hacia arriba</text>
</svg>
