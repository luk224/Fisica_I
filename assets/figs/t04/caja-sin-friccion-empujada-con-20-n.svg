<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 330 215" width="100%" role="img" aria-label="Caja sin fricción empujada con 20 N">
  <defs><marker id="maf3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbf3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmf3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgf3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpf3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mff3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="90" y="65" width="80" height="50" rx="2" fill="var(--mut)" fill-opacity="0.2" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="130" y="94" class="sm bd" text-anchor="middle">40 kg</text>
  <line x1="170" y1="90" x2="250" y2="90" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mgf3)"/>
  <text x="254" y="94" class="sm bd" style="fill:var(--X)">F = 20 N</text>
  <line x1="130" y1="65" x2="130" y2="15" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#maf3)"/>
  <text x="138" y="35" class="sm bd" style="fill:var(--acc)">n</text>
