  <text x="138" y="150" class="sm bd" style="fill:var(--A)">w = mg</text>
  <line x1="90" y1="198" x2="150" y2="198" stroke="var(--E)" stroke-width="2.5" fill="none" marker-end="url(#mpf3)"/>
  <text x="158" y="202" class="sm bd" style="fill:var(--E)">a = F/m = 0.50 m/s²</text>
