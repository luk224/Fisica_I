<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 235" width="100%" role="img" aria-label="Pares acción-reacción de una manzana sobre una mesa">
  <defs><marker id="maf5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbf5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmf5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgf5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpf5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mff5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="110" cy="70" r="15" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <rect x="40" y="120" width="150" height="18" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="115" y="133" class="sm" text-anchor="middle">mesa</text>
  <path d="M 20 215 Q 115 165 210 215" fill="var(--mut)" fill-opacity="0.2" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="115" y="212" class="sm" text-anchor="middle">Tierra</text>
  <line x1="100" y1="70" x2="100" y2="28" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbf5)"/>
  <text x="60" y="36" class="sm bd" text-anchor="end" style="fill:var(--A)">n</text>
  <line x1="122" y1="70" x2="122" y2="108" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#maf5)"/>
  <text x="130" y="100" class="sm bd" style="fill:var(--acc)">w</text>
  <line x1="100" y1="122" x2="100" y2="166" stroke="var(--A)" stroke-width="3" fill="none" stroke-dasharray="5 4" marker-end="url(#mbf5)"/>
  <text x="60" y="156" class="sm bd" text-anchor="end" style="fill:var(--A)">n'</text>
  <line x1="122" y1="190" x2="122" y2="170" stroke="var(--acc)" stroke-width="3" fill="none" stroke-dasharray="5 4" marker-end="url(#maf5)"/>
  <text x="130" y="184" class="sm bd" style="fill:var(--acc)">w'</text>
  <text x="215" y="36" class="sm bd">Sobre la manzana:</text>
  <text x="215" y="52" class="sm bd" style="fill:var(--A)">n (mesa → manzana)</text>
  <text x="215" y="66" class="sm bd" style="fill:var(--acc)">w (Tierra → manzana)</text>
  <text x="215" y="92" class="sm bd">Sus reacciones:</text>
  <text x="215" y="108" class="sm bd" style="fill:var(--A)">n' (manzana → mesa)</text>
  <text x="215" y="122" class="sm bd" style="fill:var(--acc)">w' (manzana → Tierra)</text>
  <text x="215" y="150" class="sm">Pares: n ↔ n’  y  w ↔ w’</text>
</svg>
