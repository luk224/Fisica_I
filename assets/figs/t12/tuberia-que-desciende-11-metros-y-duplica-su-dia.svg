<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 205" width="100%" role="img" aria-label="Tubería que desciende 11 metros y duplica su diámetro: la velocidad pasa de 3,00 a 0,750 metros por segundo y la presión manométrica de 5,00×10⁴ a 1,62×10⁵ pascales">
  <defs><marker id="mae10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="10" y1="40" x2="340" y2="40" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="10" y1="160" x2="340" y2="160" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M 15 40 L 115 40 L 180 160 L 325 160" fill="none" stroke="var(--acc)" stroke-opacity="0.4" stroke-width="9" stroke-linejoin="round"/>
  <path d="M 195 160 L 325 160" fill="none" stroke="var(--acc)" stroke-opacity="0.35" stroke-width="18"/>
  <line x1="25" y1="40" x2="70" y2="40" stroke="var(--X)" stroke-width="2.5" fill="none" marker-end="url(#mge10)"/>
  <line x1="240" y1="160" x2="262" y2="160" stroke="var(--X)" stroke-width="2.5" fill="none" marker-end="url(#mge10)"/>
  <text x="15" y="22" class="sm bd">1: v = 3,00 m/s, p = 5,00×10⁴ Pa</text>
  <text x="335" y="196" class="sm bd" text-anchor="end">2: v = 0,750 m/s, p = 1,62×10⁵ Pa</text>
  <line x1="235" y1="40" x2="235" y2="160" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="231" y1="40" x2="239" y2="40" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="231" y1="160" x2="239" y2="160" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="229" y="104" class="sm bd" text-anchor="end">11,0 m</text>
  <text x="100" y="125" class="sm" text-anchor="middle" style="fill:var(--acc)">d₂ = 2 d₁</text>
  <text x="100" y="141" class="sm" text-anchor="middle" style="fill:var(--acc)">A₂ = 4 A₁</text>
</svg>
