  <line x1="186" y1="40" x2="194" y2="40" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="186" y1="140" x2="194" y2="140" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="198" y="94" class="sm bd">h</text>
  <text x="268" y="80" class="sm" text-anchor="middle">Equilibrio de</text>
  <text x="268" y="96" class="sm" text-anchor="middle">la columna:</text>
  <text x="268" y="124" class="sm bd" text-anchor="middle">pA = p₀A + ρghA</text>
