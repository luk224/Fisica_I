  <defs><marker id="mac1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbc1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmc1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgc1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpc1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfc1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="70" y="40" width="100" height="130" fill="var(--acc)" fill-opacity="0.2" stroke="none"/>
  <path d="M 70 25 L 70 170 L 170 170 L 170 25" fill="none" stroke="var(--fg)" stroke-width="2"/>
  <rect x="90" y="40" width="60" height="100" rx="2" fill="var(--acc)" fill-opacity="0.12" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="90" y1="40" x2="150" y2="40" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="90" y1="140" x2="150" y2="140" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="125" y1="6" x2="125" y2="38" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mac1)"/>
  <line x1="125" y1="50" x2="125" y2="136" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbc1)"/>
  <line x1="125" y1="205" x2="125" y2="142" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mgc1)"/>
