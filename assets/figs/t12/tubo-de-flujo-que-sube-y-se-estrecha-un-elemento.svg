<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 228" width="100%" role="img" aria-label="Tubo de flujo que sube y se estrecha. Un elemento de fluido de volumen dV entra por la sección ancha, de área A1 y longitud ds1, empujado por la fuerza p1A1, y otro igual sale por la sección estrecha, de área A2 y longitud ds2, frenado por la fuerza p2A2. Altura y1 e y2 sobre un nivel de referencia.">
  <defs><marker id="mabd" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mabe" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker></defs>
  <path d="M 30 130 L 100 130 C 140 130 140 60 180 60 L 330 60 L 330 80 L 190 80 C 150 80 150 170 110 170 L 30 170 Z" fill="var(--acc)" fill-opacity="0.12" stroke="var(--fg)" stroke-width="2"/>
  <rect x="45" y="130" width="40" height="40" fill="var(--acc)" fill-opacity="0.35" stroke="var(--acc)" stroke-width="1.5"/>
  <rect x="240" y="60" width="80" height="20" fill="var(--acc)" fill-opacity="0.35" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="8" y1="150" x2="43" y2="150" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mabe)"/>
  <line x1="338" y1="70" x2="322" y2="70" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mabe)"/>
  <line x1="52" y1="150" x2="78" y2="150" stroke="var(--X)" stroke-width="2.5" fill="none" marker-end="url(#mabd)"/>
  <line x1="250" y1="70" x2="290" y2="70" stroke="var(--X)" stroke-width="2.5" fill="none" marker-end="url(#mabd)"/>
  <text x="8" y="144" class="sm bd" style="fill:var(--acc)">p₁A₁</text>
  <text x="336" y="100" class="sm bd" text-anchor="end" style="fill:var(--acc)">p₂A₂</text>
  <text x="65" y="164" class="sm bd" text-anchor="middle" style="fill:var(--X)">v₁</text>
  <text x="270" y="54" class="sm bd" text-anchor="middle" style="fill:var(--X)">v₂</text>
  <line x1="45" y1="118" x2="85" y2="118" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="45" y1="114" x2="45" y2="122" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="85" y1="114" x2="85" y2="122" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="65" y="110" class="sm bd" text-anchor="middle">ds₁</text>
  <line x1="240" y1="42" x2="320" y2="42" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="240" y1="38" x2="240" y2="46" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="320" y1="38" x2="320" y2="46" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="280" y="34" class="sm bd" text-anchor="middle">ds₂</text>
  <line x1="10" y1="205" x2="330" y2="205" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="330" y="219" class="sm" text-anchor="end">y = 0</text>
  <line x1="65" y1="172" x2="65" y2="205" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="60" y="193" class="sm bd" text-anchor="end">y₁</text>
  <line x1="280" y1="82" x2="280" y2="205" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="274" y="150" class="sm bd" text-anchor="end">y₂</text>
  <text x="10" y="14" class="sm">dV = A₁ds₁ = A₂ds₂ (continuidad)</text>
  <text x="10" y="30" class="sm">Trabajo de las presiones:</text>
  <text x="10" y="46" class="sm bd">p₁A₁ds₁ − p₂A₂ds₂</text>
  <text x="10" y="62" class="sm bd">= (p₁ − p₂) dV</text>
</svg>
