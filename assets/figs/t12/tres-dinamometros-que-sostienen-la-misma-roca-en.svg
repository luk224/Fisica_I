<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 235" width="100%" role="img" aria-label="Tres dinamómetros que sostienen la misma roca en el aire (39,2 newtons), en agua (28,4 newtons) y en un líquido desconocido (21,5 newtons)">
  <defs><marker id="mae6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="120" y="90" width="100" height="90" fill="var(--acc)" fill-opacity="0.2" stroke="none"/>
  <rect x="235" y="90" width="100" height="90" fill="var(--E)" fill-opacity="0.25" stroke="none"/>
  <line x1="115" y1="90" x2="225" y2="90" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="230" y1="90" x2="336" y2="90" stroke="var(--E)" stroke-width="1.5"/>
  <rect x="35" y="18" width="40" height="24" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="55" y="36" class="sm bd" text-anchor="middle">39,2 N</text>
  <line x1="55" y1="42" x2="55" y2="108" stroke="var(--fg)" stroke-width="1.5"/>
  <rect x="41" y="108" width="28" height="28" rx="2" fill="var(--mut)" fill-opacity="0.55" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="55" y="160" class="sm bd" text-anchor="middle">aire (peso real)</text>
  <rect x="150" y="18" width="40" height="24" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="170" y="36" class="sm bd" text-anchor="middle">28,4 N</text>
  <line x1="170" y1="42" x2="170" y2="108" stroke="var(--fg)" stroke-width="1.5"/>
  <rect x="156" y="108" width="28" height="28" rx="2" fill="var(--mut)" fill-opacity="0.55" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="170" y="170" class="sm bd" text-anchor="middle">agua</text>
  <text x="170" y="186" class="sm bd" text-anchor="middle" style="fill:var(--X)">B = 10,8 N</text>
  <rect x="265" y="18" width="40" height="24" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="285" y="36" class="sm bd" text-anchor="middle">21,5 N</text>
  <line x1="285" y1="42" x2="285" y2="108" stroke="var(--fg)" stroke-width="1.5"/>
  <rect x="271" y="108" width="28" height="28" rx="2" fill="var(--mut)" fill-opacity="0.55" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="285" y="170" class="sm bd" text-anchor="middle">líquido</text>
  <text x="285" y="186" class="sm bd" text-anchor="middle" style="fill:var(--X)">B = 17,7 N</text>
  <text x="170" y="208" class="sm bd" text-anchor="middle">B = peso real − lectura</text>
  <text x="170" y="226" class="sm bd" text-anchor="middle">ρ<tspan dy="3" font-size="9">L</tspan><tspan dy="-3">/ρ</tspan><tspan dy="3" font-size="9">agua</tspan><tspan dy="-3"> = B</tspan><tspan dy="3" font-size="9">L</tspan><tspan dy="-3">/B</tspan><tspan dy="3" font-size="9">agua</tspan><tspan dy="-3"></tspan></text>
</svg>
