<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 175" width="100%" role="img" aria-label="Tanque sellado con aire a 3 atmósferas manométricas sobre 11 metros de agua de mar: el agua sale por el fondo con 28,4 metros por segundo frente a 14,7 si estuviera abierto">
  <defs><marker id="mae11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="15" y="12" width="130" height="33" fill="var(--mut)" fill-opacity="0.1" stroke="none"/>
  <rect x="15" y="45" width="130" height="115" fill="var(--acc)" fill-opacity="0.22" stroke="none"/>
  <line x1="15" y1="45" x2="145" y2="45" stroke="var(--acc)" stroke-width="2"/>
  <path d="M 15 6 L 15 160 L 145 160 L 145 6 L 15 6" fill="none" stroke="var(--fg)" stroke-width="2"/>
  <text x="80" y="28" class="sm bd" text-anchor="middle">aire: 3,00 atm</text>
  <text x="80" y="80" class="sm bd" text-anchor="middle">agua de mar</text>
  <text x="80" y="98" class="sm bd" text-anchor="middle">11,0 m</text>
  <line x1="147" y1="155" x2="200" y2="155" stroke="var(--X)" stroke-width="2.5" fill="none" marker-end="url(#mge11)"/>
  <text x="150" y="146" class="sm bd" style="fill:var(--X)">v = 28,4 m/s</text>
  <line x1="160" y1="26" x2="211.4" y2="26" stroke="var(--mut)" stroke-width="3" fill="none" marker-end="url(#mme11)"/>
  <text x="160" y="18" class="sm bd">tanque abierto: 14,7 m/s</text>
  <line x1="160" y1="56" x2="259.4" y2="56" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mge11)"/>
  <text x="160" y="48" class="sm bd" style="fill:var(--X)">con 3,00 atm: 28,4 m/s</text>
  <text x="160" y="82" class="sm bd">v = √(2Δp/ρ + 2gh)</text>
  <text x="160" y="100" class="sm">2Δp/ρ = 590 m²/s²</text>
  <text x="160" y="116" class="sm">2gh = 216 m²/s²</text>
</svg>
