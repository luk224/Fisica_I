<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 235" width="100%" role="img" aria-label="Diagrama de cuerpo libre de la estatua de oro sumergida: tensión 139 N y empuje 7,84 N hacia arriba y peso 147 N hacia abajo">
  <defs><marker id="mas1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbs1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mms1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgs1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mps1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfs1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="150" y="110" width="40" height="40" rx="2" fill="var(--A)" fill-opacity="0.5" stroke="var(--A)" stroke-width="1.5"/>
  <line x1="160" y1="110" x2="160" y2="40.5" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mas1)"/>
  <line x1="180" y1="110" x2="180" y2="90" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mgs1)"/>
  <line x1="170" y1="150" x2="170" y2="223.5" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#mfs1)"/>
  <text x="154" y="44.5" class="sm bd" text-anchor="end" style="fill:var(--acc)">T = 139 N</text>
  <text x="186" y="98" class="sm bd" style="fill:var(--X)">B = 7,84 N</text>
  <text x="176" y="219.5" class="sm bd">mg = 147 N</text>
  <text x="15" y="110" class="sm bd">T + B = mg</text>
  <text x="15" y="128" class="sm">B no está a escala</text>
  <text x="170" y="16" class="sm" text-anchor="middle">estatua de oro (15,0 kg) en agua de mar</text>
</svg>
