<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 160" width="100%" role="img" aria-label="Una misma fuerza de 600 newtons sobre una superficie ancha de 200 centímetros cuadrados y sobre una punta de 1 centímetro cuadrado">
  <defs><marker id="map1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbp1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmp1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgp1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpp1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfp1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="80.0" y1="25" x2="80.0" y2="74" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#map1)"/>
  <rect x="25" y="76" width="110" height="8" rx="2" fill="var(--mut)" fill-opacity="0.35" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="80.0" y="20" class="bd" text-anchor="middle">Plano</text>
  <line x1="225.0" y1="25" x2="225.0" y2="74" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#map1)"/>
  <rect x="220" y="76" width="10" height="8" rx="2" fill="var(--mut)" fill-opacity="0.35" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="225.0" y="20" class="bd" text-anchor="middle">Tacón</text>
  <text x="100" y="64" class="sm bd" text-anchor="start" style="fill:var(--acc)">F = 600 N</text>
  <text x="245" y="64" class="sm bd" text-anchor="start" style="fill:var(--acc)">F = 600 N</text>
  <rect x="15" y="84" width="130" height="30" fill="var(--mut)" fill-opacity="0.12" stroke="none"/>
  <rect x="205" y="84" width="40" height="30" fill="var(--mut)" fill-opacity="0.12" stroke="none"/>
  <text x="80" y="108" class="sm bd" text-anchor="middle">A = 200 cm²</text>
  <text x="80" y="126" class="sm bd" text-anchor="middle" style="fill:var(--A)">p = 3,0×10⁴ Pa</text>
  <text x="225" y="108" class="sm bd" text-anchor="middle">A = 1 cm²</text>
  <text x="225" y="126" class="sm bd" text-anchor="middle" style="fill:var(--A)">p = 6,0×10⁶ Pa</text>
  <text x="170" y="150" class="sm" text-anchor="middle">La misma fuerza, 200 veces más presión</text>
</svg>
