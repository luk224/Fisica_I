<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 160" width="100%" role="img" aria-label="Tubo que se estrecha de 8 a 4 centímetros de diámetro: la velocidad pasa de 1,9 a 7,6 metros por segundo">
  <defs><marker id="maf1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbf1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmf1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgf1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpf1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mff1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <path d="M 15 45 L 130 45 L 165 65 L 320 65 L 320 105 L 165 105 L 130 125 L 15 125 Z" fill="var(--acc)" fill-opacity="0.18" stroke="none"/>
  <path d="M 15 45 L 130 45 L 165 65 L 320 65 L 320 105 L 165 105 L 130 125 L 15 125 Z" fill="none" stroke="var(--fg)" stroke-width="2"/>
  <line x1="30" y1="85" x2="55" y2="85" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mgf1)"/>
  <line x1="180" y1="85" x2="280" y2="85" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mgf1)"/>
  <text x="30" y="37" class="sm bd">A₁ = 8,0 cm de diám.</text>
  <text x="190" y="57" class="sm bd">A₂ = 4,0 cm de diám.</text>
  <text x="30" y="107" class="sm bd" style="fill:var(--X)">v₁ = 1,9 m/s</text>
  <text x="190" y="125" class="sm bd" style="fill:var(--X)">v₂ = 7,6 m/s = 4v₁</text>
  <text x="170" y="150" class="sm bd" text-anchor="middle">A₁v₁ = A₂v₂ = 9,5 L/s;  A ∝ d²</text>
