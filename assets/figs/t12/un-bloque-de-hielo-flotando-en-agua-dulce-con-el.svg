  <text x="170" y="190" class="sm" text-anchor="middle">f = ρ<tspan dy="3" font-size="9">cuerpo</tspan><tspan dy="-3"> / ρ</tspan><tspan dy="3" font-size="9">fluido</tspan><tspan dy="-3"></tspan></text>
