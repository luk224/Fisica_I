<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 262" width="100%" role="img" aria-label="Dos diagramas de cuerpo libre de una roca de 1,80 kilogramos: sumergida en agua con tensión 12,8 newtons y empuje 4,84; y en el líquido de densidad mínima donde flota, con empuje igual al peso">
  <defs><marker id="mae5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="65" y="112" width="40" height="40" rx="2" fill="var(--mut)" fill-opacity="0.45" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="85" y="137" class="sm" text-anchor="middle">roca</text>
  <text x="85" y="15" class="bd" text-anchor="middle">En agua</text>
  <line x1="75" y1="112" x2="75" y2="60.8" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mae5)"/>
  <text x="70" y="70.8" class="sm bd" text-anchor="end" style="fill:var(--acc)">T = 12,8 N</text>
  <line x1="95" y1="112" x2="95" y2="92.6" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mge5)"/>
  <line x1="85" y1="152" x2="85" y2="222.6" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#mfe5)"/>
  <text x="100" y="104.6" class="sm bd" style="fill:var(--X)">B = 4,84 N</text>
  <text x="85" y="238.6" class="sm bd" text-anchor="middle">mg = 17,6 N</text>
  <rect x="220" y="112" width="40" height="40" rx="2" fill="var(--mut)" fill-opacity="0.45" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="240" y="137" class="sm" text-anchor="middle">roca</text>
  <text x="240" y="15" class="bd" text-anchor="middle">En el líquido límite</text>
  <text x="225" y="106" class="sm bd" text-anchor="end" style="fill:var(--acc)">T = 0</text>
  <line x1="250" y1="112" x2="250" y2="41.4" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mge5)"/>
  <line x1="240" y1="152" x2="240" y2="222.6" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#mfe5)"/>
  <text x="255" y="53.4" class="sm bd" style="fill:var(--X)">B = 17,64 N</text>
  <text x="240" y="238.6" class="sm bd" text-anchor="middle">mg = 17,6 N</text>
  <text x="170" y="252" class="sm" text-anchor="middle">En los dos casos: T + B = mg</text>
</svg>
