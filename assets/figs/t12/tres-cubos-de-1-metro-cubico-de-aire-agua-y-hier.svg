  <rect x="142" y="45" width="56" height="56" rx="2" fill="var(--acc)" fill-opacity="0.22" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="170" y="36" class="bd" text-anchor="middle">Agua</text>
