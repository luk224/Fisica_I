<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 160" width="100%" role="img" aria-label="Tres cubos de 1 metro cúbico de aire, agua y hierro con masas de 1,20 kg, 1000 kg y 7800 kg">
  <defs><marker id="mad1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbd1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmd1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgd1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpd1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfd1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="30" y="45" width="56" height="56" rx="2" fill="var(--mut)" fill-opacity="0.06" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="58" y="36" class="bd" text-anchor="middle">Aire</text>
  <text x="58" y="70" class="sm" text-anchor="middle">1 m³</text>
