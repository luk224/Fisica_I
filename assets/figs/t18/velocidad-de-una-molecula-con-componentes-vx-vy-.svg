<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 196" width="100%" role="img" aria-label="Velocidad de una molécula con componentes vx, vy y vz: el cuadrado de la rapidez es la suma de los cuadrados y, por simetría, el promedio de vx al cuadrado es un tercio del promedio de v al cuadrado">
  <defs><marker id="macomp" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbcomp" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmcomp" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgcomp" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpcomp" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfcomp" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <path d="M 100 16 L 200 16 L 200 116 L 100 116 Z" fill="var(--mut)" fill-opacity="0.08" stroke="none"/>
  <path d="M 100 16 L 200 16 L 200 116 L 100 116 Z" fill="none" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="50" y1="66" x2="100" y2="16" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="150" y1="66" x2="200" y2="16" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="150" y1="166" x2="200" y2="116" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="50" y1="166" x2="100" y2="116" stroke="var(--mut)" stroke-width="1.3"/>
  <path d="M 50 66 L 150 66 L 150 166 L 50 166 Z" fill="var(--mut)" fill-opacity="0.096" stroke="none"/>
  <path d="M 50 66 L 150 66 L 150 166 L 50 166 Z" fill="none" stroke="var(--mut)" stroke-width="1.6"/>
  <line x1="50" y1="166" x2="150" y2="166" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#macomp)"/>
  <text x="100" y="184" class="sm bd" text-anchor="middle" style="fill:var(--acc)">v<tspan dy="3" font-size="9">x</tspan><tspan dy="-3"></tspan></text>
  <line x1="150" y1="166" x2="200" y2="116" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mgcomp)"/>
  <text x="190" y="144" class="sm bd" text-anchor="middle" style="fill:var(--X)">v<tspan dy="3" font-size="9">y</tspan><tspan dy="-3"></tspan></text>
  <line x1="50" y1="166" x2="50" y2="66" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbcomp)"/>
  <text x="38" y="116" class="sm bd" text-anchor="end" style="fill:var(--A)">v<tspan dy="3" font-size="9">z</tspan><tspan dy="-3"></tspan></text>
  <line x1="50" y1="166" x2="200" y2="16" stroke="var(--E)" stroke-width="3.2" fill="none" marker-end="url(#mpcomp)"/>
  <text x="112" y="86" class="sm bd" text-anchor="middle" style="fill:var(--E)">v</text>
  <text x="250" y="70" class="sm bd" text-anchor="middle">v² = v<tspan dy="3" font-size="9">x</tspan><tspan dy="-3">² + v</tspan><tspan dy="3" font-size="9">y</tspan><tspan dy="-3">² + v</tspan><tspan dy="3" font-size="9">z</tspan><tspan dy="-3">²</tspan></text>
  <text x="250" y="90" class="sm" text-anchor="middle">ninguna dirección es</text>
  <text x="250" y="104" class="sm" text-anchor="middle">especial, así que:</text>
  <text x="250" y="126" class="sm bd" text-anchor="middle">(v<tspan dy="3" font-size="9">x</tspan><tspan dy="-3">²)</tspan><tspan dy="3" font-size="9">med</tspan><tspan dy="-3"></tspan></text>
  <text x="250" y="142" class="sm bd" text-anchor="middle">= ⅓ (v²)<tspan dy="3" font-size="9">med</tspan><tspan dy="-3"></tspan></text>
</svg>
