<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 270" width="100%" role="img" aria-label="Diagrama de fuerzas del globo de aire caliente: empuje hacia arriba de 6027 newtons, peso del aire caliente de 3185 newtons y peso de la carga de 2842 newtons hacia abajo">
  <defs><marker id="mae20" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe20" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme20" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge20" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe20" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe20" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <g transform="translate(0,38)">
  <ellipse cx="170" cy="76" rx="54" ry="62" fill="var(--A)" fill-opacity="0.18" stroke="var(--A)" stroke-width="1.8"/>
  <line x1="144" y1="136" x2="158" y2="158" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="196" y1="136" x2="182" y2="158" stroke="var(--mut)" stroke-width="1.3"/>
  <rect x="156" y="158" width="28" height="16" rx="2" fill="var(--mut)" fill-opacity="0.4" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="170" y1="76" x2="170" y2="-24.0" stroke="var(--X)" stroke-width="3.2" fill="none" marker-end="url(#mge20)"/>
  <text x="180" y="-10.0" class="sm bd" text-anchor="start" style="fill:var(--X)">B = 6027 N</text>
  <line x1="118" y1="120" x2="118" y2="172.8" stroke="var(--A)" stroke-width="3.2" fill="none" marker-end="url(#mbe20)"/>
  <text x="112" y="150.4" class="sm" text-anchor="end" style="fill:var(--A)">peso del aire</text>
  <text x="112" y="164.4" class="sm bd" text-anchor="end" style="fill:var(--A)">caliente 3185 N</text>
  <line x1="222" y1="120" x2="222" y2="167.2" stroke="var(--E)" stroke-width="3.2" fill="none" marker-end="url(#mpe20)"/>
  <text x="228" y="147.6" class="sm" text-anchor="start" style="fill:var(--E)">carga</text>
  <text x="228" y="161.6" class="sm bd" text-anchor="start" style="fill:var(--E)">290 kg: 2842 N</text>
  <text x="170" y="206" class="sm bd" text-anchor="middle">B = peso del aire caliente + peso de la carga</text>
  <text x="170" y="222" class="sm" text-anchor="middle">(las flechas están a la misma escala)</text>
  </g>
</svg>
