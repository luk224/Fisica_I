<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 270" width="100%" role="img" aria-label="Diagrama de fuerzas del globo de hidrógeno: empuje de 9040 newtons hacia arriba, peso del gas de 626 newtons y peso de la carga de 8415 newtons hacia abajo">
  <defs><marker id="mae22" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe22" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme22" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge22" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe22" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe22" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <g transform="translate(0,38)">
  <ellipse cx="170" cy="86" rx="54" ry="64" fill="var(--acc)" fill-opacity="0.15" stroke="var(--acc)" stroke-width="1.8"/>
  <line x1="170" y1="86" x2="170" y2="-14.0" stroke="var(--X)" stroke-width="3.2" fill="none" marker-end="url(#mge22)"/>
  <text x="180" y="0.0" class="sm bd" text-anchor="start" style="fill:var(--X)">B = 9040 N</text>
  <line x1="128" y1="100" x2="128" y2="106.9" stroke="var(--A)" stroke-width="3.2" fill="none" marker-end="url(#mbe22)"/>
  <text x="122" y="107.5" class="sm" text-anchor="end" style="fill:var(--A)">gas H₂</text>
  <text x="122" y="121.5" class="sm bd" text-anchor="end" style="fill:var(--A)">626 N</text>
  <line x1="212" y1="100" x2="212" y2="193.1" stroke="var(--E)" stroke-width="3.2" fill="none" marker-end="url(#mpe22)"/>
  <text x="218" y="150.5" class="sm" text-anchor="start" style="fill:var(--E)">carga</text>
  <text x="218" y="164.5" class="sm bd" text-anchor="start" style="fill:var(--E)">8415 N</text>
  <text x="170" y="206" class="sm bd" text-anchor="middle">B = peso del gas + peso de la carga</text>
  <text x="170" y="222" class="sm" text-anchor="middle">con helio (126 kg): carga 7801 N</text>
  <text x="112" y="176" class="sm" text-anchor="middle">(flecha del gas muy corta, a escala)</text>
  </g>
</svg>
