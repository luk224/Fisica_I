<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 218" width="100%" role="img" aria-label="Diagrama de fuerzas de la esfera ligera colgada de un hilo: tensión de 0,0604 newtons y empuje de 0,0278 hacia arriba y peso de 0,0882 hacia abajo">
  <defs><marker id="mae21" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe21" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme21" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge21" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe21" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe21" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="170" y1="6" x2="170" y2="50" stroke="var(--mut)" stroke-width="1.5"/>
  <circle cx="170" cy="82" r="30" fill="var(--acc)" fill-opacity="0.2" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="150" y1="82" x2="150" y2="53.6" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mge21)"/>
  <text x="138" y="62" class="sm bd" text-anchor="end" style="fill:var(--X)">B = 0,0278 N</text>
  <line x1="190" y1="82" x2="190" y2="20.4" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbe21)"/>
  <text x="198" y="40" class="sm bd" text-anchor="start" style="fill:var(--A)">F = 0,0604 N</text>
  <line x1="170" y1="82" x2="170" y2="172.0" stroke="var(--E)" stroke-width="3" fill="none" marker-end="url(#mpe21)"/>
  <text x="178" y="150" class="sm bd" text-anchor="start" style="fill:var(--E)">mg = 0,0882 N</text>
  <text x="170" y="192" class="sm bd" text-anchor="middle">equilibrio: F + B = mg  ⇒  F = mg − B</text>
  <text x="170" y="208" class="sm" text-anchor="middle">esfera m = 9,00 g, V = 2,25×10⁻³ m³, aire a 5 °C</text>
</svg>
