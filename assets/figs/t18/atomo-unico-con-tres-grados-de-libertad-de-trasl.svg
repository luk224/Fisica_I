<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 198" width="100%" role="img" aria-label="Átomo único con tres grados de libertad de traslación y molécula diatómica con tres de traslación y dos de rotación">
  <defs><marker id="magdl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbgdl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmgdl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mggdl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpgdl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfgdl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="85" y="16" class="sm bd" text-anchor="middle">monoatómica (He, Ne)</text>
  <text x="255" y="16" class="sm bd" text-anchor="middle">diatómica (H<tspan dy="3" font-size="9">2</tspan><tspan dy="-3">, N</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3">, O</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3">)</tspan></text>
  <circle cx="85" cy="78" r="12" fill="var(--acc)" fill-opacity="0.5" stroke="var(--acc)" stroke-width="1.5"/>
