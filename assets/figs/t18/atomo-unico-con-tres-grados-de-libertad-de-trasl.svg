  <text x="85" y="146" class="sm bd" text-anchor="middle">3 de traslación</text>
  <text x="85" y="162" class="sm bd" text-anchor="middle">C<tspan dy="3" font-size="9">V</tspan><tspan dy="-3"> = 3 · ½R = 3R/2</tspan></text>
  <circle cx="222" cy="78" r="12" fill="var(--acc)" fill-opacity="0.5" stroke="var(--acc)" stroke-width="1.5"/>
