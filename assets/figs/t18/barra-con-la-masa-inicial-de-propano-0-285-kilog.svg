<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 168" width="100%" role="img" aria-label="Barra con la masa inicial de propano 0,285 kilogramos dividida en 0,0897 que quedan y 0,195 que se han usado">
  <defs><marker id="mae10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="40" y="40" width="81.9" height="36" rx="2" fill="var(--acc)" fill-opacity="0.35" stroke="var(--acc)" stroke-width="1.5"/>
  <rect x="121.9" y="40" width="178.1" height="36" rx="2" fill="var(--A)" fill-opacity="0.35" stroke="var(--A)" stroke-width="1.5"/>
  <text x="80.9" y="62" class="sm bd" text-anchor="middle" style="fill:var(--acc)">0,090</text>
  <text x="210.9" y="62" class="sm bd" text-anchor="middle" style="fill:var(--A)">0,195 kg usados</text>
  <line x1="40" y1="30" x2="300.0" y2="30" stroke="var(--fg)" stroke-width="1.2"/>
  <line x1="40" y1="26" x2="40" y2="34" stroke="var(--fg)" stroke-width="1.2"/>
  <line x1="300.0" y1="26" x2="300.0" y2="34" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="170.0" y="22" class="sm bd" text-anchor="middle">m<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> = 0,285 kg  (p abs = 14,0×10⁵ Pa)</tspan></text>
  <text x="80.9" y="96" class="sm" text-anchor="middle">queda: m<tspan dy="3" font-size="9">2</tspan><tspan dy="-3"></tspan></text>
  <text x="80.9" y="110" class="sm" text-anchor="middle">p = 4,41×10⁵ Pa</text>
  <text x="170" y="142" class="sm bd" text-anchor="middle">V y T constantes ⇒ m ∝ p (absoluta)</text>
  <text x="170" y="158" class="sm" text-anchor="middle">m<tspan dy="3" font-size="9">2</tspan><tspan dy="-3"> = m</tspan><tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> · 4,413/14,01 = 0,0897 kg</tspan></text>
</svg>
