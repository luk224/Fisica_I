<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 200" width="100%" role="img" aria-label="Barras en escala logarítmica con las densidades de las atmósferas: Marte 0,0136, Tierra 1,20, Titán 5,38 y Venus 67,6 kilogramos por metro cúbico">
  <defs><marker id="mae8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line class="ax" x1="66" y1="14" x2="66" y2="160"/>
  <rect x="66" y="22" width="14.7" height="22" rx="2" fill="var(--mut)" fill-opacity="0.35" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="60" y="37" class="sm bd" text-anchor="end">Marte</text>
  <text x="86.7" y="37" class="sm bd" text-anchor="start">0,0136 kg/m³</text>
  <rect x="66" y="56" width="100.3" height="22" rx="2" fill="var(--X)" fill-opacity="0.35" stroke="var(--X)" stroke-width="1.5"/>
  <text x="60" y="71" class="sm bd" text-anchor="end">Tierra</text>
  <text x="172.3" y="71" class="sm bd" text-anchor="start">1,2 kg/m³</text>
  <rect x="66" y="90" width="129.0" height="22" rx="2" fill="var(--acc)" fill-opacity="0.35" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="60" y="105" class="sm bd" text-anchor="end">Titán</text>
  <text x="201.0" y="105" class="sm bd" text-anchor="start">5,38 kg/m³</text>
  <rect x="66" y="124" width="177.3" height="22" rx="2" fill="var(--A)" fill-opacity="0.35" stroke="var(--A)" stroke-width="1.5"/>
  <text x="60" y="139" class="sm bd" text-anchor="end">Venus</text>
  <text x="249.3" y="139" class="sm bd" text-anchor="start">67,6 kg/m³</text>
  <line x1="74.8" y1="156" x2="74.8" y2="160" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="74.8" y="174" class="sm" text-anchor="middle">0,01</text>
  <line x1="162.8" y1="156" x2="162.8" y2="160" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="162.8" y="174" class="sm" text-anchor="middle">1</text>
  <line x1="250.8" y1="156" x2="250.8" y2="160" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="250.8" y="174" class="sm" text-anchor="middle">100</text>
  <text x="72" y="190" class="sm" text-anchor="start">densidad ρ (escala logarítmica)</text>
