<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 162" width="100%" role="img" aria-label="Barras con el reparto de 300 julios de calor: en hidrógeno 180 de traslación y 120 de rotación, en neón los 300 de traslación; el neón se calienta más">
  <defs><marker id="mae17" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe17" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme17" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge17" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe17" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe17" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="40" y="16" class="sm bd" text-anchor="start">H₂</text>
  <rect x="40" y="22" width="108.0" height="22" rx="2" fill="var(--acc)" fill-opacity="0.35" stroke="var(--acc)" stroke-width="1.5"/>
  <rect x="148.0" y="22" width="72.0" height="22" rx="2" fill="var(--A)" fill-opacity="0.35" stroke="var(--A)" stroke-width="1.5"/>
  <text x="94.0" y="37" class="sm" text-anchor="middle">trasl. 180 J</text>
  <text x="184.0" y="37" class="sm" text-anchor="middle">rot. 120 J</text>
  <text x="228.0" y="37" class="sm bd" text-anchor="start">ΔT = 2,50 K</text>
  <text x="40" y="66" class="sm bd" text-anchor="start">Ne</text>
  <rect x="40" y="72" width="180.0" height="22" rx="2" fill="var(--acc)" fill-opacity="0.35" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="130.0" y="87" class="sm" text-anchor="middle">trasl. 300 J</text>
  <text x="228.0" y="87" class="sm bd" text-anchor="start">ΔT = 4,17 K</text>
  <text x="170" y="122" class="sm bd" text-anchor="middle">mismo calor (300 J) a V constante:</text>
  <text x="170" y="138" class="sm" text-anchor="middle">Q = n C<tspan dy="3" font-size="9">V</tspan><tspan dy="-3"> ΔT; solo la traslación</tspan></text>
  <text x="170" y="154" class="sm" text-anchor="middle">sube la temperatura ⇒ ΔT mayor en Ne</text>
</svg>
