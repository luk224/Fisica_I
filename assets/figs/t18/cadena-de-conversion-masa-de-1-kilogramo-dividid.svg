<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 132" width="100%" role="img" aria-label="Cadena de conversión: masa de 1 kilogramo, dividida entre la masa molar da 55,6 moles, multiplicada por el número de Avogadro da 3,35 por diez a la 25 moléculas">
  <defs><marker id="mae11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="10" y="36" width="88" height="50" rx="2" fill="var(--acc)" fill-opacity="0.15" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="54" y="58" class="sm bd" text-anchor="middle">m = 1,00 kg</text>
  <text x="54" y="74" class="sm" text-anchor="middle">de agua</text>
  <rect x="126" y="36" width="88" height="50" rx="2" fill="var(--X)" fill-opacity="0.15" stroke="var(--X)" stroke-width="1.5"/>
  <text x="170" y="58" class="sm bd" text-anchor="middle">n = 55,6 mol</text>
  <text x="170" y="74" class="sm" text-anchor="middle">de agua</text>
  <rect x="242" y="36" width="88" height="50" rx="2" fill="var(--A)" fill-opacity="0.15" stroke="var(--A)" stroke-width="1.5"/>
  <text x="286" y="58" class="sm bd" text-anchor="middle">3,35×10²⁵</text>
  <text x="286" y="74" class="sm" text-anchor="middle">moléculas (N)</text>
  <line x1="100" y1="61" x2="124" y2="61" stroke="var(--fg)" stroke-width="2.5" fill="none" marker-end="url(#mfe11)"/>
  <line x1="216" y1="61" x2="240" y2="61" stroke="var(--fg)" stroke-width="2.5" fill="none" marker-end="url(#mfe11)"/>
  <text x="112" y="28" class="sm bd" text-anchor="middle">÷ M</text>
  <text x="228" y="28" class="sm bd" text-anchor="middle">× N<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"></tspan></text>
  <text x="112" y="106" class="sm" text-anchor="middle">M = 0,0180 kg/mol</text>
  <text x="228" y="120" class="sm" text-anchor="middle">N<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = 6,022×10²³ mol⁻¹</tspan></text>
</svg>
