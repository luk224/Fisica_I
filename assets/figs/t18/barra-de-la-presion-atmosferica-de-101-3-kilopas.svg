<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 174" width="100%" role="img" aria-label="Barra de la presión atmosférica de 101,3 kilopascales con una franja estrecha que representa la presión parcial del vapor de agua de 1,40 kilopascales">
  <defs><marker id="mae19" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe19" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme19" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge19" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe19" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe19" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="20" y="50" width="300" height="30" rx="2" fill="var(--acc)" fill-opacity="0.2" stroke="var(--acc)" stroke-width="1.5"/>
  <rect x="20" y="50" width="4.2" height="30" rx="2" fill="var(--A)" fill-opacity="0.6" stroke="var(--A)" stroke-width="1.5"/>
  <text x="170" y="40" class="sm bd" text-anchor="middle">presión atmosférica: 101,3 kPa</text>
  <line x1="22" y1="82" x2="22" y2="108" stroke="var(--A)" stroke-width="1.3"/>
  <text x="26" y="122" class="sm bd" text-anchor="start" style="fill:var(--A)">vapor de agua: 1,40 kPa (1,4 %)</text>
  <text x="170" y="146" class="sm" text-anchor="middle">= 0,60 × 2,34 kPa (presión de vapor a 20 °C)</text>
  <text x="170" y="164" class="sm bd" text-anchor="middle">⇒ 10,4 g de vapor en 1,00 m³</text>
