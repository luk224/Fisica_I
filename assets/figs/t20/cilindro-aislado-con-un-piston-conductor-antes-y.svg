<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 215" width="100%" role="img" aria-label="Cilindro aislado con un pistón conductor: antes y después de soltarlo">
  <defs><marker id="max4c" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbx4c" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmx4c" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgx4c" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpx4c" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfx4c" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="30" y="26" width="280" height="44" rx="2" fill="var(--mut)" fill-opacity="0.08" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="30" y="20" class="sm bd">Antes: pistón sujeto en el centro</text>
  <line x1="170" y1="23" x2="170" y2="73" stroke="var(--fg)" stroke-width="5"/>
  <text x="100.0" y="48" class="sm bd" text-anchor="middle">2 atm, 300 K</text>
  <text x="100.0" y="62" class="sm" text-anchor="middle">1 L</text>
  <text x="240.0" y="48" class="sm bd" text-anchor="middle">1 atm, 300 K</text>
  <text x="240.0" y="62" class="sm" text-anchor="middle">1 L</text>
  <rect x="30" y="116" width="280" height="44" rx="2" fill="var(--mut)" fill-opacity="0.08" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="30" y="110" class="sm bd">Después: equilibrio (300 K)</text>
  <line x1="216.66666666666666" y1="113" x2="216.66666666666666" y2="163" stroke="var(--fg)" stroke-width="5"/>
  <text x="123.3" y="138" class="sm bd" text-anchor="middle">1,5 atm</text>
  <text x="123.3" y="152" class="sm" text-anchor="middle">4/3 L</text>
  <text x="263.3" y="138" class="sm bd" text-anchor="middle">1,5 atm</text>
  <text x="263.3" y="152" class="sm" text-anchor="middle">2/3 L</text>
  <text x="170" y="180" class="sm bd" text-anchor="middle" style="fill:var(--A)">ΔS₁ = +0,194 J/K (el de 2 atm se expande)</text>
  <text x="170" y="195" class="sm bd" text-anchor="middle" style="fill:var(--acc)">ΔS₂ = −0,137 J/K (el de 1 atm se comprime)</text>
  <text x="170" y="210" class="sm bd" text-anchor="middle" style="fill:var(--X)">ΔS total = +0,057 J/K > 0</text>
</svg>
