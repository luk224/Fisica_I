<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 215" width="100%" role="img" aria-label="El Sol cede calor por radiación a la Tierra: la entropía total aumenta">
  <defs><marker id="mast1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbst1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmst1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgst1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpst1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfst1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="55" cy="100" r="38" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="55" y="96" class="sm bd" text-anchor="middle">Sol</text>
  <text x="55" y="112" class="sm" text-anchor="middle">5800 K</text>
  <circle cx="285" cy="100" r="16" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="285" y="134" class="sm bd" text-anchor="middle">Tierra</text>
  <text x="285" y="148" class="sm" text-anchor="middle">288 K</text>
  <line x1="100" y1="100" x2="262" y2="100" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbst1)"/>
  <text x="180" y="88" class="sm bd" text-anchor="middle" style="fill:var(--A)">Q (radiación)</text>
  <text x="55" y="160" class="sm bd" text-anchor="middle" style="fill:var(--A)">ΔS = −Q/5800</text>
  <text x="285" y="168" class="sm bd" text-anchor="middle" style="fill:var(--acc)">ΔS = +Q/288</text>
  <text x="170" y="190" class="sm" text-anchor="middle">Por cada julio de Q:</text>
  <text x="170" y="206" class="sm bd" text-anchor="middle" style="fill:var(--X)">−1,7·10⁻⁴ + 3,5·10⁻³ = +3,3·10⁻³ J/K > 0</text>
</svg>
