<svg class="fig" viewBox="0 0 360 472" width="100%" role="img" aria-label="Planteamiento del cohete: dos tramos con su diagrama de cuerpo libre">
  <defs><marker id="macoh" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbcoh" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmcoh" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgcoh" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpcoh" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfcoh" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="40" y1="180" x2="40" y2="16" stroke="var(--mut)" stroke-width="1.4" fill="none" marker-end="url(#mmcoh)"/>
  <text x="46" y="24" class="sm">y</text>
  <line x1="34" y1="180" x2="46" y2="180" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="54" y="184" class="sm bd">t = 0 ; y = 0</text>
  <line x1="34" y1="110" x2="46" y2="110" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="54" y="114" class="sm bd">t = 10 s ; y₁</text>
  <line x1="34" y1="34" x2="46" y2="34" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="54" y="38" class="sm bd">t = 60 s ; y₂</text>
  <text x="54" y="148" class="sm">tramo 1: F₁ = k₁M</text>
  <text x="54" y="76" class="sm">tramo 2: F₂ = k₂M</text>
  <text x="200" y="100" class="sm bd">g(t) = g₀ - k₃t</text>
  <text x="200" y="116" class="sm">M variable</text>
  <text x="95" y="212" class="sm bd" text-anchor="middle">DCL tramo 1</text>
  <line x1="95.0" y1="312.0" x2="95.0" y2="230.0" stroke="var(--mut)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="95.0" y="226.0" class="sm" text-anchor="middle">y</text>
  <line x1="95.0" y1="300.0" x2="95.0" y2="248.0" stroke="var(--X)" stroke-width="2.6" fill="none" marker-end="url(#mgcoh)"/>
  <text x="95.0" y="238.0" class="sm bd" text-anchor="middle">F<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"></tspan></text>
  <line x1="95.0" y1="300.0" x2="95.0" y2="340.0" stroke="var(--A)" stroke-width="2.6" fill="none" marker-end="url(#mbcoh)"/>
  <text x="95.0" y="360.0" class="sm bd" text-anchor="middle">Mg</text>
  <circle cx="95" cy="300" r="3.5" fill="var(--fg)"/>
  <text x="265" y="212" class="sm bd" text-anchor="middle">DCL tramo 2</text>
  <line x1="265.0" y1="312.0" x2="265.0" y2="230.0" stroke="var(--mut)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="265.0" y="226.0" class="sm" text-anchor="middle">y</text>
  <line x1="265.0" y1="300.0" x2="265.0" y2="258.0" stroke="var(--X)" stroke-width="2.6" fill="none" marker-end="url(#mgcoh)"/>
  <text x="265.0" y="248.0" class="sm bd" text-anchor="middle">F<tspan dy="3" font-size="9">2</tspan><tspan dy="-3"></tspan></text>
  <line x1="265.0" y1="300.0" x2="265.0" y2="340.0" stroke="var(--A)" stroke-width="2.6" fill="none" marker-end="url(#mbcoh)"/>
  <text x="265.0" y="360.0" class="sm bd" text-anchor="middle">Mg</text>
  <circle cx="265" cy="300" r="3.5" fill="var(--fg)"/>
  <text x="20" y="386" class="sm bd">g₀ = 10 m/s² ; k₁ = 20 m/s²</text>
  <text x="20" y="402" class="sm bd">k₂ = 15 m/s² ; k₃ = 0,1 m/s³</text>
  <text x="20" y="418" class="sm">Divide entre M: a₁ = k₁ - g(t),</text>
  <text x="20" y="434" class="sm">a₂ = k₂ - g(t)  (la M se cancela).</text>
  <text x="20" y="450" class="sm">Piden: y(60 s); v₁ e y₁ empalman tramos.</text>
</svg>
