<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 140" width="100%" role="img" aria-label="Una masa de aire que sube desde el suelo a 26 grados y 1,01 por diez a la cinco pascales hasta 0,850 por diez a la cinco pascales, enfriándose a 11,6 grados">
