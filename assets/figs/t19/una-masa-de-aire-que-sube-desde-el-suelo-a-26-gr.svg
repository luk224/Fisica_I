  <rect x="20" y="20" width="70" height="28" rx="2" fill="var(--acc)" fill-opacity="0.1" stroke="var(--acc)" stroke-width="1.5"/>
  <rect x="20" y="100" width="70" height="28" rx="2" fill="var(--A)" fill-opacity="0.2" stroke="var(--A)" stroke-width="1.5"/>
  <text x="55" y="38" class="sm bd" text-anchor="middle">arriba</text>
  <text x="55" y="118" class="sm bd" text-anchor="middle">abajo</text>
  <text x="100" y="30" class="sm" text-anchor="start">p = 0,850×10⁵ Pa</text>
  <text x="100" y="46" class="sm bd" text-anchor="start">T = 284,8 K = 11,6 °C</text>
  <text x="100" y="112" class="sm" text-anchor="start">p = 1,01×10⁵ Pa</text>
  <text x="100" y="128" class="sm bd" text-anchor="start">T = 299,15 K = 26,0 °C</text>
