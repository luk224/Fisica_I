<svg class="fig" viewBox="0 0 360 290" width="100%" role="img" aria-label="Planteamiento: cilindro aislado con un pistón conductor que se libera, antes y después">
  <defs><marker id="macF" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbcF" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmcF" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgcF" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpcF" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfcF" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="16" y="50" width="140" height="70" rx="2" fill="var(--mut)" fill-opacity="0.08" stroke="var(--mut)" stroke-width="1.5"/>
  <rect x="16" y="50" width="140" height="70" fill="none" stroke="var(--fg)" stroke-width="3"/>
  <rect x="83" y="50" width="6" height="70" rx="2" fill="var(--E)" fill-opacity="0.5" stroke="var(--E)" stroke-width="1.5"/>
  <text x="86" y="44" class="sm" text-anchor="middle">pistón fijo</text>
  <text x="50" y="76" class="sm" text-anchor="middle">300 K</text>
  <text x="50" y="92" class="sm bd" text-anchor="middle">1 l</text>
  <text x="122" y="76" class="sm" text-anchor="middle">300 K</text>
  <text x="122" y="92" class="sm bd" text-anchor="middle">1 l</text>
  <text x="50" y="108" class="sm bd" text-anchor="middle">2 atm</text>
  <text x="122" y="108" class="sm bd" text-anchor="middle">1 atm</text>
  <text x="86" y="140" class="sm bd" text-anchor="middle">ANTES (sujeto)</text>
  <line x1="160" y1="85" x2="178" y2="85" stroke="var(--mut)" stroke-width="1.6" fill="none" marker-end="url(#mmcF)"/>
  <rect x="184" y="50" width="140" height="70" rx="2" fill="var(--mut)" fill-opacity="0.08" stroke="var(--mut)" stroke-width="1.5"/>
  <rect x="184" y="50" width="140" height="70" fill="none" stroke="var(--fg)" stroke-width="3"/>
  <rect x="251" y="50" width="6" height="70" rx="2" fill="var(--E)" fill-opacity="0.5" stroke="var(--E)" stroke-width="1.5"/>
  <text x="254" y="44" class="sm" text-anchor="middle">libre y conductor</text>
  <text x="254" y="90" class="sm bd" text-anchor="middle">?</text>
  <text x="254" y="140" class="sm bd" text-anchor="middle">DESPUÉS (equilibrio)</text>
  <text x="20" y="176" class="sm bd">Cilindro aislado: Q = 0 ; paredes rígidas: W = 0</text>
  <text x="20" y="192" class="sm bd">⇒ la energía interna total se conserva.</text>
  <text x="20" y="208" class="sm">Pistón conductor: T igual a ambos lados.</text>
  <text x="20" y="224" class="sm">Pistón sin rozamiento: p igual a ambos lados.</text>
  <text x="20" y="240" class="sm">Total de moles: n = n₁ + n₂ (pV = nRT), V = 2 l.</text>
  <text x="20" y="256" class="sm">Piden: p<tspan dy="3" font-size="9">f</tspan><tspan dy="-3">, T</tspan><tspan dy="3" font-size="9">f</tspan><tspan dy="-3">, ΔS (suma de las dos partes).</tspan></text>
</svg>
