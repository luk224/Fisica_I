<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 188" width="100%" role="img" aria-label="Cilindro aislado dividido por un pistón conductor: a la izquierda un litro de aire a 2 atmósferas y a la derecha un litro a 1 atmósfera, que al soltar el pistón pasan a 4/3 L y 2/3 L a 1,5 atmósferas">
  <defs><marker id="max4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbx4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmx4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgx4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpx4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfx4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="8" y="40" width="150" height="70" rx="2" fill="var(--mut)" fill-opacity="0.06" stroke="var(--mut)" stroke-width="1.5"/>
  <rect x="80" y="40" width="6" height="70" rx="2" fill="var(--fg)" fill-opacity="0.55" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="44" y="70" class="bd" text-anchor="middle">1 L</text>
  <text x="44" y="86" class="sm" text-anchor="middle">2 atm</text>
  <text x="44" y="100" class="sm" text-anchor="middle">300 K</text>
  <text x="122" y="70" class="bd" text-anchor="middle">1 L</text>
  <text x="122" y="86" class="sm" text-anchor="middle">1 atm</text>
  <text x="122" y="100" class="sm" text-anchor="middle">300 K</text>
  <text x="83" y="28" class="sm bd" text-anchor="middle">Inicial: pistón sujeto</text>
  <rect x="182" y="40" width="150" height="70" rx="2" fill="var(--mut)" fill-opacity="0.06" stroke="var(--mut)" stroke-width="1.5"/>
  <rect x="278" y="40" width="6" height="70" rx="2" fill="var(--fg)" fill-opacity="0.55" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="230" y="70" class="bd" text-anchor="middle">4/3 L</text>
  <text x="230" y="86" class="sm" text-anchor="middle">1,5 atm</text>
  <text x="230" y="100" class="sm" text-anchor="middle">300 K</text>
  <text x="308" y="70" class="bd" text-anchor="middle">2/3 L</text>
  <text x="308" y="86" class="sm" text-anchor="middle">1,5 atm</text>
  <text x="308" y="100" class="sm" text-anchor="middle">300 K</text>
  <text x="257" y="28" class="sm bd" text-anchor="middle">Final: pistón libre</text>
  <line x1="242" y1="128" x2="280" y2="128" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbx4)"/>
  <text x="257" y="146" class="sm" text-anchor="middle">el pistón se desplaza hacia</text>
  <text x="257" y="159" class="sm" text-anchor="middle">el gas de menor presión</text>
  <text x="170" y="178" class="sm bd" text-anchor="middle">Cilindro rígido y aislado: Q = 0, W = 0</text>
</svg>
