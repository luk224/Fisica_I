<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 178" width="100%" role="img" aria-label="Un sistema con calor Q entrando por la izquierda y trabajo W saliendo por la derecha: convención de signos de la termodinámica">
  <defs><marker id="masg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbsg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmsg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgsg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpsg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfsg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="110" y="55" width="120" height="80" rx="2" fill="var(--acc)" fill-opacity="0.12" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="170" y="90" class="bd" text-anchor="middle">Sistema</text>
  <text x="170" y="110" class="sm" text-anchor="middle">U (energía interna)</text>
  <line x1="20" y1="95" x2="106" y2="95" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbsg)"/>
  <text x="20" y="78" class="bd" style="fill:var(--A)">Q > 0</text>
  <text x="20" y="118" class="sm">entra calor</text>
  <line x1="234" y1="95" x2="322" y2="95" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mgsg)"/>
  <text x="238" y="78" class="bd" style="fill:var(--X)">W > 0</text>
  <text x="238" y="118" class="sm">el sistema</text>
  <text x="238" y="133" class="sm">empuja al entorno</text>
  <text x="170" y="30" class="sm" text-anchor="middle">Entorno</text>
  <line x1="20" y1="40" x2="320" y2="40" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="20" y1="150" x2="320" y2="150" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="170" y="168" class="sm" text-anchor="middle">Q &lt; 0: sale calor  ·  W < 0: entra trabajo</text>
</svg>
