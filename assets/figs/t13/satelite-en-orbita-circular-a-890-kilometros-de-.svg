<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 215" width="100%" role="img" aria-label="Satélite en órbita circular a 890 kilómetros de altura, con la velocidad tangente y la fuerza gravitacional hacia el centro">
  <defs><marker id="mae7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="80" cy="112" r="55" fill="var(--acc)" fill-opacity="0.18" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="80" cy="112" r="62.68445839874411" fill="var(--mut)" fill-opacity="0" stroke="var(--mut)" stroke-width="1.5"/>
  <circle cx="142.6844583987441" cy="112" r="5" fill="var(--A)" fill-opacity="0.7" stroke="var(--A)" stroke-width="1.5"/>
  <line x1="142.7" y1="105" x2="142.7" y2="48" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mge7)"/>
  <line x1="135.7" y1="112" x2="102.7" y2="112" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mae7)"/>
  <text x="150.7" y="72" class="sm bd" style="fill:var(--X)">v = 7,41 km/s</text>
  <text x="116.7" y="104" class="sm bd" text-anchor="middle" style="fill:var(--acc)">F<tspan dy="3" font-size="9">g</tspan><tspan dy="-3"></tspan></text>
  <circle cx="80" cy="112" r="2.5" fill="var(--fg)" fill-opacity="1" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="76" y="130" class="sm bd" text-anchor="middle">R<tspan dy="3" font-size="9">T</tspan><tspan dy="-3"></tspan></text>
  <text x="160" y="120" class="sm bd">h = 890 km</text>
  <text x="160" y="136" class="sm bd">r = 7,26×10⁶ m = 1,14 R<tspan dy="3" font-size="9">T</tspan><tspan dy="-3"></tspan></text>
  <text x="160" y="156" class="sm bd" style="fill:var(--X)">T = 2πr/v = 6,16×10³ s</text>
  <text x="160" y="172" class="sm bd" style="fill:var(--X)">= 1,71 h</text>
  <text x="160" y="192" class="sm">v²/r = 7,55 m/s²  (= g allí)</text>
</svg>
