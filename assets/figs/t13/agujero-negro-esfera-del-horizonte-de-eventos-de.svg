<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 160" width="100%" role="img" aria-label="Agujero negro: esfera del horizonte de eventos de radio de Schwarzschild; la luz emitida fuera escapa y la emitida dentro no">
