  <text x="70" y="52" class="sm bd" text-anchor="end">R<tspan dy="3" font-size="9">S</tspan><tspan dy="-3"></tspan></text>
  <line x1="152" y1="56" x2="212" y2="28" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mgbh)"/>
