  <text x="8" y="152" class="sm">horizonte de eventos (esfera de radio R<tspan dy="3" font-size="9">S</tspan><tspan dy="-3">)</tspan></text>
  <text x="12" y="20" class="bd">R<tspan dy="3" font-size="9">S</tspan><tspan dy="-3"> = 2GM / c²</tspan></text>
