<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 192" width="100%" role="img" aria-label="El Sol a la izquierda y la Tierra con una persona al mediodía en la cara que mira al Sol y otra a medianoche en la cara opuesta">
  <defs><marker id="max2a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbx2a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmx2a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgx2a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpx2a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfx2a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="40" cy="78" r="28" fill="var(--A)" fill-opacity="0.45" stroke="var(--A)" stroke-width="1.5"/>
  <text x="40" y="124" class="sm bd" text-anchor="middle">Sol</text>
  <circle cx="236" cy="78" r="44" fill="var(--acc)" fill-opacity="0.18" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="192" cy="78" r="4.5" fill="var(--X)" fill-opacity="1" stroke="var(--X)" stroke-width="1.5"/>
  <circle cx="280" cy="78" r="4.5" fill="var(--E)" fill-opacity="1" stroke="var(--E)" stroke-width="1.5"/>
  <line x1="188" y1="70" x2="84" y2="70" stroke="var(--X)" stroke-width="2.6" fill="none" marker-end="url(#mgx2a)"/>
  <line x1="276" y1="86" x2="84" y2="86" stroke="var(--E)" stroke-width="2.6" fill="none" marker-end="url(#mpx2a)"/>
  <text x="190" y="58" class="sm bd" text-anchor="middle" style="fill:var(--X)">mediodía</text>
  <text x="282" y="112" class="sm bd" text-anchor="middle" style="fill:var(--E)">medianoche</text>
  <line x1="70" y1="20" x2="192" y2="20" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="70" y1="16" x2="70" y2="24" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="192" y1="16" x2="192" y2="24" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="192" y1="20" x2="280" y2="20" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="192" y1="16" x2="192" y2="24" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="280" y1="16" x2="280" y2="24" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="131" y="16" class="sm bd" text-anchor="middle" style="fill:var(--X)">d − R<tspan dy="3" font-size="9">T</tspan><tspan dy="-3"></tspan></text>
  <text x="236" y="16" class="sm bd" text-anchor="middle" style="fill:var(--E)">d + R<tspan dy="3" font-size="9">T</tspan><tspan dy="-3"> (más lejos)</tspan></text>
  <text x="170" y="148" class="sm bd" text-anchor="middle">F = G m<tspan dy="3" font-size="9">S</tspan><tspan dy="-3"> m / d²: la atracción es mayor a mediodía</tspan></text>
  <text x="170" y="164" class="sm" text-anchor="middle">(diferencia ≈ 0,017 %;</text>
  <text x="170" y="180" class="sm" text-anchor="middle">dibujo no a escala: R<tspan dy="3" font-size="9">T</tspan><tspan dy="-3">/d ≈ 4×10⁻⁵)</tspan></text>
</svg>
