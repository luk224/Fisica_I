<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 275" width="100%" role="img" aria-label="Corte de la Tierra con un elfo colgado de una cuerda en el polo y en el ecuador, con su peso, la tensión y la aceleración centrípeta">
  <defs><marker id="mae11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe11" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="118" cy="132" r="64" fill="var(--acc)" fill-opacity="0.18" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="118" y1="22" x2="118" y2="214" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="126" y="14" class="sm">eje de giro (ω)</text>
  <circle cx="118" cy="60" r="5" fill="var(--fg)" fill-opacity="0.8" stroke="var(--fg)" stroke-width="1.5"/>
  <line x1="111" y1="60" x2="111" y2="93" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mae11)"/>
  <line x1="125" y1="60" x2="125" y2="27" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbe11)"/>
  <text x="104" y="80" class="sm bd" text-anchor="end" style="fill:var(--acc)">w<tspan dy="3" font-size="9">0</tspan><tspan dy="-3"></tspan></text>
  <text x="132" y="40" class="sm bd" style="fill:var(--A)">T</text>
  <text x="170" y="70" class="sm bd">polo</text>
  <circle cx="190" cy="132" r="5" fill="var(--fg)" fill-opacity="0.8" stroke="var(--fg)" stroke-width="1.5"/>
  <line x1="185" y1="126" x2="142" y2="126" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mae11)"/>
  <line x1="195" y1="126" x2="228" y2="126" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbe11)"/>
  <line x1="185" y1="139" x2="170" y2="139" stroke="var(--X)" stroke-width="2.6" fill="none" marker-end="url(#mge11)"/>
  <text x="166" y="120" class="sm bd" text-anchor="end" style="fill:var(--acc)">w<tspan dy="3" font-size="9">0</tspan><tspan dy="-3"></tspan></text>
  <text x="220" y="120" class="sm bd" style="fill:var(--A)">T</text>
  <text x="168" y="154" class="sm bd" text-anchor="end" style="fill:var(--X)">a<tspan dy="3" font-size="9">rad</tspan><tspan dy="-3"></tspan></text>
  <text x="210" y="170" class="sm bd" text-anchor="middle">ecuador</text>
  <text x="170" y="218" class="sm bd" text-anchor="middle">polo: T = w₀ = 395,0 N  (a = 0)</text>
  <text x="170" y="235" class="sm" text-anchor="middle">ecuador: w₀ − T = m a<tspan dy="3" font-size="9">rad</tspan><tspan dy="-3">  ⇒  T = 395,0 − 1,37 = 394 N</tspan></text>
  <text x="170" y="252" class="sm" text-anchor="middle">a<tspan dy="3" font-size="9">rad</tspan><tspan dy="-3"> = 0,0339 m/s² ;  m = 40,3 kg</tspan></text>
</svg>
