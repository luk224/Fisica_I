<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 200" width="100%" role="img" aria-label="Esquema de un agujero negro con su horizonte de eventos y una aglomeración de materia en órbita circular a unas cincuenta veces su radio">
  <defs><marker id="mae12" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe12" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme12" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge12" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe12" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe12" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="88" cy="96" r="11" fill="var(--fg)" fill-opacity="0.35" stroke="var(--fg)" stroke-width="1.5"/>
  <circle cx="88" cy="96" r="3" fill="var(--fg)" fill-opacity="1" stroke="var(--fg)" stroke-width="1.5"/>
  <circle cx="88" cy="96" r="62" fill="var(--mut)" fill-opacity="0" stroke="var(--mut)" stroke-width="1.5"/>
  <circle cx="26" cy="96" r="5" fill="var(--A)" fill-opacity="0.8" stroke="var(--A)" stroke-width="1.5"/>
  <line x1="26" y1="89" x2="26" y2="48" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mge12)"/>
  <line x1="88" y1="96" x2="26" y2="96" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="57.0" y="112" class="sm bd" text-anchor="middle">r</text>
  <text x="8" y="22" class="sm bd" style="fill:var(--X)">v = 3,0×10⁷ m/s</text>
  <text x="94" y="80" class="sm bd">R<tspan dy="3" font-size="9">S</tspan><tspan dy="-3"></tspan></text>
  <text x="166" y="40" class="sm bd">T = 27 h = 9,72×10⁴ s</text>
  <text x="166" y="62" class="sm bd">r = vT/2π = 4,64×10¹¹ m</text>
  <text x="166" y="84" class="sm">M = 4π²r³/(GT²)</text>
  <text x="166" y="100" class="sm bd">= 6,26×10³⁶ kg</text>
  <text x="166" y="116" class="sm bd">= 3,15×10⁶ M<tspan dy="3" font-size="9">S</tspan><tspan dy="-3"></tspan></text>
  <text x="166" y="140" class="sm" style="fill:var(--acc)">R<tspan dy="3" font-size="9">S</tspan><tspan dy="-3"> = 2GM/c²</tspan></text>
  <text x="166" y="156" class="sm bd" style="fill:var(--acc)">= 9,28×10⁹ m</text>
  <text x="170" y="190" class="sm" text-anchor="middle">esquema no a escala: r ≈ 50 R<tspan dy="3" font-size="9">S</tspan><tspan dy="-3"></tspan></text>
</svg>
