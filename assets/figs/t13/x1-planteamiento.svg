<svg class="fig" viewBox="0 0 360 492" width="100%" role="img" aria-label="Planteamiento: gravedad en el polo y en el ecuador de un cuerpo que gira, con el diagrama de cuerpo libre en cada punto">
  <defs><marker id="magra" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbgra" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmgra" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mggra" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpgra" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfgra" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="180" cy="140" r="56" fill="var(--mut)" fill-opacity="0.12" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="180" y1="68" x2="180" y2="212" stroke="var(--mut)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="186" y="66" class="sm">eje de giro ω</text>
  <line x1="180" y1="140" x2="236" y2="140" stroke="var(--mut)" stroke-width="1"/>
  <text x="208.0" y="136" class="sm bd" text-anchor="middle">R</text>
  <circle cx="180" cy="84" r="4" fill="var(--fg)"/>
  <text x="188" y="80" class="sm bd">polo N</text>
  <circle cx="236" cy="140" r="4" fill="var(--fg)"/>
  <text x="244" y="144" class="sm bd">ecuador</text>
  <text x="20" y="16" class="sm bd">Titán (síncrono) y Marte (24,6 h)</text>
  <text x="20" y="32" class="sm">masa de prueba m en la superficie</text>
  <text x="90" y="230" class="sm bd" text-anchor="middle">DCL en el polo</text>
  <line x1="90.0" y1="320.0" x2="90.0" y2="364.0" stroke="var(--A)" stroke-width="2.6" fill="none" marker-end="url(#mbgra)"/>
  <text x="90.0" y="384.0" class="sm bd" text-anchor="middle">F<tspan dy="3" font-size="9">g</tspan><tspan dy="-3">=GMm/R²</tspan></text>
  <line x1="90.0" y1="320.0" x2="90.0" y2="276.0" stroke="var(--acc)" stroke-width="2.6" fill="none" marker-end="url(#magra)"/>
  <text x="90.0" y="266.0" class="sm bd" text-anchor="middle">N</text>
  <circle cx="90" cy="320" r="3.5" fill="var(--fg)"/>
  <text x="270" y="230" class="sm bd" text-anchor="middle">DCL en el ecuador</text>
  <line x1="270.0" y1="320.0" x2="270.0" y2="372.0" stroke="var(--A)" stroke-width="2.6" fill="none" marker-end="url(#mbgra)"/>
  <text x="270.0" y="392.0" class="sm bd" text-anchor="middle">F<tspan dy="3" font-size="9">g</tspan><tspan dy="-3"></tspan></text>
  <line x1="270.0" y1="320.0" x2="270.0" y2="284.0" stroke="var(--acc)" stroke-width="2.6" fill="none" marker-end="url(#magra)"/>
  <text x="270.0" y="274.0" class="sm bd" text-anchor="middle">N</text>
  <circle cx="270" cy="320" r="3.5" fill="var(--fg)"/>
  <text x="20" y="416" class="sm">Polo: no hay aceleración, g<tspan dy="3" font-size="9">polo</tspan><tspan dy="-3"> = GM/R².</tspan></text>
  <text x="20" y="432" class="sm">Ecuador: m ω²R = F<tspan dy="3" font-size="9">g</tspan><tspan dy="-3"> - N (centrípeta), ω = 2π/T.</tspan></text>
  <text x="20" y="448" class="sm">g<tspan dy="3" font-size="9">ecuador</tspan><tspan dy="-3"> = N/m = GM/R² - ω²R.</tspan></text>
  <text x="20" y="464" class="sm">Piden g (polo, ecuador) de Titán y de Marte.</text>
</svg>
