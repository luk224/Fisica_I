<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 150" width="100%" role="img" aria-label="Dos masas distintas que se atraen con fuerzas de igual magnitud y sentido opuesto, a lo largo de la recta que las une">
  <defs><marker id="mapar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbpar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmpar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgpar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mppar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfpar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="60" cy="70" r="13" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="280" cy="70" r="24" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="60" y="74" class="sm bd" text-anchor="middle">m<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"></tspan></text>
  <text x="280" y="74" class="sm bd" text-anchor="middle">m<tspan dy="3" font-size="9">2</tspan><tspan dy="-3"></tspan></text>
  <line x1="77" y1="70" x2="147" y2="70" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mapar)"/>
  <line x1="254" y1="70" x2="184" y2="70" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbpar)"/>
  <text x="112" y="56" class="sm bd" text-anchor="middle" style="fill:var(--acc)">F<tspan dy="3" font-size="9">2 sobre 1</tspan><tspan dy="-3"></tspan></text>
  <text x="219" y="56" class="sm bd" text-anchor="middle" style="fill:var(--A)">F<tspan dy="3" font-size="9">1 sobre 2</tspan><tspan dy="-3"></tspan></text>
  <line x1="60" y1="128" x2="280" y2="128" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="60" y1="124" x2="60" y2="132" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="280" y1="124" x2="280" y2="132" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="170.0" y="122.0" class="sm" text-anchor="middle">r (entre centros)</text>
  <line x1="60" y1="84" x2="60" y2="134" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="280" y1="95" x2="280" y2="134" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="170" y="20" class="bd" text-anchor="middle">F = G m<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> m</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3"> / r²</tspan></text>
  <text x="170" y="38" class="sm" text-anchor="middle">misma magnitud, sentidos opuestos</text>
