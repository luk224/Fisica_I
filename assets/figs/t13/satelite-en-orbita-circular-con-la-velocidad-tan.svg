<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 190" width="100%" role="img" aria-label="Satélite en órbita circular con la velocidad tangente y la fuerza gravitacional dirigida al centro">
  <defs><marker id="maor" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbor" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmor" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgor" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpor" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfor" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="90" cy="110" r="30" fill="var(--acc)" fill-opacity="0.18" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="90" cy="110" r="75" fill="var(--mut)" fill-opacity="0" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="90" y1="110" x2="165" y2="110" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="165" cy="110" r="6" fill="var(--A)" fill-opacity="0.6" stroke="var(--A)" stroke-width="1.5"/>
  <line x1="165" y1="102" x2="165" y2="48" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mgor)"/>
  <line x1="157" y1="110" x2="113" y2="110" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#maor)"/>
  <text x="173" y="70" class="bd" style="fill:var(--X)">v</text>
  <text x="135" y="102" class="sm bd" text-anchor="middle" style="fill:var(--acc)">F<tspan dy="3" font-size="9">g</tspan><tspan dy="-3"></tspan></text>
  <text x="124" y="126" class="sm bd" text-anchor="middle">r</text>
  <circle cx="90" cy="110" r="2.5" fill="var(--fg)" fill-opacity="1" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="214" y="38" class="bd">F<tspan dy="3" font-size="9">g</tspan><tspan dy="-3"> = m v² / r</tspan></text>
  <text x="214" y="56" class="sm">G m<tspan dy="3" font-size="9">T</tspan><tspan dy="-3">m / r² = m v² / r</tspan></text>
  <text x="214" y="84" class="bd">v = √(G m<tspan dy="3" font-size="9">T</tspan><tspan dy="-3"> / r)</tspan></text>
  <text x="214" y="102" class="sm">T = 2πr / v</text>
  <text x="214" y="124" class="sm bd" style="fill:var(--acc)">F ⟂ v ⇒ W = 0</text>
  <text x="214" y="140" class="sm">(rapidez constante)</text>
</svg>
