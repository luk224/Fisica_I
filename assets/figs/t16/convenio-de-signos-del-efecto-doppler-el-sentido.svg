<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 262" width="100%" role="img" aria-label="Convenio de signos del efecto Doppler: el sentido positivo es del receptor L hacia la fuente S; una fuente que se acerca tiene velocidad negativa, una que se aleja positiva; un receptor que se acerca tiene velocidad positiva y uno que se aleja negativa">
  <defs><marker id="macnv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbcnv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmcnv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgcnv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpcnv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfcnv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="100" y1="22" x2="240" y2="22" stroke="var(--fg)" stroke-width="2" fill="none" marker-end="url(#mfcnv)"/>
  <text x="170" y="14" class="sm bd" text-anchor="middle">+ : de L hacia S</text>
  <text x="8" y="52" class="sm bd">Fuente que se acerca:  v<tspan dy="3" font-size="9">S</tspan><tspan dy="-3"> &lt; 0 ⇒ f</tspan><tspan dy="3" font-size="9">L</tspan><tspan dy="-3"> sube</tspan></text>
  <circle cx="110" cy="74" r="8" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <text x="110" y="78" class="sm bd" text-anchor="middle">L</text>
  <circle cx="230" cy="74" r="8" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="230" y="78" class="sm bd" text-anchor="middle">S</text>
  <line x1="218" y1="74" x2="178" y2="74" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#macnv)"/>
  <text x="8" y="102" class="sm bd">Fuente que se aleja:  v<tspan dy="3" font-size="9">S</tspan><tspan dy="-3"> &gt; 0 ⇒ f</tspan><tspan dy="3" font-size="9">L</tspan><tspan dy="-3"> baja</tspan></text>
  <circle cx="110" cy="124" r="8" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <text x="110" y="128" class="sm bd" text-anchor="middle">L</text>
  <circle cx="230" cy="124" r="8" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="230" y="128" class="sm bd" text-anchor="middle">S</text>
  <line x1="242" y1="124" x2="282" y2="124" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#macnv)"/>
  <text x="8" y="152" class="sm bd">Receptor que se acerca:  v<tspan dy="3" font-size="9">L</tspan><tspan dy="-3"> &gt; 0 ⇒ f</tspan><tspan dy="3" font-size="9">L</tspan><tspan dy="-3"> sube</tspan></text>
  <circle cx="110" cy="174" r="8" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <text x="110" y="178" class="sm bd" text-anchor="middle">L</text>
  <circle cx="230" cy="174" r="8" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="230" y="178" class="sm bd" text-anchor="middle">S</text>
  <line x1="122" y1="174" x2="162" y2="174" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#macnv)"/>
  <text x="8" y="202" class="sm bd">Receptor que se aleja:  v<tspan dy="3" font-size="9">L</tspan><tspan dy="-3"> &lt; 0 ⇒ f</tspan><tspan dy="3" font-size="9">L</tspan><tspan dy="-3"> baja</tspan></text>
  <circle cx="110" cy="224" r="8" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
