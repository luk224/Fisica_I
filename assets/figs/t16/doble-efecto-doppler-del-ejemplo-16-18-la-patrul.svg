<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 222" width="100%" role="img" aria-label="Doble efecto Doppler del ejemplo 16.18: la patrulla emite 300 hertz hacia la bodega mientras se acerca a 30 metros por segundo y la bodega recibe 329 hertz; después la bodega es la fuente de 329 hertz y la patrulla, que se acerca a 30 metros por segundo, oye 358 hertz">
  <defs><marker id="madbl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbdbl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmdbl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgdbl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpdbl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfdbl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="8" y="18" class="sm bd">Paso 1: patrulla (S, 300 Hz) → bodega (L)</text>
  <circle cx="60" cy="62" r="9" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="60" y="66" class="sm bd" text-anchor="middle">S</text>
  <circle cx="270" cy="62" r="9" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <text x="270" y="66" class="sm bd" text-anchor="middle">L</text>
  <line x1="74" y1="62" x2="124" y2="62" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#madbl)"/>
  <text x="99" y="46" class="sm" text-anchor="middle" style="fill:var(--acc)">v<tspan dy="3" font-size="9">S</tspan><tspan dy="-3"> = −30 m/s</tspan></text>
  <text x="270" y="90" class="sm bd" text-anchor="middle">f<tspan dy="3" font-size="9">W</tspan><tspan dy="-3"> = 329 Hz</tspan></text>
  <text x="8" y="116" class="sm bd">Paso 2: bodega (S, 329 Hz) → patrulla (L)</text>
  <circle cx="270" cy="160" r="9" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="270" y="164" class="sm bd" text-anchor="middle">S</text>
  <circle cx="60" cy="160" r="9" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <text x="60" y="164" class="sm bd" text-anchor="middle">L</text>
  <line x1="74" y1="160" x2="124" y2="160" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#madbl)"/>
  <text x="99" y="144" class="sm" text-anchor="middle" style="fill:var(--acc)">v<tspan dy="3" font-size="9">L</tspan><tspan dy="-3"> = +30 m/s</tspan></text>
  <text x="60" y="188" class="sm bd" text-anchor="middle">f<tspan dy="3" font-size="9">L</tspan><tspan dy="-3"> = 358 Hz</tspan></text>
  <text x="8" y="214" class="sm">+ va de L a S en cada paso (cambia entre pasos).</text>
</svg>
