<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 240" width="100%" role="img" aria-label="Cilindro imaginario de fluido en reposo entre x y x más delta x, y el mismo cilindro con onda: los extremos se desplazan y1 e y2; si y2 es mayor que y1 el volumen aumenta y la presión baja">
  <defs><marker id="macil" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbcil" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmcil" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgcil" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpcil" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfcil" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="8" y="18" class="sm bd">Sin onda</text>
  <rect x="80" y="28" width="120" height="38" rx="2" fill="var(--acc)" fill-opacity="0.12" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="80" y1="20" x2="80" y2="78" stroke="var(--fg)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="200" y1="20" x2="200" y2="78" stroke="var(--fg)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="80" y="90" class="sm" text-anchor="middle">x</text>
  <text x="200" y="90" class="sm" text-anchor="middle">x + Δx</text>
  <text x="140" y="52" class="sm" text-anchor="middle">V = S·Δx</text>
  <text x="8" y="126" class="sm bd">Con onda</text>
  <rect x="96" y="136" width="150" height="38" rx="2" fill="var(--A)" fill-opacity="0.16" stroke="var(--A)" stroke-width="1.5"/>
  <line x1="80" y1="128" x2="80" y2="184" stroke="var(--fg)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="200" y1="128" x2="200" y2="184" stroke="var(--fg)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="80" y1="128" x2="96" y2="128" stroke="var(--acc)" stroke-width="2" fill="none" marker-end="url(#macil)"/>
  <text x="88" y="122" class="sm" text-anchor="middle">y₁</text>
  <line x1="200" y1="128" x2="246" y2="128" stroke="var(--acc)" stroke-width="2" fill="none" marker-end="url(#macil)"/>
  <text x="223" y="122" class="sm" text-anchor="middle">y₂</text>
  <text x="171" y="159" class="sm" text-anchor="middle">y₂ &gt; y₁: V crece</text>
  <text x="8" y="212" class="sm">ΔV = S(y₂ − y₁)  ⇒  dV/V = ∂y/∂x</text>
  <text x="8" y="228" class="sm">∂y/∂x &gt; 0: se expande, la presión baja: p = −B ∂y/∂x</text>
</svg>
