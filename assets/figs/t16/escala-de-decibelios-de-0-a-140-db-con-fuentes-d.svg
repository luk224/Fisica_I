  <text x="106" y="263.0" class="sm">Umbral del oído (1000 Hz)</text>
  <text x="332" y="263.0" class="sm bd" text-anchor="end">10⁻¹²</text>
  <text x="8" y="284" class="sm">+10 dB ⇒ I × 10   ·   +3 dB ⇒ I × 2   ·   −6 dB ⇒ I ÷ 4</text>
