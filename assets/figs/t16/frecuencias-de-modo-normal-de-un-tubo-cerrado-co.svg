<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 192" width="100%" role="img" aria-label="Frecuencias de modo normal de un tubo cerrado con fundamental 196 hertz: 196, 588, 980, 1372 y 1764 hertz, que son los armónicos impares 1, 3, 5, 7 y 9; los dados, 1372 y 1764, son el 7 y el 9">
  <defs><marker id="mac22" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbc22" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmc22" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgc22" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpc22" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfc22" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line class="ax" x1="30" y1="110" x2="326" y2="110"/>
  <text x="326" y="142" class="sm" text-anchor="end">f (Hz)</text>
  <line x1="30.0" y1="110" x2="30.0" y2="114" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="30.0" y="126" class="sm" text-anchor="middle">0</text>
  <line x1="102.5" y1="110" x2="102.5" y2="114" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="102.5" y="126" class="sm" text-anchor="middle">500</text>
  <line x1="175.0" y1="110" x2="175.0" y2="114" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="175.0" y="126" class="sm" text-anchor="middle">1000</text>
  <line x1="247.5" y1="110" x2="247.5" y2="114" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="247.5" y="126" class="sm" text-anchor="middle">1500</text>
  <line x1="320.0" y1="110" x2="320.0" y2="114" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="320.0" y="126" class="sm" text-anchor="middle">2000</text>
  <line x1="58.4" y1="108" x2="58.4" y2="68" stroke="var(--mut)" stroke-width="4"/>
  <text x="58.4" y="60" class="sm" text-anchor="middle">n = 1</text>
  <line x1="115.3" y1="108" x2="115.3" y2="68" stroke="var(--mut)" stroke-width="4"/>
  <text x="115.3" y="60" class="sm" text-anchor="middle">n = 3</text>
  <line x1="172.1" y1="108" x2="172.1" y2="68" stroke="var(--mut)" stroke-width="4"/>
  <text x="172.1" y="60" class="sm" text-anchor="middle">n = 5</text>
  <line x1="228.9" y1="108" x2="228.9" y2="40" stroke="var(--A)" stroke-width="4"/>
  <text x="228.9" y="33" class="sm bd" text-anchor="middle" style="fill:var(--A)">n = 7</text>
  <line x1="285.8" y1="108" x2="285.8" y2="40" stroke="var(--A)" stroke-width="4"/>
  <text x="285.8" y="33" class="sm bd" text-anchor="middle" style="fill:var(--A)">n = 9</text>
  <text x="8" y="168" class="sm">Tubo cerrado con f₁ = 196 Hz: solo n impar.</text>
  <text x="8" y="184" class="sm">Dos sucesivos difieren en 2f₁ = 392 Hz.</text>
</svg>
