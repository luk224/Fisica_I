<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 176" width="100%" role="img" aria-label="Altavoces A en 0 y B a 2 metros de A, y el punto Q a 1 metro a la derecha de B; las distancias a Q son 3,00 y 1,00 metros, diferencia de 2,00 metros">
  <defs><marker id="maa13" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mba13" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mma13" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mga13" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpa13" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfa13" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line class="ax" x1="20" y1="78" x2="228.0" y2="78"/>
  <circle cx="30" cy="78" r="7" fill="var(--fg)" fill-opacity="0.35" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="30" y="82" class="sm bd" text-anchor="middle">A</text>
  <circle cx="140" cy="78" r="7" fill="var(--fg)" fill-opacity="0.35" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="140" y="82" class="sm bd" text-anchor="middle">B</text>
  <circle cx="195" cy="78" r="7" fill="var(--X)" fill-opacity="0.35" stroke="var(--X)" stroke-width="1.5"/>
  <text x="195" y="82" class="sm bd" text-anchor="middle">Q</text>
  <line x1="30" y1="86" x2="30" y2="118" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="195" y1="86" x2="195" y2="148" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="140" y1="86" x2="140" y2="148" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="112.5" y1="114" x2="30" y2="114" stroke="var(--acc)" stroke-width="1.4" fill="none" marker-end="url(#maa13)"/>
  <line x1="112.5" y1="114" x2="195" y2="114" stroke="var(--acc)" stroke-width="1.4" fill="none" marker-end="url(#maa13)"/>
  <text x="112.5" y="109" class="sm" text-anchor="middle">r<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = 3,00 m</tspan></text>
  <line x1="167.5" y1="144" x2="140" y2="144" stroke="var(--A)" stroke-width="1.4" fill="none" marker-end="url(#mba13)"/>
  <line x1="167.5" y1="144" x2="195" y2="144" stroke="var(--A)" stroke-width="1.4" fill="none" marker-end="url(#mba13)"/>
  <text x="167.5" y="158" class="sm" text-anchor="middle">r<tspan dy="3" font-size="9">B</tspan><tspan dy="-3"> = 1,00 m</tspan></text>
  <text x="8" y="18" class="sm bd">Δ = r<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> − r</tspan><tspan dy="3" font-size="9">B</tspan><tspan dy="-3"> = 2,00 m (no depende de f)</tspan></text>
  <text x="8" y="38" class="sm" style="fill:var(--X)">Constructiva: Δ = nλ ⇒ f = n·172 Hz</text>
  <text x="8" y="56" class="sm" style="fill:var(--E)">Destructiva: Δ = (n+½)λ ⇒ f = (2n+1)·86 Hz</text>
</svg>
