<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 220" width="100%" role="img" aria-label="Una fuente puntual emite en todas direcciones; a la distancia r un cuadrado de área S recibe la misma potencia que a 2r recibe un cuadrado de área 4S, así que la intensidad a doble distancia es la cuarta parte y el nivel baja 6 dB">
  <defs><marker id="mainv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbinv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mminv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mginv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpinv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfinv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="36" cy="80" r="6" fill="var(--A)" fill-opacity="0.5" stroke="var(--A)" stroke-width="1.5"/>
  <text x="36" y="104" class="sm" text-anchor="middle">fuente</text>
  <rect x="133" y="62" width="6" height="36" fill="var(--acc)" fill-opacity=".25" stroke="var(--acc)" stroke-width="1.5"/>
  <rect x="233" y="44" width="6" height="72" fill="var(--acc)" fill-opacity=".25" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="36" y1="80" x2="236" y2="44" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="36" y1="80" x2="236" y2="116" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="86.0" y1="138" x2="36" y2="138" stroke="var(--fg)" stroke-width="1.4" fill="none" marker-end="url(#mfinv)"/>
  <line x1="86.0" y1="138" x2="136" y2="138" stroke="var(--fg)" stroke-width="1.4" fill="none" marker-end="url(#mfinv)"/>
  <text x="86.0" y="133" class="sm" text-anchor="middle">r</text>
  <line x1="136.0" y1="162" x2="36" y2="162" stroke="var(--fg)" stroke-width="1.4" fill="none" marker-end="url(#mfinv)"/>
  <line x1="136.0" y1="162" x2="236" y2="162" stroke="var(--fg)" stroke-width="1.4" fill="none" marker-end="url(#mfinv)"/>
  <text x="136.0" y="157" class="sm" text-anchor="middle">2r</text>
  <line x1="136" y1="100" x2="136" y2="142" stroke="var(--fg)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="236" y1="118" x2="236" y2="166" stroke="var(--fg)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="136" y="54" class="sm" text-anchor="middle">área S</text>
  <text x="236" y="36" class="sm" text-anchor="middle">área 4S</text>
  <text x="144" y="114" class="sm bd">P₁</text>
  <text x="244" y="132" class="sm bd">P₂</text>
  <text x="8" y="192" class="sm bd">Misma potencia, área ×4  ⇒  I₂ = I₁ / 4</text>
  <text x="8" y="210" class="sm bd">β₂ − β₁ = (10 dB) log(1/4) = −6,0 dB</text>
</svg>
