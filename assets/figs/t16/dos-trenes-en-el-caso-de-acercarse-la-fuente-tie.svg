<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 204" width="100%" role="img" aria-label="Dos trenes: en el caso de acercarse la fuente tiene velocidad menos 30 y el pasajero más 18 con sentido positivo del receptor a la fuente; al alejarse los signos se invierten">
  <defs><marker id="matrs" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbtrs" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmtrs" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgtrs" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mptrs" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mftrs" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="100" y1="22" x2="220" y2="22" stroke="var(--fg)" stroke-width="2" fill="none" marker-end="url(#mftrs)"/>
  <text x="160" y="14" class="sm" text-anchor="middle">+ de L a S</text>
  <text x="8" y="48" class="sm bd">a) Se acercan:</text>
  <circle cx="80" cy="78" r="9" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <text x="80" y="82" class="sm bd" text-anchor="middle">L</text>
  <circle cx="240" cy="78" r="9" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="240" y="82" class="sm bd" text-anchor="middle">S</text>
  <line x1="92" y1="78" x2="132" y2="78" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#matrs)"/>
  <line x1="228" y1="78" x2="188" y2="78" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#matrs)"/>
  <text x="80" y="104" class="sm" text-anchor="middle">v<tspan dy="3" font-size="9">L</tspan><tspan dy="-3"> = +18,0 m/s</tspan></text>
  <text x="240" y="104" class="sm" text-anchor="middle">v<tspan dy="3" font-size="9">S</tspan><tspan dy="-3"> = −30,0 m/s</tspan></text>
  <text x="332" y="48" class="sm bd" text-anchor="end">406 Hz</text>
  <text x="8" y="132" class="sm bd">b) Se alejan:</text>
  <circle cx="80" cy="162" r="9" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <text x="80" y="166" class="sm bd" text-anchor="middle">L</text>
  <circle cx="240" cy="162" r="9" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="240" y="166" class="sm bd" text-anchor="middle">S</text>
  <line x1="68" y1="162" x2="28" y2="162" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#matrs)"/>
  <line x1="252" y1="162" x2="292" y2="162" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#matrs)"/>
  <text x="80" y="188" class="sm" text-anchor="middle">v<tspan dy="3" font-size="9">L</tspan><tspan dy="-3"> = −18,0 m/s</tspan></text>
  <text x="240" y="188" class="sm" text-anchor="middle">v<tspan dy="3" font-size="9">S</tspan><tspan dy="-3"> = +30,0 m/s</tspan></text>
  <text x="332" y="132" class="sm bd" text-anchor="end">307 Hz</text>
</svg>
