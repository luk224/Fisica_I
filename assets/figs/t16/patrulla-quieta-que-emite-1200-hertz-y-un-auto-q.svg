<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 250" width="100%" role="img" aria-label="Patrulla quieta que emite 1200 hertz y un auto que se acerca a 7,02 metros por segundo: el auto recibe 1224,5 hertz y, como fuente de esa frecuencia, la patrulla recibe 1250 hertz">
  <defs><marker id="marad" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbrad" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmrad" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgrad" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mprad" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfrad" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="8" y="14" class="sm bd">Paso 1: patrulla (S, quieta) → auto (L)</text>
  <circle cx="60" cy="62" r="9" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="60" y="66" class="sm bd" text-anchor="middle">S</text>
  <circle cx="250" cy="62" r="9" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <text x="250" y="66" class="sm bd" text-anchor="middle">L</text>
  <line x1="238" y1="62" x2="198" y2="62" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#marad)"/>
  <text x="218" y="88" class="sm" text-anchor="middle">7,02 m/s</text>
  <text x="8" y="112" class="sm bd">1200 Hz  ⇒  el auto recibe 1224,5 Hz</text>
  <text x="8" y="140" class="sm bd">Paso 2: auto (S) → patrulla (L)</text>
  <circle cx="60" cy="188" r="9" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <text x="60" y="192" class="sm bd" text-anchor="middle">L</text>
  <circle cx="250" cy="188" r="9" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="250" y="192" class="sm bd" text-anchor="middle">S</text>
  <line x1="238" y1="188" x2="198" y2="188" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#marad)"/>
  <text x="218" y="214" class="sm" text-anchor="middle">7,02 m/s</text>
  <text x="8" y="238" class="sm bd">1224,5 Hz  ⇒  la patrulla recibe 1250 Hz</text>
</svg>
