<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 282" width="100%" role="img" aria-label="Camión de bomberos y camión delante, ambos hacia el norte; en el primer paso el sentido positivo es hacia el sur y las velocidades son menos 20 y menos 30; en el segundo paso el positivo es hacia el norte y las velocidades son más 30 y más 20">
  <defs><marker id="macam" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbcam" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmcam" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgcam" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpcam" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfcam" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="8" y="14" class="sm bd">Paso 1: bomberos (S) → camión (L)</text>
  <circle cx="90" cy="76" r="9" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="90" y="80" class="sm bd" text-anchor="middle">S</text>
  <circle cx="230" cy="76" r="9" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <text x="230" y="80" class="sm bd" text-anchor="middle">L</text>
  <line x1="102" y1="76" x2="142" y2="76" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#macam)"/>
  <text x="122" y="102" class="sm" text-anchor="middle">30,0 m/s</text>
  <line x1="242" y1="76" x2="276" y2="76" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#macam)"/>
  <text x="260" y="102" class="sm" text-anchor="middle">20,0 m/s</text>
  <line x1="230" y1="52" x2="90" y2="52" stroke="var(--fg)" stroke-width="1.6" fill="none" marker-end="url(#mfcam)"/>
  <text x="160" y="46" class="sm" text-anchor="middle">+ hacia el sur</text>
  <text x="8" y="130" class="sm bd">L: v<tspan dy="3" font-size="9">L</tspan><tspan dy="-3"> = −20   S: v</tspan><tspan dy="3" font-size="9">S</tspan><tspan dy="-3"> = −30   ⇒   f' = 2064 Hz</tspan></text>
  <text x="8" y="154" class="sm bd">Paso 2: camión (S) → bomberos (L)</text>
  <circle cx="230" cy="216" r="9" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="230" y="220" class="sm bd" text-anchor="middle">S</text>
  <circle cx="90" cy="216" r="9" fill="var(--X)" fill-opacity="0.3" stroke="var(--X)" stroke-width="1.5"/>
  <text x="90" y="220" class="sm bd" text-anchor="middle">L</text>
  <line x1="102" y1="216" x2="142" y2="216" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#macam)"/>
  <text x="122" y="242" class="sm" text-anchor="middle">30,0 m/s</text>
  <line x1="242" y1="216" x2="276" y2="216" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#macam)"/>
  <text x="260" y="242" class="sm" text-anchor="middle">20,0 m/s</text>
  <line x1="90" y1="192" x2="230" y2="192" stroke="var(--fg)" stroke-width="1.6" fill="none" marker-end="url(#mfcam)"/>
  <text x="160" y="186" class="sm" text-anchor="middle">+ hacia el norte</text>
  <text x="8" y="270" class="sm bd">L: v<tspan dy="3" font-size="9">L</tspan><tspan dy="-3"> = +30   S: v</tspan><tspan dy="3" font-size="9">S</tspan><tspan dy="-3"> = +20   ⇒   f = 2120 Hz</tspan></text>
</svg>
