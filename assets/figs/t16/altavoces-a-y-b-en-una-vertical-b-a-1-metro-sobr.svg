<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 190" width="100%" role="img" aria-label="Altavoces A y B en una vertical, B a 1 metro sobre A, y un punto P a 4 metros a la derecha y 2 metros sobre A; las distancias son 4,47 m desde A y 4,12 m desde B, diferencia 0,35 m">
  <defs><marker id="mag13" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbg13" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmg13" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgg13" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpg13" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfg13" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="40" cy="130" r="6" fill="var(--fg)" fill-opacity="0.4" stroke="var(--fg)" stroke-width="1.5"/>
  <circle cx="40" cy="80" r="6" fill="var(--fg)" fill-opacity="0.4" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="30" y="134" class="sm bd" text-anchor="end">A</text>
  <text x="30" y="84" class="sm bd" text-anchor="end">B</text>
  <circle cx="240" cy="30" r="5" fill="var(--X)"/>
  <text x="248" y="34" class="sm bd" style="fill:var(--X)">P</text>
  <line x1="40" y1="130" x2="240" y2="30" stroke="var(--acc)" stroke-width="2.4"/>
  <line x1="40" y1="80" x2="240" y2="30" stroke="var(--A)" stroke-width="2.4"/>
  <text x="146" y="102" class="sm" style="fill:var(--acc)">d<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = 4,47 m</tspan></text>
  <text x="70" y="26" class="sm" style="fill:var(--A)">d<tspan dy="3" font-size="9">B</tspan><tspan dy="-3"> = 4,12 m</tspan></text>
  <line x1="240" y1="30" x2="240" y2="130" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="40" y1="130" x2="240" y2="130" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="140" y="146" class="sm" text-anchor="middle">4,00 m</text>
  <text x="246" y="80" class="sm">2,00 m</text>
  <text x="20" y="170" class="sm bd">d = d<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> − d</tspan><tspan dy="3" font-size="9">B</tspan><tspan dy="-3"> = 4,47 − 4,12 = 0,35 m</tspan></text>
</svg>
