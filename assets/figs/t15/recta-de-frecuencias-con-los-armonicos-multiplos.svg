<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 140" width="100%" role="img" aria-label="Recta de frecuencias con los armónicos múltiplos de 156 hercios: 156, 312, 468, 624 y 780; los dos armónicos consecutivos medidos, 624 y 780, están separados 156 hercios que es la fundamental">
  <defs><marker id="maeg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbeg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmeg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgeg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpeg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfeg" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line class="ax" x1="24.0" y1="64" x2="322.0" y2="64"/>
  <text x="24" y="100" class="sm" text-anchor="start">f (Hz)</text>
  <line x1="80.9" y1="50" x2="80.9" y2="70" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="80.9" y="85" class="sm" text-anchor="middle">156</text>
  <text x="80.9" y="44" class="sm" text-anchor="middle">n = 1</text>
  <line x1="137.9" y1="50" x2="137.9" y2="70" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="137.9" y="85" class="sm" text-anchor="middle">312</text>
  <text x="137.9" y="44" class="sm" text-anchor="middle">n = 2</text>
  <line x1="194.8" y1="50" x2="194.8" y2="70" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="194.8" y="85" class="sm" text-anchor="middle">468</text>
  <text x="194.8" y="44" class="sm" text-anchor="middle">n = 3</text>
  <line x1="251.8" y1="50" x2="251.8" y2="70" stroke="var(--A)" stroke-width="2.5"/>
  <text x="251.8" y="85" class="sm bd" text-anchor="middle">624</text>
  <text x="251.8" y="44" class="sm bd" text-anchor="middle">n = 4</text>
  <line x1="308.7" y1="50" x2="308.7" y2="70" stroke="var(--A)" stroke-width="2.5"/>
  <text x="308.7" y="85" class="sm bd" text-anchor="middle">780</text>
  <text x="308.7" y="44" class="sm bd" text-anchor="middle">n = 5</text>
  <line x1="280.2" y1="106.0" x2="251.8" y2="106" stroke="var(--A)" stroke-width="1.6" fill="none" marker-end="url(#mbeg)"/>
  <line x1="280.2" y1="106.0" x2="308.7" y2="106" stroke="var(--A)" stroke-width="1.6" fill="none" marker-end="url(#mbeg)"/>
  <text x="318.7" y="122" class="sm bd" text-anchor="end">780 − 624 = 156 Hz = f<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"></tspan></text>
</svg>
