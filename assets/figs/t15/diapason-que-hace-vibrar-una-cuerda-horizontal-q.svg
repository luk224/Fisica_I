<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 165" width="100%" role="img" aria-label="Diapasón que hace vibrar una cuerda horizontal que pasa por una polea y sostiene una masa de 1,50 kilogramos; la tensión es el peso de la masa, 14,7 newtons">
