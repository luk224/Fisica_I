  <rect x="112" y="52" width="62" height="26" rx="2" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="143.0" y="69.0" class="sm bd" text-anchor="middle">5,0 kg</text>
  <rect x="208" y="56" width="40" height="22" rx="2" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="228.0" y="71.0" class="sm bd" text-anchor="middle">2,0 kg</text>
