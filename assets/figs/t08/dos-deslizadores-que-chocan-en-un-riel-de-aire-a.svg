<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 206" width="100%" role="img" aria-label="Dos deslizadores que chocan en un riel de aire, antes y después">
  <defs><marker id="mads" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbds" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmds" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgds" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpds" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfds" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="10" y1="78" x2="350" y2="78" stroke="var(--fg)" stroke-width="1.6"/>
  <line x1="10" y1="172" x2="350" y2="172" stroke="var(--fg)" stroke-width="1.6"/>
  <text x="8" y="14" class="sm bd">Antes del choque</text>
  <rect x="100" y="52" width="50" height="26" rx="2" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="125.0" y="69.0" class="sm bd" text-anchor="middle">A</text>
  <line x1="125.0" y1="40" x2="161.0" y2="40" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mads)"/>
  <text x="143.0" y="33" class="sm bd" text-anchor="middle">+2,0</text>
  <rect x="220" y="52" width="40" height="26" rx="2" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="240.0" y="69.0" class="sm bd" text-anchor="middle">B</text>
  <line x1="240.0" y1="40" x2="204.0" y2="40" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbds)"/>
  <text x="222.0" y="33" class="sm bd" text-anchor="middle">−2,0</text>
  <text x="8" y="106" class="sm bd">Después del choque</text>
  <rect x="100" y="146" width="50" height="26" rx="2" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="125.0" y="163.0" class="sm bd" text-anchor="middle">A</text>
  <line x1="125.0" y1="134" x2="113.0" y2="134" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mads)"/>
  <text x="119.0" y="127" class="sm bd" text-anchor="middle">−0,40</text>
  <rect x="220" y="146" width="40" height="26" rx="2" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="240.0" y="163.0" class="sm bd" text-anchor="middle">B</text>
  <line x1="240.0" y1="134" x2="300.0" y2="134" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbds)"/>
  <text x="270.0" y="127" class="sm bd" text-anchor="middle">+2,0</text>
  <text x="350" y="14" class="sm bd" text-anchor="end">P = 0,40 kg·m/s</text>
  <text x="8" y="196" class="sm">m<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = 0,50 kg, m</tspan><tspan dy="3" font-size="9">B</tspan><tspan dy="-3"> = 0,30 kg; velocidades en m/s</tspan></text>
</svg>
