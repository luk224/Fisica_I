  <text x="8" y="198" class="sm">v<tspan dy="3" font-size="9">C</tspan><tspan dy="-3"> = −(v</tspan><tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> + v</tspan><tspan dy="3" font-size="9">B</tspan><tspan dy="-3">): mayor que v</tspan><tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> y que v</tspan><tspan dy="3" font-size="9">B</tspan><tspan dy="-3"></tspan></text>
</svg>
