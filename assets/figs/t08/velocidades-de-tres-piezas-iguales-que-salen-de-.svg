<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 208" width="100%" role="img" aria-label="Velocidades de tres piezas iguales que salen de un juguete en reposo">
  <defs><marker id="max7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbx7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmx7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgx7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpx7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfx7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line class="ax" x1="40" y1="110" x2="280" y2="110"/>
  <line class="ax" x1="150" y1="190" x2="150" y2="12"/>
  <text x="280" y="102" class="sm bd" text-anchor="end">x</text>
  <text x="156" y="22" class="sm bd">y</text>
  <line x1="150" y1="110" x2="102" y2="110" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#max7)"/>
  <text x="102" y="102" class="sm bd" text-anchor="middle">A</text>
  <line x1="150" y1="110" x2="150" y2="172.4" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbx7)"/>
