<svg class="fig" viewBox="0 0 360 340" width="100%" role="img" aria-label="Planteamiento: varilla con pivote golpeada por una bala que se incrusta">
  <defs><marker id="mavar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbvar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmvar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgvar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpvar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfvar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="96" y="20" width="28" height="10" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <circle cx="110" cy="30" r="4" fill="var(--fg)" fill-opacity="0.8" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="100" y="36" class="sm bd" text-anchor="end">A</text>
  <rect x="106" y="30" width="8" height="140" rx="2" fill="var(--A)" fill-opacity="0.15" stroke="var(--A)" stroke-width="1.5"/>
  <text x="120" y="174" class="sm bd">M , L</text>
  <line x1="140" y1="30" x2="140" y2="125" stroke="var(--mut)" stroke-width="1.2"/>
  <line x1="135" y1="30" x2="145" y2="30" stroke="var(--mut)" stroke-width="1.2"/>
  <line x1="135" y1="125" x2="145" y2="125" stroke="var(--mut)" stroke-width="1.2"/>
  <text x="148" y="81.5" class="sm bd">a</text>
  <line x1="10" y1="125" x2="104" y2="125" stroke="var(--acc)" stroke-width="2.6" fill="none" marker-end="url(#mavar)"/>
  <text x="10" y="117" class="sm bd">m , v</text>
  <text x="20" y="194" class="sm">Se incrusta: choque perfectamente inelástico</text>
  <text x="290" y="10" class="sm bd" text-anchor="middle">DCL en el choque</text>
  <line x1="278.0" y1="100.0" x2="362.0" y2="100.0" stroke="var(--mut)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="365.0" y="104.0" class="sm" text-anchor="start">x</text>
  <line x1="290.0" y1="112.0" x2="290.0" y2="28.0" stroke="var(--mut)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="290.0" y="24.0" class="sm" text-anchor="middle">y</text>
  <line x1="290.0" y1="100.0" x2="290.0" y2="140.0" stroke="var(--A)" stroke-width="2.6" fill="none" marker-end="url(#mbvar)"/>
  <text x="290.0" y="160.0" class="sm bd" text-anchor="middle">(M+m)g</text>
  <line x1="290.0" y1="100.0" x2="261.7" y2="71.7" stroke="var(--X)" stroke-width="2.6" fill="none" marker-end="url(#mgvar)"/>
  <text x="255.4" y="64.4" class="sm bd" text-anchor="end">R</text>
  <circle cx="290" cy="100" r="3.5" fill="var(--fg)"/>
  <text x="20" y="224" class="sm bd">Antes: L<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = m v a (solo la bala).</tspan></text>
  <text x="20" y="240" class="sm bd">Después: L<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = I</tspan><tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> ω , con</tspan></text>
  <text x="20" y="256" class="sm bd">I<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = ⅓ML² + ma² (varilla + bala).</tspan></text>
  <text x="20" y="272" class="sm">Se conserva L<tspan dy="3" font-size="9">A</tspan><tspan dy="-3">; p lineal NO</tspan></text>
  <text x="20" y="288" class="sm">(el pivote ejerce impulso R).</text>
  <text x="20" y="304" class="sm">R pasa por A: sin momento respecto de A.</text>
  <text x="20" y="320" class="sm">Piden: L<tspan dy="3" font-size="9">A</tspan><tspan dy="-3">, p antes/después, energía perdida.</tspan></text>
</svg>
