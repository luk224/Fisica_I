  <text x="89.7" y="177" class="sm bd" text-anchor="middle">coche: 950 × 19,5 = 18,5</text>
  <text x="129.4" y="93.3" class="sm bd">camioneta:</text>
  <text x="129.4" y="107.3" class="sm bd">1900 × 21,9 = 41,7</text>
