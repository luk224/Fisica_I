<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 204" width="100%" role="img" aria-label="Varilla colgada de un pivote en su extremo superior golpeada por una bala horizontal a una distancia a del pivote">
  <defs><marker id="max9" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbx9" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmx9" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgx9" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpx9" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfx9" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="110" y1="24" x2="190" y2="24" stroke="var(--fg)" stroke-width="3"/>
  <line x1="150" y1="24" x2="150" y2="164" stroke="var(--acc)" stroke-width="6"/>
  <circle cx="150" cy="24" r="5" fill="var(--mut)" fill-opacity="0.5" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="162" y="18" class="sm bd">A (pivote)</text>
  <line x1="24" y1="124" x2="142" y2="124" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbx9)"/>
  <text x="24" y="116" class="sm bd">m, v</text>
  <line x1="172" y1="24" x2="172" y2="124" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="178" y="78" class="sm bd">a</text>
  <text x="164" y="178" class="sm bd">L, M</text>
  <line x1="120" y1="32" x2="80" y2="32" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mgx9)"/>
  <text x="8" y="50" class="sm" text-anchor="start">fuerza del pivote</text>
  <text x="8" y="63" class="sm" text-anchor="start">(impulsiva)</text>
  <text x="236" y="60" class="sm bd">L<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = m v a</tspan></text>
  <text x="236" y="78" class="sm">I<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = ML²/3 + m a²</tspan></text>
  <text x="236" y="96" class="sm">ω = m v a / I<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"></tspan></text>
  <text x="236" y="128" class="sm bd">P no se conserva</text>
  <text x="236" y="144" class="sm">(actúa el pivote)</text>
  <text x="8" y="196" class="sm">Esquema sin escala; datos del enunciado simbólicos</text>
</svg>
