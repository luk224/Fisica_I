<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 192" width="100%" role="img" aria-label="Dos vectores cantidad de movimiento de igual módulo, uno hacia el norte y otro hacia el este, y su suma vectorial">
  <defs><marker id="mapv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbpv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmpv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgpv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mppv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfpv" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line class="ax" x1="110" y1="150" x2="245" y2="150"/>
  <line class="ax" x1="110" y1="150" x2="110" y2="14"/>
  <text x="245" y="142" class="sm" text-anchor="end">este (x)</text>
  <text x="116" y="22" class="sm">norte (y)</text>
  <line x1="110" y1="150" x2="110" y2="65" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mapv)"/>
  <text x="104" y="107.5" class="sm bd" text-anchor="end">p<tspan dy="3" font-size="9">1</tspan><tspan dy="-3">: 2,0 × 10⁴</tspan></text>
  <line x1="110" y1="150" x2="195" y2="150" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbpv)"/>
  <text x="152.5" y="167" class="sm bd" text-anchor="middle">p<tspan dy="3" font-size="9">2</tspan><tspan dy="-3">: 2,0 × 10⁴</tspan></text>
  <line x1="110" y1="150" x2="195" y2="65" stroke="var(--X)" stroke-width="3" fill="none" stroke-dasharray="5 4" marker-end="url(#mgpv)"/>
  <text x="201" y="61" class="sm bd">p<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> + p</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3"></tspan></text>
  <text x="201" y="75" class="sm">2,8 × 10⁴ (no 4,0)</text>
  <text x="8" y="184" class="sm">Dos coches de 1000 kg a 20 m/s (kg·m/s)</text>
</svg>
