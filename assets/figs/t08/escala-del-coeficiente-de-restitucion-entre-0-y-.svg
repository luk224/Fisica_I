  <text x="40" y="58" class="sm" text-anchor="middle">(unidos)</text>
  <text x="165.0" y="43" class="sm bd" text-anchor="middle">inelástico</text>
  <text x="290" y="43" class="sm bd" text-anchor="middle">elástico</text>
  <text x="8" y="124" class="sm bd">e = (velocidad de separación)</text>
  <text x="8" y="140" class="sm bd">      / (velocidad de acercamiento)</text>
