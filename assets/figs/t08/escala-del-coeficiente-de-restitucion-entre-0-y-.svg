  <defs><marker id="maee" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbee" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmee" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgee" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpee" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfee" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="20" y1="74" x2="345" y2="74" stroke="var(--fg)" stroke-width="2" fill="none" marker-end="url(#mfee)"/>
  <line x1="40" y1="68" x2="40" y2="80" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="40" y="96" class="sm bd" text-anchor="middle">0</text>
  <line x1="165.0" y1="68" x2="165.0" y2="80" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="165.0" y="96" class="sm bd" text-anchor="middle">0,5</text>
  <line x1="290" y1="68" x2="290" y2="80" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="290" y="96" class="sm bd" text-anchor="middle">1</text>
