<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 198" width="100%" role="img" aria-label="Suma vectorial de las cantidades de movimiento de un automóvil que va al norte y una vagoneta que va al este">
  <defs><marker id="macr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbcr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmcr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgcr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpcr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfcr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="112" y1="152" x2="212.0" y2="152" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbcr)"/>
  <line x1="112" y1="152" x2="112" y2="77.0" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#macr)"/>
  <line x1="112" y1="152" x2="212.0" y2="77.0" stroke="var(--X)" stroke-width="3" fill="none" stroke-dasharray="5 4" marker-end="url(#mgcr)"/>
  <text x="162.0" y="170" class="sm bd" text-anchor="middle">vagoneta: 2,0 × 10⁴</text>
  <text x="106" y="114.5" class="sm bd" text-anchor="end">auto: 1,5 × 10⁴</text>
  <text x="220.0" y="75.0" class="sm bd">P = 2,5 × 10⁴</text>
  <text x="220.0" y="89.0" class="sm">a 37° sobre el este</text>
  <text x="8" y="14" class="sm bd">V = P/M = 8,3 m/s, también a 37°</text>
  <text x="8" y="188" class="sm">Cantidades de movimiento en kg·m/s</text>
</svg>
