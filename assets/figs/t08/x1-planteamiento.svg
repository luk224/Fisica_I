<svg class="fig" viewBox="0 0 360 330" width="100%" role="img" aria-label="Planteamiento: choque en el plano de un átomo de helio con una molécula de oxígeno en reposo">
  <defs><marker id="mahel" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbhel" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmhel" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mghel" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mphel" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfhel" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="30" y1="60" x2="30" y2="14" stroke="var(--mut)" stroke-width="1.3" fill="none" marker-end="url(#mmhel)"/>
  <text x="36" y="18" class="sm">y</text>
  <line x1="30" y1="60" x2="76" y2="60" stroke="var(--mut)" stroke-width="1.3" fill="none" marker-end="url(#mmhel)"/>
  <text x="80" y="64" class="sm">x</text>
  <text x="20" y="100" class="sm bd">ANTES</text>
  <circle cx="60" cy="130" r="12" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="60" y="134" class="sm bd" text-anchor="middle">He</text>
  <line x1="76" y1="130" x2="130" y2="130" stroke="var(--acc)" stroke-width="2.4" fill="none" marker-end="url(#mahel)"/>
  <text x="100" y="122" class="sm bd" text-anchor="middle">v₀</text>
  <circle cx="190" cy="130" r="15" fill="var(--E)" fill-opacity="0.25" stroke="var(--E)" stroke-width="1.5"/>
  <text x="190" y="134" class="sm bd" text-anchor="middle">O₂</text>
  <text x="190" y="156" class="sm" text-anchor="middle">en reposo</text>
  <text x="210" y="100" class="sm bd">DESPUÉS</text>
  <circle cx="250" cy="150" r="12" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="250" y="154" class="sm bd" text-anchor="middle">He</text>
  <line x1="250" y1="136" x2="250" y2="100" stroke="var(--acc)" stroke-width="2.4" fill="none" marker-end="url(#mahel)"/>
  <text x="262" y="112" class="sm bd">v₁ (⊥)</text>
  <circle cx="310" cy="170" r="15" fill="var(--E)" fill-opacity="0.25" stroke="var(--E)" stroke-width="1.5"/>
  <text x="310" y="174" class="sm bd" text-anchor="middle">O₂</text>
  <line x1="320" y1="178" x2="350" y2="198" stroke="var(--E)" stroke-width="2.4" fill="none" marker-end="url(#mphel)"/>
  <text x="340" y="190" class="sm bd">v₂</text>
  <text x="20" y="226" class="sm bd">m₁ = 4 u ; v₀ = 1200 m/s ; m₂ = 32 u</text>
  <text x="20" y="242" class="sm bd">K₁ = ¼ K₀ ; v₁ en +y</text>
  <text x="20" y="258" class="sm">Conservación de p (vector, por ejes):</text>
  <text x="20" y="274" class="sm">x:  m₁v₀ = m₂v₂ₓ</text>
  <text x="20" y="290" class="sm">y:  0 = m₁v₁ - m₂v₂ᵧ   (O₂ va hacia -y)</text>
  <text x="20" y="306" class="sm">Piden: v₂ y fracción de K perdida.</text>
</svg>
