<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 236" width="100%" role="img" aria-label="Niveles de la bandeja colgada del resorte: longitud natural, choque, nuevo equilibrio y puntos extremos del movimiento">
  <defs><marker id="max3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbx3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmx3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgx3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpx3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfx3" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="122" y1="26" x2="202" y2="26" stroke="var(--mut)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="114" y="30" class="sm bd" text-anchor="end">−86,6</text>
  <text x="210" y="30" class="sm" text-anchor="start">extremo superior</text>
  <line x1="122" y1="62" x2="202" y2="62" stroke="var(--fg)" stroke-width="2.2"/>
  <text x="114" y="66" class="sm bd" text-anchor="end">0</text>
  <text x="210" y="66" class="sm" text-anchor="start">longitud natural</text>
  <line x1="122" y1="98" x2="202" y2="98" stroke="var(--A)" stroke-width="2.2"/>
  <text x="114" y="102" class="sm bd" text-anchor="end">9,8</text>
  <text x="210" y="102" class="sm bd" text-anchor="start">choque (V = 2,09 m/s)</text>
  <line x1="122" y1="134" x2="202" y2="134" stroke="var(--X)" stroke-width="2.2"/>
  <text x="114" y="138" class="sm bd" text-anchor="end">29,4</text>
  <text x="210" y="138" class="sm bd" text-anchor="start">equilibrio nuevo</text>
  <line x1="122" y1="170" x2="202" y2="170" stroke="var(--acc)" stroke-width="2.2"/>
  <text x="114" y="174" class="sm bd" text-anchor="end">145,4</text>
  <text x="210" y="174" class="sm" text-anchor="start">punto más bajo</text>
  <line x1="162" y1="102" x2="162" y2="130" stroke="var(--A)" stroke-width="2" fill="none" marker-end="url(#mbx3)"/>
  <text x="8" y="14" class="sm bd">estiramiento (mm)</text>
  <text x="8" y="194" class="sm">Niveles ordenados, no a escala.</text>
  <text x="8" y="210" class="sm">El choque ocurre 19,6 mm sobre el equilibrio nuevo.</text>
  <text x="8" y="226" class="sm bd">A = 145,4 − 29,4 = 116 mm</text>
</svg>
