<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 202" width="100%" role="img" aria-label="Dos personas en reposo que se empujan y salen con cantidades de movimiento iguales y opuestas">
  <defs><marker id="mask" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbsk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmsk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgsk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpsk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfsk" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="10" y1="62" x2="350" y2="62" stroke="var(--fg)" stroke-width="1.6"/>
  <line x1="10" y1="162" x2="350" y2="162" stroke="var(--fg)" stroke-width="1.6"/>
  <text x="8" y="16" class="sm bd">Antes: en reposo</text>
  <circle cx="166" cy="46" r="14" fill="var(--acc)" fill-opacity="0.15" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="194" cy="46" r="14" fill="var(--A)" fill-opacity="0.15" stroke="var(--A)" stroke-width="1.5"/>
  <text x="166" y="50" class="sm bd" text-anchor="middle">A</text>
  <text x="194" y="50" class="sm bd" text-anchor="middle">B</text>
  <text x="300" y="50" class="sm bd" text-anchor="middle">P = 0</text>
  <text x="8" y="98" class="sm bd">Después de empujarse</text>
  <circle cx="80" cy="146" r="14" fill="var(--acc)" fill-opacity="0.15" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="280" cy="146" r="14" fill="var(--A)" fill-opacity="0.15" stroke="var(--A)" stroke-width="1.5"/>
  <text x="80" y="150" class="sm bd" text-anchor="middle">A</text>
  <text x="280" y="150" class="sm bd" text-anchor="middle">B</text>
  <line x1="62" y1="146" x2="22" y2="146" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mask)"/>
  <line x1="298" y1="146" x2="338" y2="146" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbsk)"/>
  <text x="42" y="122" class="sm bd" text-anchor="middle">p<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = −p</tspan></text>
  <text x="318" y="122" class="sm bd" text-anchor="middle">p<tspan dy="3" font-size="9">B</tspan><tspan dy="-3"> = +p</tspan></text>
  <text x="180" y="192" class="sm bd" text-anchor="middle">P = p<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> + p</tspan><tspan dy="3" font-size="9">B</tspan><tspan dy="-3"> = 0, antes y después</tspan></text>
</svg>
