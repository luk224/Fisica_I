<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 182" width="100%" role="img" aria-label="Barras de energía cinética antes y después de un choque totalmente inelástico">
  <defs><marker id="maik" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbik" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmik" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgik" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpik" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfik" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="8" y="16" class="sm bd">Energía cinética del sistema (J)</text>
  <text x="8" y="44" class="sm">antes</text>
  <rect x="62" y="32" width="125.0" height="16" rx="2" fill="var(--acc)" fill-opacity="0.5" stroke="var(--acc)" stroke-width="1.5"/>
  <rect x="187.0" y="32" width="75.0" height="16" rx="2" fill="var(--A)" fill-opacity="0.5" stroke="var(--A)" stroke-width="1.5"/>
  <text x="268" y="44" class="sm bd">1,6</text>
  <text x="8" y="84" class="sm">después</text>
  <rect x="62" y="72" width="12.5" height="16" rx="2" fill="var(--X)" fill-opacity="0.5" stroke="var(--X)" stroke-width="1.5"/>
  <text x="82.5" y="84" class="sm bd">0,10  (1/16 de 1,6)</text>
  <text x="8" y="120" class="sm">Antes: K<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = 1,0 J y K</tspan><tspan dy="3" font-size="9">B</tspan><tspan dy="-3"> = 0,60 J</tspan></text>
  <text x="8" y="140" class="sm bd">P = 0,40 kg·m/s no cambia</text>
  <text x="8" y="158" class="sm">15/16 de la energía cinética se convierten</text>
  <text x="8" y="173" class="sm">en otras formas de energía</text>
</svg>
