<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 194" width="100%" role="img" aria-label="Triángulo de cantidad de movimiento del choque de dos robots">
  <defs><marker id="marb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbrb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmrb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgrb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mprb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfrb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="30" y1="120" x2="190.0" y2="120.0" stroke="var(--fg)" stroke-width="3" fill="none" stroke-dasharray="5 4" marker-end="url(#mfrb)"/>
  <line x1="30" y1="120" x2="99.3" y2="80.0" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#marb)"/>
  <line x1="99.3" y1="80.0" x2="190.0" y2="120.0" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbrb)"/>
  <text x="110.0" y="140" class="sm bd" text-anchor="middle">P = 40  (antes = después)</text>
  <text x="34" y="68" class="sm bd">p<tspan dy="3" font-size="9">A2</tspan><tspan dy="-3"> = 20·1,0 = 20</tspan></text>
  <text x="200" y="94.0" class="sm bd">p<tspan dy="3" font-size="9">B2</tspan><tspan dy="-3"> = 12·2,1 ≈ 25</tspan></text>
  <text x="200" y="110.0" class="sm">a −24° (hacia abajo)</text>
  <text x="8" y="168" class="sm">Los vectores cierran un triángulo (kg·m/s):</text>
  <text x="8" y="184" class="sm bd">p<tspan dy="3" font-size="9">A2</tspan><tspan dy="-3"> + p</tspan><tspan dy="3" font-size="9">B2</tspan><tspan dy="-3"> = P</tspan></text>
</svg>
