<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 202" width="100%" role="img" aria-label="Rifle que retrocede al disparar una bala: cantidades de movimiento iguales y opuestas">
  <defs><marker id="marf" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbrf" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmrf" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgrf" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mprf" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfrf" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="10" y1="80" x2="350" y2="80" stroke="var(--fg)" stroke-width="1.6"/>
  <line x1="10" y1="170" x2="350" y2="170" stroke="var(--fg)" stroke-width="1.6"/>
  <text x="8" y="16" class="sm bd">Antes: rifle (3,00 kg) y bala (5,00 g) en reposo</text>
  <rect x="150" y="54" width="60" height="26" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="180.0" y="71.0" class="sm bd" text-anchor="middle">rifle</text>
  <text x="8" y="108" class="sm bd">Después del disparo</text>
  <rect x="110" y="144" width="60" height="26" rx="2" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="140.0" y="161.0" class="sm bd" text-anchor="middle">rifle</text>
  <line x1="108" y1="156" x2="80" y2="156" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#marf)"/>
  <circle cx="250" cy="160" r="4" fill="var(--A)" fill-opacity="0.6" stroke="var(--A)" stroke-width="1.5"/>
  <line x1="258" y1="160" x2="350" y2="160" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbrf)"/>
  <text x="8" y="138" class="sm bd">v<tspan dy="3" font-size="9">R</tspan><tspan dy="-3"> = −0,500 m/s</tspan></text>
  <text x="350" y="138" class="sm bd" text-anchor="end">v<tspan dy="3" font-size="9">B</tspan><tspan dy="-3"> = +300 m/s</tspan></text>
  <text x="8" y="192" class="sm">p = −1,50 y +1,50 kg·m/s;  K<tspan dy="3" font-size="9">B</tspan><tspan dy="-3"> = 225 J,  K</tspan><tspan dy="3" font-size="9">R</tspan><tspan dy="-3"> = 0,375 J</tspan></text>
</svg>
