  <text x="190" y="16" class="sm bd">Pelota pequeña y rápida</text>
  <text x="190" y="31" class="sm">0,10 kg a 20 m/s</text>
  <circle cx="40" cy="66" r="16" fill="var(--acc)" fill-opacity="0.15" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="60" y1="66" x2="84" y2="66" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mapk)"/>
  <circle cx="222" cy="66" r="7" fill="var(--A)" fill-opacity="0.15" stroke="var(--A)" stroke-width="1.5"/>
  <line x1="234" y1="66" x2="350" y2="66" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbpk)"/>
  <text x="8" y="108" class="sm bd">p = mv  (kg·m/s)</text>
  <rect x="8" y="114" width="80" height="14" rx="2" fill="var(--acc)" fill-opacity="0.5" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="94" y="126" class="sm">2,0</text>
  <rect x="190" y="114" width="80" height="14" rx="2" fill="var(--A)" fill-opacity="0.5" stroke="var(--A)" stroke-width="1.5"/>
  <text x="276" y="126" class="sm">2,0</text>
  <text x="8" y="152" class="sm bd">K = ½mv²  (J)</text>
  <rect x="8" y="158" width="16" height="14" rx="2" fill="var(--acc)" fill-opacity="0.5" stroke="var(--acc)" stroke-width="1.5"/>
