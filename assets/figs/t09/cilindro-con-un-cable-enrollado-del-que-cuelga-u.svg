<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 178" width="100%" role="img" aria-label="Cilindro con un cable enrollado del que cuelga un bloque que desciende una altura h">
  <defs><marker id="maca" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbca" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmca" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgca" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpca" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfca" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="70" cy="62" r="36" fill="var(--acc)" fill-opacity="0.1" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="70" cy="62" r="3" fill="var(--fg)"/>
  <text x="70" y="54" class="sm bd" text-anchor="middle">M, R</text>
  <text x="70" y="76" class="sm" text-anchor="middle">I</text>
  <line x1="106" y1="62" x2="106" y2="140" stroke="var(--fg)" stroke-width="1.6"/>
  <rect x="94" y="70" width="24" height="20" rx="2" fill="var(--A)" fill-opacity="0.0" stroke="var(--A)" stroke-width="1.5"/>
  <line x1="94" y1="70" x2="118" y2="70" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="94" y1="90" x2="118" y2="90" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="94" y1="70" x2="94" y2="90" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="118" y1="70" x2="118" y2="90" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="94" y="140" width="24" height="20" rx="2" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <line x1="130" y1="80" x2="130" y2="150" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbca)"/>
  <line x1="122" y1="80" x2="134" y2="80" stroke="var(--mut)" stroke-width="1.2"/>
  <line x1="122" y1="150" x2="134" y2="150" stroke="var(--mut)" stroke-width="1.2"/>
  <text x="138" y="122" class="sm bd">h</text>
  <text x="88" y="154" class="sm bd" text-anchor="end">m</text>
  <text x="172" y="40" class="sm">Parte del reposo:</text>
  <text x="172" y="70" class="sm bd">m g h = ½ m v² + ½ I ω²</text>
  <text x="172" y="90" class="sm">I = ½ M R², ω = v/R</text>
  <text x="172" y="118" class="sm bd">v = √( 2gh / (1 + M/2m) )</text>
  <text x="172" y="140" class="sm" style="fill:var(--mut)">M ≫ m: v pequeña</text>
  <text x="172" y="155" class="sm" style="fill:var(--mut)">M ≪ m: v ≈ √(2gh)</text>
</svg>
