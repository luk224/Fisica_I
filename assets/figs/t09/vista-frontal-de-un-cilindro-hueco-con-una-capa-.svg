<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 200" width="100%" role="img" aria-label="Vista frontal de un cilindro hueco con una capa delgada de radio r">
  <defs><marker id="maci" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbci" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmci" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgci" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpci" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfci" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="100" cy="98" r="78" fill="var(--acc)" fill-opacity="0.1" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="100" cy="98" r="38" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.5"/>
  <circle cx="100" cy="98" r="56" fill="none" stroke="var(--A)" stroke-width="9" stroke-opacity="0.55"/>
  <circle cx="100" cy="98" r="2.5" fill="var(--fg)"/>
  <line x1="100" y1="98" x2="67.4" y2="78.4" stroke="var(--mut)" stroke-width="1.5" fill="none" marker-end="url(#mmci)"/>
  <line x1="100" y1="98" x2="43.4" y2="151.6" stroke="var(--mut)" stroke-width="1.5" fill="none" marker-end="url(#mmci)"/>
  <line x1="100" y1="98" x2="134.8" y2="54.1" stroke="var(--A)" stroke-width="2"/>
  <text x="76.7" y="92.3" class="sm bd" text-anchor="end">R<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"></tspan></text>
  <text x="80" y="154" class="sm bd" text-anchor="end">R<tspan dy="3" font-size="9">2</tspan><tspan dy="-3"></tspan></text>
  <text x="126.3" y="73.5" class="sm bd" style="fill:var(--A)">r</text>
  <text x="204" y="40" class="sm">Capa de radio r</text>
  <text x="204" y="55" class="sm">y espesor dr</text>
  <text x="204" y="85" class="sm bd">dV = 2πr L dr</text>
  <text x="204" y="103" class="sm bd">dm = ρ 2πL r dr</text>
  <text x="204" y="130" class="sm">I = ∫ r² dm</text>
  <text x="204" y="148" class="sm">= 2πρL ∫ r³ dr</text>
  <text x="204" y="170" class="sm bd">= ½ M (R<tspan dy="3" font-size="9">1</tspan><tspan dy="-3">² + R</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3">²)</tspan></text>
  <text x="8" y="194" class="sm" style="fill:var(--mut)">L = longitud (⊥ a la hoja)</text>
</svg>
