<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 200" width="100%" role="img" aria-label="Disco compuesto por un disco macizo y un anillo concéntrico, con sus masas y momentos de inercia">
  <defs><marker id="mae7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe7" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="100" cy="96" r="70.0" fill="var(--A)" fill-opacity="0.12" stroke="var(--A)" stroke-width="1.5"/>
  <circle cx="100" cy="96" r="50" fill="var(--bg)" stroke="var(--A)" stroke-width="1.5"/>
  <circle cx="100" cy="96" r="50.0" fill="var(--acc)" fill-opacity="0.22" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="100" cy="96" r="3" fill="var(--fg)"/>
  <line x1="100" y1="96" x2="150" y2="96" stroke="var(--fg)" stroke-width="1.5"/>
  <line x1="100" y1="96.0" x2="157.8" y2="135.5" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="118" y="92" class="sm bd">0,50</text>
  <text x="150" y="132" class="sm bd">0,70</text>
  <text x="196" y="30" class="sm" style="fill:var(--acc)">Disco (3,00 g/cm²):</text>
  <text x="196" y="46" class="sm">m = 23,56 kg</text>
  <text x="196" y="62" class="sm bd">I = ½ m R² = 2,945</text>
  <text x="196" y="92" class="sm" style="fill:var(--A)">Anillo (2,00 g/cm²):</text>
  <text x="196" y="108" class="sm">m = 15,08 kg</text>
  <text x="196" y="124" class="sm">I = ½ m (R₁² + R₂²)</text>
  <text x="196" y="140" class="sm bd">= 5,579 kg·m²</text>
  <text x="196" y="172" class="sm bd">I total = 8,52 kg·m²</text>
  <text x="8" y="194" class="sm" style="fill:var(--mut)">Radios en m; eje ⊥ al papel por el centro</text>
</svg>
