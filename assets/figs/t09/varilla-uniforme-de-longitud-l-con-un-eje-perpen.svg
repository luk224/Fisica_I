<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 150" width="100%" role="img" aria-label="Varilla uniforme de longitud L con un eje perpendicular al papel por el punto O, a una distancia h de su extremo izquierdo">
  <rect x="40" y="60" width="280" height="10" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <circle cx="124" cy="65" r="7" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.5"/><circle cx="124" cy="65" r="2" fill="var(--fg)"/>
  <text x="124" y="46" class="sm bd" text-anchor="middle">O (eje ⊥ papel)</text>
  <circle cx="320" cy="65" r="3.5" fill="var(--acc)"/>
  <text x="320" y="46" class="sm" text-anchor="end">punto más lejano</text>
  <line x1="40" y1="96" x2="124" y2="96" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="40" y1="91" x2="40" y2="101" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="124" y1="91" x2="124" y2="101" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="82" y="112" class="sm bd" text-anchor="middle">h</text>
  <line x1="124" y1="96" x2="320" y2="96" stroke="var(--A)" stroke-width="1.3"/>
  <line x1="320" y1="91" x2="320" y2="101" stroke="var(--A)" stroke-width="1.3"/>
  <text x="222" y="112" class="sm bd" text-anchor="middle" style="fill:var(--A)">L − h</text>
  <text x="180" y="138" class="sm" text-anchor="middle">I = M(L²/3 − Lh + h²)</text>
</svg>
