<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 178" width="100%" role="img" aria-label="Varilla doblada en ángulo recto con un eje por el vértice y otro por el punto medio de la recta que une los extremos">
  <defs><marker id="mae8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="60" y1="150" x2="160" y2="150" stroke="var(--fg)" stroke-width="4"/>
  <line x1="60" y1="150" x2="60" y2="50" stroke="var(--fg)" stroke-width="4"/>
  <line x1="160" y1="150" x2="60" y2="50" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="60" cy="150" r="7" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.5"/><circle cx="60" cy="150" r="2" fill="var(--fg)"/>
  <circle cx="110.0" cy="100.0" r="7" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.5"/><circle cx="110.0" cy="100.0" r="2" fill="var(--fg)"/>
  <circle cx="110.0" cy="150" r="3.5" fill="var(--acc)"/>
  <circle cx="60" cy="100.0" r="3.5" fill="var(--acc)"/>
  <text x="48" y="166" class="sm bd" text-anchor="end" style="fill:var(--X)">a)</text>
  <text x="122.0" y="92.0" class="sm bd" style="fill:var(--A)">b)</text>
  <text x="110.0" y="166" class="sm" text-anchor="middle">L/2</text>
  <text x="52" y="104.0" class="sm" text-anchor="end">L/2</text>
  <line x1="110.0" y1="150" x2="110.0" y2="100.0" stroke="var(--A)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="114.0" y="136" class="sm" style="fill:var(--A)">L/4</text>
  <text x="190" y="40" class="sm">Cada segmento: masa M/2,</text>
  <text x="190" y="55" class="sm">longitud L/2</text>
  <text x="190" y="85" class="sm" style="fill:var(--X)">a) por el vértice:</text>
  <text x="190" y="101" class="sm bd">2·⅓(M/2)(L/2)² = ML²/12</text>
  <text x="190" y="128" class="sm" style="fill:var(--A)">b) por el punto medio:</text>
  <text x="190" y="144" class="sm">2·[ML²/96 + ML²/32]</text>
  <text x="190" y="160" class="sm bd">= ML²/12</text>
</svg>
