<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 200" width="100%" role="img" aria-label="Disco que gira con dos puntos en el mismo radio; el más alejado del eje tiene el doble de rapidez">
  <defs><marker id="mamo" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbmo" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmmo" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgmo" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpmo" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfmo" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="100" cy="100" r="80" fill="var(--acc)" fill-opacity="0.07" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="100" y1="100" x2="180" y2="100" stroke="var(--mut)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="100" cy="100" r="3" fill="var(--fg)"/>
  <path d="M 121.8 96.7 A 22 22 0 0 0 92.9 79.2" fill="none" stroke="var(--fg)" stroke-width="1.3"/>
  <line x1="95.0" y1="78.6" x2="90.4" y2="80.2" stroke="var(--fg)" stroke-width="1.5" fill="none" marker-end="url(#mfmo)"/>
  <circle cx="140" cy="100" r="3.5" fill="var(--fg)"/>
  <circle cx="180" cy="100" r="3.5" fill="var(--fg)"/>
  <line x1="140" y1="100" x2="140" y2="66" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mamo)"/>
  <line x1="180" y1="100" x2="180" y2="32" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mamo)"/>
  <text x="136" y="116" class="sm bd" text-anchor="end">P<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"></tspan></text>
  <text x="176" y="116" class="sm bd" text-anchor="end">P<tspan dy="3" font-size="9">2</tspan><tspan dy="-3"></tspan></text>
  <text x="133" y="82" class="sm bd" text-anchor="end">v<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"></tspan></text>
  <text x="173" y="64" class="sm bd" text-anchor="end">v<tspan dy="3" font-size="9">2</tspan><tspan dy="-3"></tspan></text>
  <text x="94" y="94" class="sm" text-anchor="end">ω</text>
  <text x="196" y="50" class="sm">Todos los puntos tienen</text>
  <text x="196" y="65" class="sm bd">la misma ω.</text>
  <text x="196" y="95" class="sm">P<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> a distancia r:</tspan></text>
  <text x="196" y="110" class="sm bd">v<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> = rω</tspan></text>
  <text x="196" y="138" class="sm">P<tspan dy="3" font-size="9">2</tspan><tspan dy="-3"> a distancia 2r:</tspan></text>
  <text x="196" y="153" class="sm bd">v<tspan dy="3" font-size="9">2</tspan><tspan dy="-3"> = 2rω</tspan></text>
  <text x="196" y="178" class="sm" style="fill:var(--mut)">v ∝ distancia al eje</text>
</svg>
