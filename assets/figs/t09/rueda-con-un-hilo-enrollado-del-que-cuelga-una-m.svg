<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 188" width="100%" role="img" aria-label="Rueda con un hilo enrollado del que cuelga una masa que desciende">
  <defs><marker id="mae10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="78" cy="62" r="38" fill="var(--acc)" fill-opacity="0.12" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="78" cy="62" r="3" fill="var(--fg)"/>
  <text x="78" y="54" class="sm bd" text-anchor="middle">M, R</text>
  <text x="78" y="76" class="sm" text-anchor="middle">I</text>
  <line x1="116" y1="62" x2="116" y2="134" stroke="var(--fg)" stroke-width="1.6"/>
  <rect x="103" y="134" width="26" height="22" rx="2" fill="var(--A)" fill-opacity="0.35" stroke="var(--A)" stroke-width="1.5"/>
  <text x="98" y="150" class="sm bd" text-anchor="end">m</text>
  <line x1="144" y1="80" x2="144" y2="128" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbe10)"/>
  <text x="152" y="106" class="sm bd">v</text>
  <text x="172" y="34" class="sm">9.45: m = 4,20 kg; R = 0,28 m</text>
  <text x="172" y="50" class="sm">baja 3,00 m en 2,00 s</text>
  <text x="172" y="76" class="sm bd">v = 2Δy/t = 3,00 m/s</text>
  <text x="172" y="94" class="sm">ω = v/R = 10,71 rad/s</text>
  <text x="172" y="114" class="sm">mgΔy = ½mv² + ½Iω²</text>
  <text x="172" y="132" class="sm">I = 1,822 kg·m²</text>
  <text x="172" y="150" class="sm bd">M = 2I/R² = 46,5 kg</text>
  <text x="8" y="176" class="sm bd">9.44: ½Iω² = ½·(½mv²)  ⇒  I = ½ m R²</text>
</svg>
