<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 200" width="100%" role="img" aria-label="Centrifugador de 0,107 metros de radio comparado con el espacio de 0,127 metros del anuncio">
  <defs><marker id="mae4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="100" cy="98" r="40.66" fill="var(--acc)" fill-opacity="0.12" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="100" cy="98" r="24.1" fill="none" stroke="var(--A)" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="100" cy="98" r="3" fill="var(--fg)"/>
  <line x1="140.7" y1="98.0" x2="108" y2="98" stroke="var(--A)" stroke-width="2.5" fill="none" marker-end="url(#mbe4)"/>
  <line x1="100" y1="98" x2="100" y2="138.7" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="106" y="150" class="sm">r = 0,107 m</text>
  <text x="104" y="48" class="sm" style="fill:var(--A)">a<tspan dy="3" font-size="9">rad</tspan><tspan dy="-3"> = ω² r</tspan></text>
  <text x="196" y="50" class="sm bd">Hace falta ⌀ 0,214 m</text>
  <text x="196" y="68" class="sm bd">(círculo continuo).</text>
  <text x="196" y="96" class="sm">El anuncio dice</text>
  <text x="196" y="112" class="sm" style="fill:var(--A)">⌀ 0,127 m (discontinuo):</text>
  <text x="196" y="132" class="sm bd">no es verosímil</text>
  <text x="8" y="192" class="sm" style="fill:var(--mut)">5000 rpm = 523,6 rad/s;  3000 g = 29 400 m/s²</text>
</svg>
