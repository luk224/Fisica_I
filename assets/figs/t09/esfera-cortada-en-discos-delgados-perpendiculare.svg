  <text x="204" y="40" class="sm">Disco de espesor dx</text>
  <text x="204" y="55" class="sm">a distancia x</text>
  <text x="204" y="85" class="sm bd">r² = R² − x²</text>
  <text x="204" y="103" class="sm bd">dm = ρ π (R² − x²) dx</text>
  <text x="204" y="130" class="sm">dI = ½ r² dm</text>
  <text x="204" y="148" class="sm">½ρπ ∫ (R²−x²)² dx</text>
  <text x="204" y="170" class="sm bd">= (2/5) M R²</text>
