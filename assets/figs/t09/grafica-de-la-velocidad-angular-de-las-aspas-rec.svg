<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 320 200" width="100%" role="img" aria-label="Gráfica de la velocidad angular de las aspas, recta de 0 a 36 radianes por segundo en 24 segundos, con el área triangular de 432 radianes">
  <defs><marker id="mae1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe1" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line class="ax" x1="48" y1="164" x2="310" y2="164"/>
  <line class="ax" x1="48" y1="164" x2="48" y2="13"/>
  <text x="305" y="192" class="sm" text-anchor="end">t (s)</text>
  <text x="54" y="20" class="sm">ω<tspan dy="3" font-size="9">z</tspan><tspan dy="-3"> (rad/s)</tspan></text>
  <line x1="48.0" y1="164" x2="48.0" y2="168" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="48.0" y="180" class="sm" text-anchor="middle">0</text>
  <line x1="166.6" y1="164" x2="166.6" y2="168" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="166.6" y="180" class="sm" text-anchor="middle">12</text>
  <line x1="285.2" y1="164" x2="285.2" y2="168" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="285.2" y="180" class="sm" text-anchor="middle">24</text>
  <line x1="44" y1="32.6" x2="48" y2="32.6" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="41" y="36.6" class="sm" text-anchor="end">36</text>
  <path d="M 48.0 164.0 L 285.2 32.6 L 285.2 164.0 Z" fill="var(--X)" fill-opacity="0.2" stroke="none"/>
  <path d="M 48.0 164.0 L 285.2 32.6" fill="none" stroke="var(--acc)" stroke-width="3"/>
  <line x1="285.2" y1="32.6" x2="285.2" y2="164.0" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="48.0" y1="32.6" x2="285.2" y2="32.6" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
