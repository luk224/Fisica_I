  <text x="57.9" y="46.6" class="sm">36,0 rad/s</text>
  <text x="186.4" y="127.5" class="sm bd" text-anchor="middle">área = θ − θ₀</text>
  <text x="186.4" y="142.5" class="sm" text-anchor="middle">= ½ · 24 · 36 = 432 rad</text>
  <text x="57.9" y="76.4" class="sm" style="fill:var(--acc)">α = 1,50 rad/s²</text>
