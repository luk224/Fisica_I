<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 282" width="100%" role="img" aria-label="Trabajo de cada fuerza sobre un remolque arrastrado por un tractor y trabajo total">
  <line x1="30" y1="100" x2="330" y2="100" stroke="var(--fg)" stroke-width="2"/>
  <rect x="140" y="62" width="70" height="38" rx="2" fill="var(--mut)" fill-opacity="0.35" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="210" y1="72" x2="258" y2="36" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mk-g)"/>
  <text x="262" y="40" class="sm bd" text-anchor="start" style="fill:var(--X)">F<tspan dy="3" font-size="9">T</tspan><tspan dy="-3"> = 5000 N</tspan></text>
  <path d="M 234.0 72.0 A 24 24 0 0 0 229.2 57.6" fill="none" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="238" y="70" class="sm" text-anchor="start">36,9°</text>
  <line x1="140" y1="88" x2="98" y2="88" stroke="var(--E)" stroke-width="3" fill="none" marker-end="url(#mk-p)"/>
  <text x="60" y="80" class="sm bd" text-anchor="start" style="fill:var(--E)">f = 3500 N</text>
  <line x1="175" y1="81" x2="175" y2="49" stroke="var(--acc)" stroke-width="3" fill="none" marker-end="url(#mk-a)"/>
  <text x="180" y="47" class="sm bd" style="fill:var(--acc)">n</text>
  <line x1="175" y1="81" x2="175" y2="101" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mk-b)"/>
  <text x="180" y="111" class="sm bd" style="fill:var(--A)">w</text>
  <line x1="140" y1="118" x2="250" y2="118" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#mk-f)"/>
  <text x="195" y="133" class="sm bd" text-anchor="middle">s = 20 m</text>
  <line x1="190.0" y1="160" x2="190.0" y2="272" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="8" y="157" class="sm" style="fill:var(--fg)">W<tspan dy="3" font-size="9">w</tspan><tspan dy="-3"> = W</tspan><tspan dy="3" font-size="9">n</tspan><tspan dy="-3"> (⟂ s)</tspan></text>
  <text x="195.0" y="173" class="sm bd" text-anchor="start" style="fill:var(--fg)">0</text>
  <text x="8" y="189" class="sm" style="fill:var(--fg)">W<tspan dy="3" font-size="9">T</tspan><tspan dy="-3"> = F</tspan><tspan dy="3" font-size="9">T</tspan><tspan dy="-3"> s cos 36,9°</tspan></text>
  <rect x="190.0" y="195" width="80.0" height="10" rx="1.5" fill="var(--X)" fill-opacity="0.55" stroke="var(--X)" stroke-width="1.3"/>
  <text x="275.0" y="205" class="sm bd" text-anchor="start" style="fill:var(--fg)">+80 kJ</text>
  <text x="8" y="221" class="sm" style="fill:var(--fg)">W<tspan dy="3" font-size="9">f</tspan><tspan dy="-3"> = f s cos 180°</tspan></text>
  <rect x="120.0" y="227" width="70.0" height="10" rx="1.5" fill="var(--A)" fill-opacity="0.55" stroke="var(--A)" stroke-width="1.3"/>
  <text x="115.0" y="237" class="sm bd" text-anchor="end" style="fill:var(--fg)">−70 kJ</text>
  <text x="8" y="253" class="sm" style="fill:var(--fg)">W<tspan dy="3" font-size="9">tot</tspan><tspan dy="-3"> = suma algebraica</tspan></text>
  <rect x="190.0" y="259" width="10.0" height="10" rx="1.5" fill="var(--acc)" fill-opacity="0.55" stroke="var(--acc)" stroke-width="1.3"/>
  <text x="205.0" y="269" class="sm bd" text-anchor="start" style="fill:var(--fg)">+10 kJ</text>
</svg>
