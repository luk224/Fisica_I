  <text x="100" y="112" class="sm bd" text-anchor="start" style="fill:var(--X)">F = 25,1 N</text>
  <line x1="192" y1="150" x2="192" y2="160" stroke="var(--A)" stroke-width="2" fill="none" marker-end="url(#mk-b)"/>
  <text x="198" y="178" class="sm" text-anchor="start" style="fill:var(--A)">mg = 0,098 N</text>
  <line x1="176.0" y1="218" x2="176.0" y2="330" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="8" y="215" class="sm" style="fill:var(--fg)">K₁ = ½·0,010·100²</text>
  <rect x="176.0" y="221" width="95.0" height="10" rx="1.5" fill="var(--acc)" fill-opacity="0.55" stroke="var(--acc)" stroke-width="1.3"/>
  <text x="276.0" y="231" class="sm bd" text-anchor="start" style="fill:var(--fg)">50,0 J</text>
  <text x="8" y="247" class="sm" style="fill:var(--fg)">W<tspan dy="3" font-size="9">peso</tspan><tspan dy="-3"> = +mgd</tspan></text>
  <rect x="176.0" y="253" width="0.4" height="10" rx="1.5" fill="var(--X)" fill-opacity="0.55" stroke="var(--X)" stroke-width="1.3"/>
  <text x="181.4" y="263" class="sm bd" text-anchor="start" style="fill:var(--fg)">+0,2 J</text>
  <text x="8" y="279" class="sm" style="fill:var(--fg)">W<tspan dy="3" font-size="9">F</tspan><tspan dy="-3"> = −Fd</tspan></text>
  <rect x="80.6" y="285" width="95.4" height="10" rx="1.5" fill="var(--A)" fill-opacity="0.55" stroke="var(--A)" stroke-width="1.3"/>
  <text x="75.6" y="295" class="sm bd" text-anchor="end" style="fill:var(--fg)">−50,2 J</text>
  <text x="8" y="311" class="sm" style="fill:var(--fg)">K₂</text>
  <text x="181.0" y="327" class="sm bd" text-anchor="start" style="fill:var(--fg)">0</text>
