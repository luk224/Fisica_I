<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 336" width="100%" role="img" aria-label="Bala que penetra 2 m en un material: balance de trabajos">
  <rect x="80" y="70" width="200" height="120" rx="2" fill="var(--mut)" fill-opacity="0.15" stroke="none"/>
  <line x1="80" y1="70" x2="280" y2="70" stroke="var(--fg)" stroke-width="2"/>
  <rect x="176" y="24" width="8" height="16" rx="2" fill="var(--acc)" fill-opacity="0.5" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="180" y1="44" x2="180" y2="68" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#mk-f)"/>
  <text x="190" y="50" class="sm bd">v₁ = 100 m/s</text>
  <rect x="176" y="150" width="8" height="16" rx="2" fill="var(--acc)" fill-opacity="0.5" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="180" y1="70" x2="180" y2="150" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="224" y1="71" x2="224" y2="168" stroke="var(--fg)" stroke-width="2" fill="none" marker-end="url(#mk-f)"/>
  <text x="231" y="126" class="sm bd">d = 2 m</text>
