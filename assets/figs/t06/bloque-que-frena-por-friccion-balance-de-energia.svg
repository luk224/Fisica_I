<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 304" width="100%" role="img" aria-label="Bloque que frena por fricción: balance de energía">
  <line x1="20" y1="76" x2="340" y2="76" stroke="var(--fg)" stroke-width="2"/>
  <rect x="100" y="40" width="50" height="36" rx="2" fill="var(--mut)" fill-opacity="0.35" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="125" y="63" class="sm bd" text-anchor="middle">2 kg</text>
  <line x1="150" y1="52" x2="205" y2="52" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#mk-f)"/>
  <text x="178" y="34" class="sm bd" text-anchor="middle">v₁ = 3 m/s</text>
  <line x1="100" y1="66" x2="66" y2="66" stroke="var(--E)" stroke-width="3" fill="none" marker-end="url(#mk-p)"/>
  <text x="80" y="92" class="sm bd" text-anchor="middle" style="fill:var(--E)">f = 4 N</text>
  <rect x="250" y="40" width="50" height="36" rx="2" fill="var(--mut)" fill-opacity="0.08" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="275" y="63" class="sm" text-anchor="middle">2,24 m/s</text>
  <line x1="125" y1="100" x2="275" y2="100" stroke="var(--fg)" stroke-width="2" fill="none" marker-end="url(#mk-f)"/>
  <text x="200" y="116" class="sm bd" text-anchor="middle">s = 1 m</text>
  <line x1="175.0" y1="144" x2="175.0" y2="298" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="8" y="141" class="sm" style="fill:var(--fg)">K₁ = ½·2·3²</text>
  <rect x="175.0" y="147" width="71.2" height="10" rx="1.5" fill="var(--acc)" fill-opacity="0.55" stroke="var(--acc)" stroke-width="1.3"/>
  <text x="251.2" y="157" class="sm bd" text-anchor="start" style="fill:var(--fg)">9 J</text>
  <text x="8" y="173" class="sm" style="fill:var(--fg)">W<tspan dy="3" font-size="9">f</tspan><tspan dy="-3"> = −4 N · 1 m</tspan></text>
  <rect x="143.3" y="179" width="31.7" height="10" rx="1.5" fill="var(--A)" fill-opacity="0.55" stroke="var(--A)" stroke-width="1.3"/>
  <text x="138.3" y="189" class="sm bd" text-anchor="end" style="fill:var(--fg)">−4 J</text>
  <text x="8" y="205" class="sm" style="fill:var(--fg)">K₂ = K₁ + W<tspan dy="3" font-size="9">f</tspan><tspan dy="-3"></tspan></text>
  <rect x="175.0" y="211" width="39.6" height="10" rx="1.5" fill="var(--acc)" fill-opacity="0.55" stroke="var(--acc)" stroke-width="1.3"/>
  <text x="219.6" y="221" class="sm bd" text-anchor="start" style="fill:var(--fg)">5 J</text>
  <line x1="8" y1="232" x2="352" y2="232" stroke="var(--mut)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="8" y="247" class="sm" style="fill:var(--fg)">Si sigue hasta pararse (s = 2,25 m): W<tspan dy="3" font-size="9">f</tspan><tspan dy="-3"> = −K₁</tspan></text>
  <rect x="103.8" y="253" width="71.2" height="10" rx="1.5" fill="var(--A)" fill-opacity="0.55" stroke="var(--A)" stroke-width="1.3"/>
  <text x="98.8" y="263" class="sm bd" text-anchor="end" style="fill:var(--fg)">−9 J</text>
  <text x="8" y="279" class="sm" style="fill:var(--fg)">K₂</text>
  <text x="180.0" y="295" class="sm bd" text-anchor="start" style="fill:var(--fg)">0</text>
</svg>
