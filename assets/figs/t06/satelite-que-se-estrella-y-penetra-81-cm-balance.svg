<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 336" width="100%" role="img" aria-label="Satélite que se estrella y penetra 81 cm: balance de trabajos">
  <rect x="60" y="80" width="240" height="110" rx="2" fill="var(--mut)" fill-opacity="0.15" stroke="none"/>
  <line x1="60" y1="80" x2="300" y2="80" stroke="var(--fg)" stroke-width="2"/>
  <rect x="172" y="24" width="16" height="16" rx="2" fill="var(--acc)" fill-opacity="0.5" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="180" y1="44" x2="180" y2="78" stroke="var(--fg)" stroke-width="3" fill="none" marker-end="url(#mk-f)"/>
  <text x="190" y="55" class="sm bd">v₁ = 86,4 m/s</text>
  <rect x="172" y="150" width="16" height="16" rx="2" fill="var(--acc)" fill-opacity="0.5" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="180" y1="80" x2="180" y2="150" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="232" y1="81" x2="232" y2="167" stroke="var(--fg)" stroke-width="2" fill="none" marker-end="url(#mk-f)"/>
  <text x="239" y="128" class="sm bd">d = 0,81 m</text>
