  <text x="166" y="100" class="sm bd" text-anchor="end" style="fill:var(--X)">F = 9,69·10⁵ N</text>
  <line x1="190" y1="150" x2="190" y2="162" stroke="var(--A)" stroke-width="2" fill="none" marker-end="url(#mk-b)"/>
  <text x="198" y="180" class="sm" text-anchor="start" style="fill:var(--A)">mg = 2,06·10³ N</text>
  <line x1="176.0" y1="218" x2="176.0" y2="330" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="8" y="215" class="sm" style="fill:var(--fg)">K₁ = ½·210·(86,4)²</text>
