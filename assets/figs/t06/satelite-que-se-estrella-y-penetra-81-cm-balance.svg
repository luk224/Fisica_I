  <text x="280.3" y="231" class="sm bd" text-anchor="start" style="fill:var(--fg)">783,6 kJ</text>
  <text x="8" y="247" class="sm" style="fill:var(--fg)">W<tspan dy="3" font-size="9">peso</tspan><tspan dy="-3"> = +mgd</tspan></text>
  <rect x="176.0" y="253" width="0.2" height="10" rx="1.5" fill="var(--X)" fill-opacity="0.55" stroke="var(--X)" stroke-width="1.3"/>
  <text x="181.2" y="263" class="sm bd" text-anchor="start" style="fill:var(--fg)">+1,7 kJ</text>
  <text x="8" y="279" class="sm" style="fill:var(--fg)">W<tspan dy="3" font-size="9">F</tspan><tspan dy="-3"> = −Fd</tspan></text>
  <rect x="76.5" y="285" width="99.5" height="10" rx="1.5" fill="var(--A)" fill-opacity="0.55" stroke="var(--A)" stroke-width="1.3"/>
  <text x="71.5" y="295" class="sm bd" text-anchor="end" style="fill:var(--fg)">−785,3 kJ</text>
  <text x="8" y="311" class="sm" style="fill:var(--fg)">K₂</text>
  <text x="181.0" y="327" class="sm bd" text-anchor="start" style="fill:var(--fg)">0</text>
