<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 182" width="100%" role="img" aria-label="Fuerzas perpendiculares al desplazamiento: normal y peso sobre un bloque que desliza, fuerza centrípeta en un movimiento circular">
