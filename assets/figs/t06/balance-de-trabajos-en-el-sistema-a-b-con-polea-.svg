<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 230" width="100%" role="img" aria-label="Balance de trabajos en el sistema A + B con polea móvil">
  <text x="8" y="14" class="sm" text-anchor="start" style="fill:var(--fg)">A baja 1,00 m por el plano; B sube 0,50 m</text>
  <line x1="160.0" y1="38" x2="160.0" y2="224" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="8" y="35" class="sm" style="fill:var(--fg)">W del peso de A</text>
  <rect x="160.0" y="41" width="82.7" height="10" rx="1.5" fill="var(--X)" fill-opacity="0.55" stroke="var(--X)" stroke-width="1.3"/>
  <text x="247.7" y="51" class="sm bd" text-anchor="start" style="fill:var(--fg)">+7,35 J</text>
  <text x="8" y="67" class="sm" style="fill:var(--fg)">W de la fricción</text>
  <rect x="145.7" y="73" width="14.3" height="10" rx="1.5" fill="var(--E)" fill-opacity="0.55" stroke="var(--E)" stroke-width="1.3"/>
  <text x="140.7" y="83" class="sm bd" text-anchor="end" style="fill:var(--fg)">−1,27 J</text>
  <text x="8" y="99" class="sm" style="fill:var(--fg)">W de T sobre A</text>
  <rect x="103.0" y="105" width="57.0" height="10" rx="1.5" fill="var(--A)" fill-opacity="0.55" stroke="var(--A)" stroke-width="1.3"/>
  <text x="98.0" y="115" class="sm bd" text-anchor="end" style="fill:var(--fg)">−5,07 J</text>
  <text x="8" y="131" class="sm" style="fill:var(--fg)">W de 2T sobre B</text>
  <rect x="160.0" y="137" width="57.0" height="10" rx="1.5" fill="var(--X)" fill-opacity="0.55" stroke="var(--X)" stroke-width="1.3"/>
  <text x="222.0" y="147" class="sm bd" text-anchor="start" style="fill:var(--fg)">+5,07 J (se cancela)</text>
  <text x="8" y="163" class="sm" style="fill:var(--fg)">W del peso de B</text>
  <rect x="104.9" y="169" width="55.1" height="10" rx="1.5" fill="var(--A)" fill-opacity="0.55" stroke="var(--A)" stroke-width="1.3"/>
  <text x="99.9" y="179" class="sm bd" text-anchor="end" style="fill:var(--fg)">−4,90 J</text>
  <line x1="8" y1="190" x2="352" y2="190" stroke="var(--mut)" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="8" y="205" class="sm" style="fill:var(--fg)">W<tspan dy="3" font-size="9">tot</tspan><tspan dy="-3"> = K</tspan><tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> + K</tspan><tspan dy="3" font-size="9">B</tspan><tspan dy="-3"></tspan></text>
  <rect x="160.0" y="211" width="13.2" height="10" rx="1.5" fill="var(--acc)" fill-opacity="0.55" stroke="var(--acc)" stroke-width="1.3"/>
  <text x="178.2" y="221" class="sm bd" text-anchor="start" style="fill:var(--fg)">+1,18 J</text>
