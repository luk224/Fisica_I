<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 150" width="100%" role="img" aria-label="Cable que tira de un coche con un ángulo de 35°">
  <line x1="30" y1="100" x2="330" y2="100" stroke="var(--fg)" stroke-width="2"/>
  <rect x="100" y="62" width="70" height="38" rx="2" fill="var(--mut)" fill-opacity="0.35" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="135" y="85" class="sm" text-anchor="middle">coche</text>
  <line x1="170" y1="72" x2="245.4" y2="19.2" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mk-g)"/>
  <line x1="170" y1="72" x2="245.4" y2="72" stroke="var(--X)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="245.4" y1="72" x2="245.4" y2="19.2" stroke="var(--E)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 204.0 72.0 A 34 34 0 0 0 197.9 52.5" fill="none" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="208" y="66" class="sm">35°</text>
  <text x="206" y="88" class="sm" text-anchor="start" style="fill:var(--X)">T cos 35° = 1106 N (trabaja)</text>
  <text x="251.4" y="50" class="sm" text-anchor="start" style="fill:var(--E)">T sen 35°</text>
  <text x="251.4" y="64" class="sm" text-anchor="start" style="fill:var(--E)">= 774 N (no trabaja)</text>
  <text x="239.4" y="13.2" class="sm bd" text-anchor="end" style="fill:var(--X)">T = 1350 N</text>
  <line x1="100" y1="122" x2="270" y2="122" stroke="var(--fg)" stroke-width="2" fill="none" marker-end="url(#mk-f)"/>
  <text x="185" y="138" class="sm bd" text-anchor="middle">s = 5,00 km</text>
</svg>
