  <text x="8" y="91" class="sm" style="fill:var(--fg)">Con fricción: W<tspan dy="3" font-size="9">res</tspan><tspan dy="-3"> = −½kd²</tspan></text>
  <rect x="126.4" y="97" width="56.1" height="10" rx="1.5" fill="var(--A)" fill-opacity="0.55" stroke="var(--A)" stroke-width="1.3"/>
