<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 150" width="100%" role="img" aria-label="Deslizador con resorte: reparto de la energía inicial con y sin fricción">
  <line x1="182.5" y1="20" x2="182.5" y2="142" stroke="var(--fg)" stroke-width="1.5"/>
