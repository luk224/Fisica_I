  <text x="8" y="49" class="sm" style="fill:var(--fg)">Sin fricción: W<tspan dy="3" font-size="9">res</tspan><tspan dy="-3"> = −½kd²</tspan></text>
  <rect x="96.1" y="55" width="86.4" height="10" rx="1.5" fill="var(--A)" fill-opacity="0.55" stroke="var(--A)" stroke-width="1.3"/>
