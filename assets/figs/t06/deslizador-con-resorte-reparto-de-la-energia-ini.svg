  <text x="8" y="123" class="sm" style="fill:var(--fg)">Con fricción: W<tspan dy="3" font-size="9">f</tspan><tspan dy="-3"> = −μ</tspan><tspan dy="3" font-size="9">k</tspan><tspan dy="-3">mgd</tspan></text>
  <rect x="152.3" y="129" width="30.2" height="10" rx="1.5" fill="var(--E)" fill-opacity="0.55" stroke="var(--E)" stroke-width="1.3"/>
