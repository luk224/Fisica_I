<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 214" width="100%" role="img" aria-label="Ascensor que sube con rapidez constante: la potencia es F·v">
  <line x1="130" y1="8" x2="130" y2="200" stroke="var(--fg)" stroke-width="2"/>
  <line x1="230" y1="8" x2="230" y2="200" stroke="var(--fg)" stroke-width="2"/>
  <line x1="110" y1="200" x2="250" y2="200" stroke="var(--fg)" stroke-width="2"/>
  <rect x="140" y="150" width="80" height="46" rx="2" fill="var(--mut)" fill-opacity="0.08" stroke="var(--mut)" stroke-width="1.5"/>
  <rect x="140" y="24" width="80" height="46" rx="2" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="8" y="58" class="sm bd" text-anchor="start">M = 2436 kg</text>
  <line x1="180" y1="47" x2="180" y2="17" stroke="var(--X)" stroke-width="3" fill="none" marker-end="url(#mk-g)"/>
  <text x="185" y="13" class="sm bd" style="fill:var(--X)">F</text>
  <line x1="180" y1="47" x2="180" y2="77" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mk-b)"/>
  <text x="185" y="89" class="sm bd" style="fill:var(--A)">Mg</text>
  <line x1="248" y1="170" x2="248" y2="48" stroke="var(--fg)" stroke-width="2" fill="none" marker-end="url(#mk-f)"/>
  <text x="256" y="112" class="sm bd" text-anchor="start">h = 20,0 m</text>
  <text x="256" y="128" class="sm" text-anchor="start">en 16,0 s</text>
  <text x="8" y="24" class="sm bd" text-anchor="start">v = 1,25 m/s</text>
  <text x="8" y="40" class="sm" text-anchor="start">(constante)</text>
  <text x="8" y="74" class="sm bd" text-anchor="start" style="fill:var(--X)">F = Mg = 2,39·10⁴ N</text>
  <text x="8" y="160" class="sm bd" text-anchor="start" style="fill:var(--fg)">P = Fv = Mgv</text>
  <text x="8" y="176" class="sm bd" text-anchor="start" style="fill:var(--fg)">= 2,98·10⁴ W</text>
  <text x="8" y="192" class="sm bd" text-anchor="start" style="fill:var(--fg)">= 40 hp</text>
</svg>
