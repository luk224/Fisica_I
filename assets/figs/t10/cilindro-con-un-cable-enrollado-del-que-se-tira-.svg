<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 190" width="100%" role="img" aria-label="Cilindro con un cable enrollado del que se tira con una fuerza tangencial F">
  <defs><marker id="macb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbcb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmcb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgcb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpcb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfcb" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="100" cy="100" r="64" fill="var(--acc)" fill-opacity="0.12" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="3.5" fill="var(--fg)"/>
  <line x1="164" y1="100" x2="164" y2="166" stroke="var(--A)" stroke-width="3.4" fill="none" marker-end="url(#mbcb)"/>
  <path d="M 74.0 85.0 A 30 30 0 0 1 126.0 85.0" fill="none" stroke="var(--acc)" stroke-width="2" marker-end="url(#macb)"/>
  <text x="172" y="162" class="sm bd" style="fill:var(--A)">F</text>
  <text x="100" y="62" class="sm bd" text-anchor="middle" style="fill:var(--acc)">α</text>
  <line x1="100" y1="100" x2="164" y2="100" stroke="var(--mut)" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="132.0" y="116" class="sm" text-anchor="middle">R</text>
  <text x="206" y="40" class="sm bd">F = 9,0 N, M = 50 kg</text>
  <text x="206" y="58" class="sm">R = 0,060 m</text>
  <text x="206" y="80" class="sm">τ = F R = 0,54 N·m</text>
  <text x="206" y="98" class="sm">I = ½MR² = 0,090 kg·m²</text>
  <text x="206" y="122" class="sm bd" style="fill:var(--acc)">α = τ/I = 6,0 rad/s²</text>
  <text x="206" y="142" class="sm bd" style="fill:var(--A)">a = Rα = 0,36 m/s²</text>
</svg>
