  <text x="60" y="94.2" class="sm bd" text-anchor="end">a</text>
  <line x1="135" y1="134.0" x2="147" y2="134.0" stroke="var(--fg)" stroke-width="1.3"/>
  <text x="150" y="138.0" class="sm" style="fill:var(--mut)">2L/3</text>
  <text x="140" y="184" class="sm bd">L</text>
  <text x="140" y="24" class="sm bd">A (pivote)</text>
  <text x="16" y="136.5" class="sm bd" style="fill:var(--X)">m, v</text>
  <text x="190" y="52" class="sm bd">L<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = m v a</tspan></text>
  <text x="190" y="74" class="sm">ω = 3mva/(ML² + 3ma²)</text>
  <text x="190" y="104" class="sm">p<tspan dy="3" font-size="9">antes</tspan><tspan dy="-3"> = m v</tspan></text>
  <text x="190" y="122" class="sm">p<tspan dy="3" font-size="9">después</tspan><tspan dy="-3"> = (½ML + ma) ω</tspan></text>
  <text x="190" y="140" class="sm">coinciden solo si a = ⅔ L</text>
  <text x="190" y="168" class="sm bd">Q = M L² m v² /</text>
  <text x="202" y="186" class="sm bd">[2(M L² + 3 m a²)]</text>
