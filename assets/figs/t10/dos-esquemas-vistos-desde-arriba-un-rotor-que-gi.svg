<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 350 200" width="100%" role="img" aria-label="Dos esquemas vistos desde arriba: un rotor que gira en un sentido y dos rotores que giran en sentidos opuestos">
  <defs><marker id="max8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbx8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmx8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgx8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpx8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfx8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="90" y="18" class="sm bd" text-anchor="middle">Un rotor principal</text>
  <ellipse cx="90" cy="86" rx="40" ry="40" fill="var(--mut)" fill-opacity="0.08" stroke="var(--mut)" stroke-width="1.3"/>
  <path d="M 64.0 71.0 A 30 30 0 0 1 116.0 71.0" fill="none" stroke="var(--acc)" stroke-width="2.4" marker-end="url(#max8)"/>
  <circle cx="90" cy="86" r="3" fill="var(--fg)"/>
  <text x="90" y="156" class="sm" text-anchor="middle">L del rotor (↓)</text>
  <text x="90" y="173" class="sm bd" text-anchor="middle">fuselaje gira al revés</text>
  <text x="90" y="190" class="sm" text-anchor="middle">lo evita la cola</text>
  <text x="262" y="18" class="sm bd" text-anchor="middle">Dos rotores opuestos</text>
  <ellipse cx="220" cy="86" rx="40" ry="40" fill="var(--mut)" fill-opacity="0.08" stroke="var(--mut)" stroke-width="1.3"/>
  <path d="M 194.0 71.0 A 30 30 0 0 1 246.0 71.0" fill="none" stroke="var(--acc)" stroke-width="2.4" marker-end="url(#max8)"/>
  <circle cx="220" cy="86" r="3" fill="var(--fg)"/>
  <ellipse cx="304" cy="86" rx="40" ry="40" fill="var(--mut)" fill-opacity="0.08" stroke="var(--mut)" stroke-width="1.3"/>
  <path d="M 330.0 71.0 A 30 30 0 0 0 278.0 71.0" fill="none" stroke="var(--A)" stroke-width="2.4" marker-end="url(#mbx8)"/>
  <circle cx="304" cy="86" r="3" fill="var(--fg)"/>
  <text x="262" y="156" class="sm bd" text-anchor="middle">L<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> + L</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3"> = 0</tspan></text>
  <text x="262" y="173" class="sm" text-anchor="middle">reacciones se anulan</text>
  <text x="262" y="190" class="sm" text-anchor="middle">no hace falta cola</text>
</svg>
