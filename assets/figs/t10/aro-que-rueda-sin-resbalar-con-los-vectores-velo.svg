  <text x="124" y="128" class="sm bd" text-anchor="start" style="fill:var(--X)">1,56 m/s</text>
  <text x="192.6" y="52" class="sm bd" text-anchor="start" style="fill:var(--X)">3,12 m/s</text>
  <text x="218.3" y="156.3" class="sm bd" text-anchor="start" style="fill:var(--A)">2,21 m/s</text>
  <text x="126" y="184" class="sm bd" text-anchor="start">contacto: v = 0</text>
  <text x="12" y="20" class="sm">aro: M = 2,20 kg, R = 0,60 m</text>
  <text x="12" y="38" class="sm">ω = 2,60 rad/s (horaria)</text>
  <text x="264" y="70" class="sm bd">v<tspan dy="3" font-size="9">cm</tspan><tspan dy="-3"> = Rω</tspan></text>
  <text x="264" y="88" class="sm bd">= 1,56 m/s</text>
  <text x="264" y="114" class="sm">K = M v<tspan dy="3" font-size="9">cm</tspan><tspan dy="-3">²</tspan></text>
  <text x="264" y="132" class="sm">= 5,35 J</text>
