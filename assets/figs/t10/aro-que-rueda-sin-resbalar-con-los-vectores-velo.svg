<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 196" width="100%" role="img" aria-label="Aro que rueda sin resbalar con los vectores velocidad del punto más alto, el centro, el punto de la derecha y el punto de contacto">
  <defs><marker id="mae2" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe2" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme2" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge2" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe2" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe2" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="24" y1="168" x2="340" y2="168" stroke="var(--fg)" stroke-width="1.6"/>
  <circle cx="118" cy="108" r="60" fill="var(--acc)" fill-opacity="0.08" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="118" cy="108" r="3.5" fill="var(--fg)"/>
  <line x1="118" y1="108" x2="152.3" y2="108" stroke="var(--X)" stroke-width="3.0" fill="none" marker-end="url(#mge2)"/>
  <circle cx="118" cy="48" r="4" fill="var(--fg)"/>
  <line x1="118" y1="48" x2="186.6" y2="48" stroke="var(--X)" stroke-width="3.0" fill="none" marker-end="url(#mge2)"/>
  <circle cx="118" cy="168" r="4" fill="var(--fg)"/>
  <circle cx="178" cy="108" r="4" fill="var(--fg)"/>
