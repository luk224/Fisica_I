<svg class="fig" viewBox="0 0 360 556" width="100%" role="img" aria-label="Planteamiento: yoyó de dos discos con la cuerda fija, con su diagrama de cuerpo libre">
  <defs><marker id="mayoy" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbyoy" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmyoy" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgyoy" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpyoy" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfyoy" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="120" y="60" width="60" height="8" rx="2" fill="var(--mut)" fill-opacity="0.4" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="150" y1="68" x2="150" y2="154" stroke="var(--X)" stroke-width="1.6"/>
  <text x="158" y="110" class="sm">cuerda (extremo fijo)</text>
  <rect x="136" y="154" width="28" height="4" rx="2" fill="var(--mut)" fill-opacity="0.1" stroke="none"/>
  <circle cx="150" cy="194" r="36.0" fill="var(--mut)" fill-opacity="0.12" stroke="var(--mut)" stroke-width="1.5"/>
  <circle cx="150" cy="194" r="22.5" fill="var(--mut)" fill-opacity="0.3" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="150" y1="194" x2="186" y2="194" stroke="var(--mut)" stroke-width="1"/>
  <text x="168" y="190" class="sm bd" text-anchor="middle">R</text>
  <line x1="150" y1="194" x2="150" y2="216" stroke="var(--mut)" stroke-width="1"/>
  <text x="154" y="216" class="sm bd">r</text>
  <line x1="150" y1="240" x2="150" y2="284" stroke="var(--A)" stroke-width="2.2" fill="none" marker-end="url(#mbyoy)"/>
  <text x="158" y="280" class="sm bd">a<tspan dy="3" font-size="9">cm</tspan><tspan dy="-3"></tspan></text>
  <text x="20" y="14" class="sm bd">m = 100 g ; R = 40 mm (discos)</text>
  <text x="20" y="30" class="sm bd">r = 25 mm (eje) ; cuerda de 1 m</text>
  <text x="20" y="46" class="sm">Parte del reposo; extremo de la cuerda fijo</text>
  <text x="210" y="190" class="sm">Piden:</text>
  <text x="210" y="206" class="sm">α , a<tspan dy="3" font-size="9">cm</tspan><tspan dy="-3"> ,</tspan></text>
  <text x="210" y="222" class="sm">v<tspan dy="3" font-size="9">cm</tspan><tspan dy="-3"> (cuerda</tspan></text>
  <text x="210" y="238" class="sm">desenrollada)</text>
  <text x="95" y="276" class="sm bd" text-anchor="middle">DCL del yoyó</text>
  <circle cx="95" cy="390" r="28" fill="var(--mut)" fill-opacity="0.12" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="95" y1="390" x2="123.0" y2="390" stroke="var(--mut)" stroke-width="1"/>
  <line x1="95" y1="390" x2="95.0" y2="430.0" stroke="var(--A)" stroke-width="2.6" fill="none" marker-end="url(#mbyoy)"/>
  <text x="95.0" y="450.0" class="sm bd" text-anchor="middle">mg</text>
  <line x1="95.0" y1="362.0" x2="95.0" y2="312.0" stroke="var(--X)" stroke-width="2.6" fill="none" marker-end="url(#mgyoy)"/>
  <text x="95.0" y="302.0" class="sm bd" text-anchor="middle">T</text>
  <circle cx="95" cy="390" r="3" fill="var(--fg)"/>
  <text x="20" y="478" class="sm">Ejes: y hacia abajo (sentido de a).</text>
  <text x="20" y="494" class="sm">y: mg - T = ma</text>
  <text x="20" y="510" class="sm">Giro: T r = Iα , a = αr (rueda sobre cuerda)</text>
  <text x="20" y="526" class="sm">I = 2·½(m/2)R² = ½mR² (el eje no tiene masa)</text>
</svg>
