<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 360 198" width="100%" role="img" aria-label="Dos discos coaxiales con velocidades angulares distintas que se acoplan y giran juntos">
  <defs><marker id="madc" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbdc" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmdc" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgdc" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpdc" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfdc" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="54" cy="66" r="34" fill="var(--acc)" fill-opacity="0.18" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="54" cy="66" r="2.5" fill="var(--fg)"/>
  <path d="M 36.7 56.0 A 20 20 0 0 1 71.3 56.0" fill="none" stroke="var(--acc)" stroke-width="1.8" marker-end="url(#madc)"/>
  <text x="54" y="122" class="sm bd" text-anchor="middle">A: ω = 50 rad/s</text>
  <text x="54" y="138" class="sm" text-anchor="middle">I = 0,040 kg·m²</text>
  <circle cx="180" cy="66" r="24" fill="var(--A)" fill-opacity="0.18" stroke="var(--A)" stroke-width="1.5"/>
  <circle cx="180" cy="66" r="2.5" fill="var(--fg)"/>
  <path d="M 167.9 59.0 A 14 14 0 0 1 192.1 59.0" fill="none" stroke="var(--A)" stroke-width="3.2" marker-end="url(#mbdc)"/>
  <text x="180" y="122" class="sm bd" text-anchor="middle">B: ω = 200 rad/s</text>
  <text x="180" y="138" class="sm" text-anchor="middle">I = 0,020 kg·m²</text>
  <line x1="222" y1="66" x2="246" y2="66" stroke="var(--fg)" stroke-width="2.2" fill="none" marker-end="url(#mfdc)"/>
  <circle cx="300" cy="66" r="34" fill="var(--acc)" fill-opacity="0.18" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="300" cy="66" r="24" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <circle cx="300" cy="66" r="2.5" fill="var(--fg)"/>
  <path d="M 287.9 59.0 A 14 14 0 0 1 312.1 59.0" fill="none" stroke="var(--X)" stroke-width="2.6" marker-end="url(#mgdc)"/>
  <text x="300" y="122" class="sm bd" text-anchor="middle">juntos: ω = 100</text>
  <text x="300" y="138" class="sm" text-anchor="middle">rad/s, I = 0,060</text>
  <text x="180" y="170" class="sm" text-anchor="middle">K antes = 450 J → K después = 300 J (⅔)</text>
  <text x="180" y="188" class="sm" text-anchor="middle">L se conserva; la energía perdida calienta el embrague</text>
</svg>
