<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 184" width="100%" role="img" aria-label="Fuerza tangencial sobre el borde de un disco que gira un ángulo pequeño dθ; el arco recorrido es R dθ">
