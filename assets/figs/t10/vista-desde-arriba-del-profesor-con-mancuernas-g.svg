<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 350 232" width="100%" role="img" aria-label="Vista desde arriba del profesor con mancuernas girando con los brazos extendidos y con las mancuernas pegadas al cuerpo">
