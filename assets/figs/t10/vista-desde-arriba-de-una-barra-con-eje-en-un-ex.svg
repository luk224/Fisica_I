<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 350 224" width="100%" role="img" aria-label="Vista desde arriba de una barra con eje en un extremo y un acróbata que salta del otro extremo; la barra gira en sentido contrario">
  <defs><marker id="max5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbx5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmx5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgx5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpx5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfx5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line x1="52" y1="112" x2="222" y2="112" stroke="var(--fg)" stroke-width="5"/>
  <circle cx="52" cy="112" r="7" fill="var(--fg)"/>
  <circle cx="222" cy="112" r="11" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="222" y1="98" x2="222" y2="22" stroke="var(--X)" stroke-width="3.4" fill="none" marker-end="url(#mgx5)"/>
  <path d="M 22.6 95.0 A 34 34 0 0 1 81.4 95.0" fill="none" stroke="var(--A)" stroke-width="2.2" marker-end="url(#mbx5)"/>
  <line x1="52" y1="142" x2="222" y2="142" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="52" y1="137" x2="52" y2="147" stroke="var(--mut)" stroke-width="1.3"/>
  <line x1="222" y1="137" x2="222" y2="147" stroke="var(--mut)" stroke-width="1.3"/>
  <text x="137.0" y="158" class="sm" text-anchor="middle">r = 3 m</text>
  <text x="58" y="62" class="sm bd" text-anchor="start" style="fill:var(--A)">ω = 60 rad/s</text>
  <text x="48" y="132" class="sm" text-anchor="end">eje</text>
  <text x="234" y="54" class="sm bd" style="fill:var(--X)">v = 10 m/s</text>
  <text x="234" y="36" class="sm">acróbata (60 kg)</text>
  <text x="137.0" y="100" class="sm" text-anchor="middle">barra (10 kg)</text>
  <text x="16" y="180" class="sm bd">Vista desde arriba; antes L<tspan dy="3" font-size="9">z</tspan><tspan dy="-3"> = 0 y después:</tspan></text>
  <text x="16" y="198" class="sm" style="fill:var(--X)">L<tspan dy="3" font-size="9">acróbata</tspan><tspan dy="-3"> = m v r = +1800 kg·m²/s</tspan></text>
  <text x="16" y="216" class="sm" style="fill:var(--A)">L<tspan dy="3" font-size="9">barra</tspan><tspan dy="-3"> = −I ω = −1800 kg·m²/s</tspan></text>
</svg>
