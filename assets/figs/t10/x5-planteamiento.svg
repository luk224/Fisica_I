<svg class="fig" viewBox="0 0 360 330" width="100%" role="img" aria-label="Planteamiento: acróbata que salta del extremo de una barra con eje fijo, visto desde arriba">
  <defs><marker id="maacr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbacr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmacr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgacr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpacr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfacr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="60" cy="120" r="5" fill="var(--fg)" fill-opacity="0.8" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="60" y="140" class="sm bd" text-anchor="middle">eje O</text>
  <rect x="60" y="117" width="200" height="6" rx="2" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <circle cx="260" cy="120" r="9" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="260" y="142" class="sm bd" text-anchor="middle">60 kg</text>
  <text x="160" y="108" class="sm bd" text-anchor="middle">barra: 10 kg ; L = 3 m</text>
  <line x1="260" y1="108" x2="260" y2="64" stroke="var(--acc)" stroke-width="2.4" fill="none" marker-end="url(#maacr)"/>
  <text x="268" y="80" class="sm bd">v = 10 m/s</text>
  <line x1="170" y1="130" x2="170" y2="164" stroke="var(--E)" stroke-width="2.2" fill="none" marker-end="url(#mpacr)"/>
  <text x="178" y="156" class="sm bd">la barra gira al revés (ω)</text>
  <text x="20" y="16" class="sm">Visto desde arriba; suelo liso (sin fricción)</text>
  <text x="20" y="32" class="sm">Antes: todo en reposo. El acróbata salta ⊥ a la barra.</text>
  <text x="20" y="214" class="sm">Fuerza del eje en O: sin momento respecto de O.</text>
  <text x="20" y="230" class="sm">Pesos y normal: verticales, sin momento vertical.</text>
  <text x="20" y="246" class="sm">Respecto de O no hay momento externo:</text>
  <text x="20" y="262" class="sm">L conservado: 0 = m<tspan dy="3" font-size="9">a</tspan><tspan dy="-3"> v L - I ω</tspan></text>
  <text x="20" y="278" class="sm">I = ⅓m<tspan dy="3" font-size="9">b</tspan><tspan dy="-3">L² (barra) ; ω de la barra.</tspan></text>
  <text x="20" y="294" class="sm">K después = ½m<tspan dy="3" font-size="9">a</tspan><tspan dy="-3">v² + ½Iω² ;</tspan></text>
  <text x="20" y="310" class="sm">la energía viene del trabajo muscular.</text>
</svg>
