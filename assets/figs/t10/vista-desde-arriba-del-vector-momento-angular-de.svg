<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 350 258" width="100%" role="img" aria-label="Vista desde arriba del vector momento angular del giróscopo, que gira en horizontal porque la torca del peso es perpendicular a L">
  <defs><marker id="mapr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbpr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmpr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgpr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mppr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfpr" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <circle cx="104" cy="138" r="80" fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="104" y1="138" x2="42.7" y2="86.6" stroke="var(--X)" stroke-width="3.4" fill="none" marker-end="url(#mgpr)"/>
  <line x1="42.7" y1="86.6" x2="63.3" y2="62.1" stroke="var(--E)" stroke-width="3.2" fill="none" marker-end="url(#mppr)"/>
  <line x1="104" y1="138" x2="71.5" y2="64.9" stroke="var(--X)" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M 68.8 108.4 A 46 46 0 0 1 85.3 96.0" fill="none" stroke="var(--fg)" stroke-width="1.3"/>
  <circle cx="104" cy="138" r="4.5" fill="var(--fg)"/>
  <path d="M 142.9 221.4 A 92 92 0 0 1 28.6 190.8" fill="none" stroke="var(--A)" stroke-width="2.2" marker-end="url(#mbpr)"/>
  <text x="94" y="154" class="sm bd" text-anchor="end">O</text>
  <text x="62" y="128.3" class="sm bd" text-anchor="end" style="fill:var(--X)">L</text>
  <text x="80" y="56" class="sm bd" style="fill:var(--E)">dL = τ dt</text>
  <text x="48" y="104" class="sm bd" text-anchor="end">dφ</text>
  <text x="104" y="250" class="sm bd" text-anchor="middle" style="fill:var(--A)">Ω (precesión)</text>
  <text x="214" y="40" class="sm bd">Vista desde arriba</text>
  <text x="214" y="62" class="sm">dφ = |dL| / L</text>
  <text x="214" y="84" class="sm bd">Ω = dφ/dt = τ/L</text>
  <text x="226" y="104" class="sm bd" style="fill:var(--X)">= w r / (I ω)</text>
  <text x="214" y="134" class="sm">Ej. 10.13:</text>
  <text x="214" y="152" class="sm">Ω = 2π/(4,0 s)</text>
  <text x="214" y="170" class="sm">= 1,57 rad/s</text>
  <text x="214" y="194" class="sm bd" style="fill:var(--X)">⇒ ω ≈ 280 rad/s</text>
</svg>
