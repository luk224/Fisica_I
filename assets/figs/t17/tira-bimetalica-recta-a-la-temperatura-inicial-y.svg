<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 214" width="100%" role="img" aria-label="Tira bimetálica recta a la temperatura inicial y curvada al calentarla porque un metal se dilata más que el otro">
  <defs><marker id="mabim" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbbim" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmbim" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgbim" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpbim" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfbim" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="10" y="16" class="sm bd">T<tspan dy="3" font-size="9">0</tspan><tspan dy="-3"></tspan></text>
  <rect x="50" y="24" width="220" height="10" rx="2" fill="var(--A)" fill-opacity="0.35" stroke="var(--A)" stroke-width="1.5"/>
  <rect x="50" y="34" width="220" height="10" rx="2" fill="var(--acc)" fill-opacity="0.35" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="278" y="33" class="sm" text-anchor="start" style="fill:var(--A)">metal 1</text>
  <text x="278" y="45" class="sm" text-anchor="start" style="fill:var(--acc)">metal 2</text>
  <text x="10" y="100" class="sm bd">T<tspan dy="3" font-size="9">0</tspan><tspan dy="-3">+ΔT</tspan></text>
  <path d="M 50 150 Q 170 100 290 150" fill="none" stroke="var(--A)" stroke-width="10" opacity="0.55"/>
  <path d="M 50 160 Q 170 110 290 160" fill="none" stroke="var(--acc)" stroke-width="10" opacity="0.55"/>
  <text x="170" y="190" class="sm" text-anchor="middle">el metal 1 se dilata más: queda en el lado exterior</text>
  <text x="170" y="206" class="sm" text-anchor="middle">y la tira se curva (termómetro o termostato)</text>
</svg>
