  <text x="46" y="18" class="sm">T<tspan dy="3" font-size="9">int</tspan><tspan dy="-3"> (°C)</tspan></text>
  <line x1="40.0" y1="172" x2="40.0" y2="176" stroke="var(--fg)" stroke-width="1.2"/>
