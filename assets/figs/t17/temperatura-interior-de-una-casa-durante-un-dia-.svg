<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 210" width="100%" role="img" aria-label="Temperatura interior de una casa durante un día: constante a 20 °C o bajada a 12 °C durante 8 h; la pérdida es proporcional al área bajo la curva y se ahorra un 13 %">
