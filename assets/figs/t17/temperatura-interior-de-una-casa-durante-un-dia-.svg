  <text x="51.9" y="74.8" class="sm bd" text-anchor="start" style="fill:var(--acc)">calefacción baja 8 h: 83,2 kWh</text>
  <text x="277.5" y="80.0" class="sm bd" text-anchor="middle" style="fill:var(--X)">ahorro</text>
  <text x="182.5" y="148.0" class="sm" text-anchor="middle">pérdida ∝ área bajo la curva (hasta T<tspan dy="3" font-size="9">ext</tspan><tspan dy="-3"> = 0 °C)</tspan></text>
