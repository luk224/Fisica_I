<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 210" width="100%" role="img" aria-label="El metal baja de 100 °C a 22,0 °C y el agua sube de 20,0 a 22,0 °C: los calores se compensan">
  <defs><marker id="mae9" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe9" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme9" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge9" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe9" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe9" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <line class="ax" x1="40" y1="200.0" x2="40" y2="19.5"/>
  <text x="34" y="23.5" class="sm" text-anchor="start">T (°C)</text>
  <line x1="36" y1="159.0" x2="44" y2="159.0" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="32" y="163.0" class="sm" text-anchor="end">20</text>
  <line x1="36" y1="35.0" x2="44" y2="35.0" stroke="var(--fg)" stroke-width="1.2"/>
  <text x="32" y="39.0" class="sm" text-anchor="end">100</text>
  <line x1="40" y1="155.9" x2="300" y2="155.9" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="90" y1="35.0" x2="90" y2="152.9" stroke="var(--A)" stroke-width="3.5" fill="none" marker-end="url(#mbe9)"/>
  <line x1="225" y1="159.0" x2="225" y2="154.9" stroke="var(--acc)" stroke-width="3.5" fill="none" marker-end="url(#mae9)"/>
  <circle cx="90" cy="35.0" r="3.5" fill="var(--A)"/>
  <circle cx="225" cy="159.0" r="3.5" fill="var(--acc)"/>
  <text x="100" y="89.0" class="sm bd" text-anchor="start" style="fill:var(--A)">metal (0,500 kg)</text>
  <text x="100" y="105.0" class="sm" text-anchor="start">ΔT = −78,0 C°</text>
  <text x="235" y="89.0" class="sm bd" text-anchor="start" style="fill:var(--acc)">agua (1,00 kg)</text>
  <text x="235" y="105.0" class="sm" text-anchor="start">ΔT = +2,0 C°</text>
  <text x="330" y="149.9" class="sm bd" text-anchor="end">T<tspan dy="3" font-size="9">eq</tspan><tspan dy="-3"> = 22,0 °C</tspan></text>
</svg>
