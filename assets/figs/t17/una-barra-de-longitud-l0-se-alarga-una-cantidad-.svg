<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 176" width="100%" role="img" aria-label="Una barra de longitud L0 se alarga una cantidad ΔL cuando su temperatura sube ΔT; ΔL es proporcional a L0 y a ΔT">
  <defs><marker id="maexl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbexl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmexl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgexl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpexl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfexl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="10" y="18" class="sm bd">T<tspan dy="3" font-size="9">0</tspan><tspan dy="-3"></tspan></text>
  <rect x="90" y="24" width="200" height="30" rx="2" fill="var(--acc)" fill-opacity="0.22" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="190" y="45" class="bd" text-anchor="middle">L<tspan dy="3" font-size="9">0</tspan><tspan dy="-3"></tspan></text>
  <text x="10" y="98" class="sm bd">T<tspan dy="3" font-size="9">0</tspan><tspan dy="-3">+ΔT</tspan></text>
  <rect x="90" y="80" width="200" height="30" rx="2" fill="var(--acc)" fill-opacity="0.22" stroke="var(--acc)" stroke-width="1.5"/>
  <rect x="290" y="80" width="24" height="30" rx="2" fill="var(--A)" fill-opacity="0.35" stroke="var(--A)" stroke-width="1.5"/>
  <rect x="90" y="80" width="200" height="30" rx="2" fill="none" stroke="var(--mut)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="190" y="101" class="bd" text-anchor="middle">L<tspan dy="3" font-size="9">0</tspan><tspan dy="-3"></tspan></text>
  <text x="302" y="101" class="bd" text-anchor="middle">ΔL</text>
  <line x1="290" y1="128" x2="314" y2="128" stroke="var(--A)" stroke-width="2" fill="none" marker-end="url(#mbexl)"/>
  <line x1="314" y1="128" x2="290" y2="128" stroke="var(--A)" stroke-width="2" fill="none" marker-end="url(#mbexl)"/>
  <text x="170" y="152" class="bd" text-anchor="middle">ΔL = α L<tspan dy="3" font-size="9">0</tspan><tspan dy="-3"> ΔT</tspan></text>
  <text x="170" y="168" class="sm" text-anchor="middle">dilatación exagerada, no a escala</text>
</svg>
