<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 176" width="100%" role="img" aria-label="Recipiente aislado con agua fría y un cuerpo caliente: el calor pasa del cuerpo al agua y la suma de todos los calores es cero">
  <defs><marker id="macal" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbcal" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmcal" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgcal" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpcal" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfcal" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="24" y="18" width="292" height="128" rx="2" fill="var(--mut)" fill-opacity="0.1" stroke="var(--mut)" stroke-width="1.5"/>
  <rect x="40" y="62" width="170" height="70" rx="2" fill="var(--acc)" fill-opacity="0.22" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="125" y="126" class="sm bd" text-anchor="middle">agua (fría)</text>
  <circle cx="262" cy="98" r="24" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="262" y="94" class="sm bd" text-anchor="middle">cuerpo</text>
  <text x="262" y="108" class="sm" text-anchor="middle">caliente</text>
  <line x1="236" y1="90" x2="214" y2="90" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbcal)"/>
  <text x="224" y="80" class="bd" text-anchor="middle">Q</text>
  <text x="170" y="38" class="sm bd" text-anchor="middle">recipiente aislado: no entra ni sale calor</text>
  <text x="170" y="54" class="sm" text-anchor="middle">ΣQ = Q<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> + Q</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3"> + … = 0</tspan></text>
  <text x="170" y="166" class="sm" text-anchor="middle">lo que cede uno (Q < 0) lo gana otro (Q > 0)</text>
</svg>
