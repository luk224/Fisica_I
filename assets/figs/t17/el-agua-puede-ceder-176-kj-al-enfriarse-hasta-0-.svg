<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 176" width="100%" role="img" aria-label="El agua puede ceder 176 kJ al enfriarse hasta 0 °C pero el hielo necesita 228 kJ para fundirse del todo: no se derrite todo">
