<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 172" width="100%" role="img" aria-label="Placa con un orificio circular antes y después de calentarla: el orificio también se agranda, como si fuera del mismo material">
  <defs><marker id="maexo" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbexo" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmexo" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgexo" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpexo" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfexo" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="70" y="18" class="sm bd" text-anchor="middle">T<tspan dy="3" font-size="9">0</tspan><tspan dy="-3"></tspan></text>
  <text x="250" y="18" class="sm bd" text-anchor="middle">T<tspan dy="3" font-size="9">0</tspan><tspan dy="-3">+ΔT</tspan></text>
  <rect x="25" y="30" width="90" height="90" rx="2" fill="var(--acc)" fill-opacity="0.22" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="70" cy="75" r="20" fill="var(--bg)" stroke="var(--mut)" stroke-width="1.5"/>
  <rect x="200" y="25" width="100" height="100" rx="2" fill="var(--acc)" fill-opacity="0.22" stroke="var(--acc)" stroke-width="1.5"/>
  <circle cx="250" cy="75" r="22.2" fill="var(--bg)" stroke="var(--mut)" stroke-width="1.5"/>
  <rect x="205" y="30" width="90" height="90" rx="2" fill="none" stroke="var(--mut)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="250" cy="75" r="20" fill="none" stroke="var(--mut)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="122" y1="75" x2="192" y2="75" stroke="var(--A)" stroke-width="2.5" fill="none" marker-end="url(#mbexo)"/>
  <text x="157" y="66" class="sm" text-anchor="middle">calentar</text>
  <text x="170" y="146" class="sm bd" text-anchor="middle">el orificio crece igual que el material</text>
  <text x="170" y="162" class="sm" text-anchor="middle">(trazos: tamaño inicial; dilatación exagerada)</text>
</svg>
