<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 152" width="100%" role="img" aria-label="Tres cuerpos A, B y C: si A y B están cada uno en equilibrio térmico con C, también lo están entre sí">
  <defs><marker id="mal0" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbl0" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mml0" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgl0" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpl0" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfl0" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="10" y="45" width="60" height="50" rx="2" fill="var(--A)" fill-opacity="0.2" stroke="var(--A)" stroke-width="1.5"/>
  <rect x="140" y="45" width="60" height="50" rx="2" fill="var(--X)" fill-opacity="0.2" stroke="var(--X)" stroke-width="1.5"/>
  <rect x="270" y="45" width="60" height="50" rx="2" fill="var(--acc)" fill-opacity="0.2" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="40" y="76" class="bd" text-anchor="middle">A</text>
  <text x="170" y="70" class="bd" text-anchor="middle">C</text>
  <text x="170" y="86" class="sm" text-anchor="middle">(termómetro)</text>
  <text x="300" y="76" class="bd" text-anchor="middle">B</text>
  <line x1="74" y1="70" x2="136" y2="70" stroke="var(--mut)" stroke-width="2" fill="none" marker-end="url(#mml0)"/>
  <line x1="136" y1="70" x2="74" y2="70" stroke="var(--mut)" stroke-width="2" fill="none" marker-end="url(#mml0)"/>
  <line x1="266" y1="70" x2="204" y2="70" stroke="var(--mut)" stroke-width="2" fill="none" marker-end="url(#mml0)"/>
  <line x1="204" y1="70" x2="266" y2="70" stroke="var(--mut)" stroke-width="2" fill="none" marker-end="url(#mml0)"/>
  <text x="105" y="36" class="sm bd" text-anchor="middle">T<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = T</tspan><tspan dy="3" font-size="9">C</tspan><tspan dy="-3"></tspan></text>
  <text x="235" y="36" class="sm bd" text-anchor="middle">T<tspan dy="3" font-size="9">C</tspan><tspan dy="-3"> = T</tspan><tspan dy="3" font-size="9">B</tspan><tspan dy="-3"></tspan></text>
  <text x="105" y="58" class="sm" text-anchor="middle">contacto</text>
  <text x="235" y="58" class="sm" text-anchor="middle">contacto</text>
  <path d="M 40 97 L 40 124 L 300 124 L 300 100" fill="none" stroke="var(--E)" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="300" y1="112" x2="300" y2="99" stroke="var(--E)" stroke-width="2" fill="none" marker-end="url(#mpl0)"/>
  <text x="170" y="142" class="sm bd" text-anchor="middle">⇒ T<tspan dy="3" font-size="9">A</tspan><tspan dy="-3"> = T</tspan><tspan dy="3" font-size="9">B</tspan><tspan dy="-3">: A y B están en equilibrio térmico</tspan></text>
</svg>
