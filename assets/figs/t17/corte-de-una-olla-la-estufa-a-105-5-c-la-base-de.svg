<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 190" width="100%" role="img" aria-label="Corte de una olla: la estufa a 105,5 °C, la base de acero de 8,50 mm y el agua hirviendo a 100 °C; la corriente de calor es 4,89 kW">
  <defs><marker id="mae18" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe18" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme18" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge18" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe18" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe18" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="40" y="20" width="260" height="60" rx="2" fill="var(--acc)" fill-opacity="0.15" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="170" y="38" class="sm bd" text-anchor="middle">agua hirviendo, 100,0 °C</text>
  <text x="170" y="54" class="sm" text-anchor="middle">0,390 kg evaporados en 3,00 min</text>
  <rect x="40" y="80" width="260" height="16" rx="2" fill="var(--mut)" fill-opacity="0.4" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="170" y="92" class="sm bd" text-anchor="middle">base de acero, 8,50 mm</text>
  <rect x="40" y="96" width="260" height="28" rx="2" fill="var(--A)" fill-opacity="0.35" stroke="var(--A)" stroke-width="1.5"/>
  <text x="170" y="114" class="sm bd" text-anchor="middle">estufa: T<tspan dy="3" font-size="9">H</tspan><tspan dy="-3"> = 105,5 °C</tspan></text>
  <line x1="70" y1="148" x2="70" y2="130" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbe18)"/>
  <text x="86" y="142" class="sm bd" text-anchor="start">H = 4,89 kW</text>
  <text x="170" y="166" class="sm bd" text-anchor="middle">H = m L<tspan dy="3" font-size="9">v</tspan><tspan dy="-3">/t = 4,89 kW</tspan></text>
  <text x="170" y="182" class="sm bd" text-anchor="middle">T<tspan dy="3" font-size="9">H</tspan><tspan dy="-3"> − T</tspan><tspan dy="3" font-size="9">C</tspan><tspan dy="-3"> = H L/(k A) = 5,52 C°</tspan></text>
  <circle cx="80" cy="68" r="3.5" fill="none" stroke="var(--acc)" stroke-width="1.3"/>
  <circle cx="130" cy="68" r="3.5" fill="none" stroke="var(--acc)" stroke-width="1.3"/>
  <circle cx="190" cy="68" r="3.5" fill="none" stroke="var(--acc)" stroke-width="1.3"/>
  <circle cx="245" cy="68" r="3.5" fill="none" stroke="var(--acc)" stroke-width="1.3"/>
