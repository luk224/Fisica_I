<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 208" width="100%" role="img" aria-label="Patata con un clavo metálico que atraviesa su centro: el clavo conduce el calor del horno al interior; el aluminio conduce unas 4 veces más que el acero">
  <defs><marker id="max1a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbx1a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmx1a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgx1a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpx1a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfx1a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="170" y="14" class="sm bd" text-anchor="middle" style="fill:var(--A)">horno (aire y paredes calientes)</text>
  <line x1="100" y1="20" x2="100" y2="44" stroke="var(--A)" stroke-width="2.5" fill="none" marker-end="url(#mbx1a)"/>
  <line x1="170" y1="20" x2="170" y2="44" stroke="var(--A)" stroke-width="2.5" fill="none" marker-end="url(#mbx1a)"/>
  <line x1="240" y1="20" x2="240" y2="44" stroke="var(--A)" stroke-width="2.5" fill="none" marker-end="url(#mbx1a)"/>
  <ellipse cx="170" cy="96" rx="106" ry="48" fill="var(--A)" fill-opacity="0.18" stroke="var(--A)" stroke-width="1.6"/>
  <rect x="44" y="92" width="252" height="8" rx="2" fill="var(--mut)" fill-opacity="0.55" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="60" y1="84" x2="150" y2="84" stroke="var(--X)" stroke-width="2.5" fill="none" marker-end="url(#mgx1a)"/>
  <text x="105" y="76" class="sm bd" text-anchor="middle" style="fill:var(--X)">calor por el clavo</text>
  <text x="170" y="124" class="sm" text-anchor="middle">patata: k ≈ 0,6 W/(m·K)</text>
  <text x="170" y="138" class="sm" text-anchor="middle">sin clavo el centro tarda en calentarse</text>
  <text x="170" y="168" class="sm bd" text-anchor="middle" style="fill:var(--A)">clavo de aluminio: k = 205  ⇒  H ≈ 5,2 W</text>
  <text x="170" y="184" class="sm bd" text-anchor="middle">clavo de acero: k = 50,2  ⇒  H ≈ 1,3 W</text>
  <text x="170" y="200" class="sm" text-anchor="middle">(estimación propia: Ø 4 mm, 5 cm, 100 K)</text>
</svg>
