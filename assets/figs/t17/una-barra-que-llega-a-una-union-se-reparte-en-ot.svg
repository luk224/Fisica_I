<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 220" width="100%" role="img" aria-label="Una barra que llega a una unión se reparte en otras dos: la corriente de calor que entra es la suma de las que salen">
  <defs><marker id="mapar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbpar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmpar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgpar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mppar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfpar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="24" y="98" width="110" height="16" rx="2" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <path d="M 134 106 L 300 56" fill="none" stroke="var(--A)" stroke-width="6"/>
  <path d="M 134 106 L 300 156" fill="none" stroke="var(--acc)" stroke-width="6"/>
  <circle cx="134" cy="106" r="5" fill="var(--fg)"/>
  <text x="24" y="170" class="sm bd" text-anchor="start">● unión a T<tspan dy="3" font-size="9">J</tspan><tspan dy="-3"></tspan></text>
  <line x1="40" y1="90" x2="100" y2="90" stroke="var(--A)" stroke-width="2.5" fill="none" marker-end="url(#mbpar)"/>
  <text x="70" y="82" class="sm bd" text-anchor="middle">H<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"></tspan></text>
  <line x1="179" y1="76" x2="232" y2="60" stroke="var(--X)" stroke-width="2.5" fill="none" marker-end="url(#mgpar)"/>
  <text x="172" y="76" class="sm bd" text-anchor="end">H<tspan dy="3" font-size="9">2</tspan><tspan dy="-3"></tspan></text>
  <line x1="189" y1="136" x2="242" y2="152" stroke="var(--E)" stroke-width="2.5" fill="none" marker-end="url(#mppar)"/>
  <text x="250" y="170" class="sm bd" text-anchor="start">H<tspan dy="3" font-size="9">3</tspan><tspan dy="-3"></tspan></text>
  <text x="24" y="134" class="sm" text-anchor="start">barra 1</text>
  <text x="24" y="148" class="sm" text-anchor="start">(extremo a T<tspan dy="3" font-size="9">H</tspan><tspan dy="-3">)</tspan></text>
  <text x="322" y="40" class="sm bd" text-anchor="end">barra 2 (extremo a T<tspan dy="3" font-size="9">C</tspan><tspan dy="-3">)</tspan></text>
  <text x="322" y="190" class="sm bd" text-anchor="end">barra 3 (extremo a T<tspan dy="3" font-size="9">C</tspan><tspan dy="-3">)</tspan></text>
  <text x="170" y="212" class="sm bd" text-anchor="middle">en la unión: H<tspan dy="3" font-size="9">1</tspan><tspan dy="-3"> = H</tspan><tspan dy="3" font-size="9">2</tspan><tspan dy="-3"> + H</tspan><tspan dy="3" font-size="9">3</tspan><tspan dy="-3"></tspan></text>
</svg>
