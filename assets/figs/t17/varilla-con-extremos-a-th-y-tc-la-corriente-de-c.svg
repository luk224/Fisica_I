<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 226" width="100%" role="img" aria-label="Varilla con extremos a TH y TC: la corriente de calor H va de izquierda a derecha y la temperatura baja linealmente a lo largo de la varilla">
  <defs><marker id="macd" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbcd" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmcd" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgcd" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpcd" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfcd" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="20" y="28" width="50" height="40" rx="2" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <rect x="270" y="28" width="50" height="40" rx="2" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <rect x="70" y="36" width="200" height="24" rx="2" fill="var(--mut)" fill-opacity="0.15" stroke="var(--mut)" stroke-width="1.5"/>
  <text x="45" y="53" class="sm bd" text-anchor="middle">T<tspan dy="3" font-size="9">H</tspan><tspan dy="-3"></tspan></text>
  <text x="295" y="53" class="sm bd" text-anchor="middle">T<tspan dy="3" font-size="9">C</tspan><tspan dy="-3"></tspan></text>
  <text x="170" y="52" class="sm bd" text-anchor="middle">A, k</text>
  <line x1="90" y1="18" x2="250" y2="18" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbcd)"/>
  <text x="170" y="12" class="sm bd" text-anchor="middle">H = kA (T<tspan dy="3" font-size="9">H</tspan><tspan dy="-3"> − T</tspan><tspan dy="3" font-size="9">C</tspan><tspan dy="-3">) / L</tspan></text>
  <line x1="70" y1="80" x2="270" y2="80" stroke="var(--mut)" stroke-width="1.5" fill="none" marker-end="url(#mmcd)"/>
  <line x1="270" y1="80" x2="70" y2="80" stroke="var(--mut)" stroke-width="1.5" fill="none" marker-end="url(#mmcd)"/>
  <text x="170" y="94" class="sm bd" text-anchor="middle">L</text>
  <line x1="70" y1="68" x2="70" y2="130" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="270" y1="68" x2="270" y2="130" stroke="var(--mut)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line class="ax" x1="60" y1="190" x2="290" y2="190"/>
  <line class="ax" x1="60" y1="190" x2="60" y2="112"/>
  <text x="288" y="204" class="sm" text-anchor="end">x</text>
  <text x="54" y="118" class="sm" text-anchor="end">T</text>
  <path d="M 70 130 L 270 178" fill="none" stroke="var(--A)" stroke-width="2.8"/>
  <circle cx="70" cy="130" r="3.5" fill="var(--A)"/>
  <circle cx="270" cy="178" r="3.5" fill="var(--acc)"/>
  <text x="78" y="124" class="sm bd" text-anchor="start">T<tspan dy="3" font-size="9">H</tspan><tspan dy="-3"></tspan></text>
  <text x="262" y="172" class="sm bd" text-anchor="end">T<tspan dy="3" font-size="9">C</tspan><tspan dy="-3"></tspan></text>
  <text x="170" y="218" class="sm" text-anchor="middle">T baja linealmente con x; pendiente = −(T<tspan dy="3" font-size="9">H</tspan><tspan dy="-3"> − T</tspan><tspan dy="3" font-size="9">C</tspan><tspan dy="-3">)/L</tspan></text>
</svg>
