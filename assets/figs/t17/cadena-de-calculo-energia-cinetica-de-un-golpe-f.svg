<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 196" width="100%" role="img" aria-label="Cadena de cálculo: energía cinética de un golpe, fracción que pasa al clavo, diez golpes y aumento de temperatura">
  <defs><marker id="mae8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <rect x="20" y="12" width="300" height="30" rx="2" fill="var(--A)" fill-opacity="0.18" stroke="var(--A)" stroke-width="1.5"/>
  <text x="170" y="32" class="sm bd" text-anchor="middle">K = ½ m v² = 54,8 J (un golpe)</text>
  <line x1="170" y1="43" x2="170" y2="58" stroke="var(--mut)" stroke-width="2" fill="none" marker-end="url(#mme8)"/>
  <rect x="20" y="60" width="300" height="30" rx="2" fill="var(--A)" fill-opacity="0.18" stroke="var(--A)" stroke-width="1.5"/>
  <text x="170" y="80" class="sm bd" text-anchor="middle">60 % pasa al clavo: 32,9 J</text>
  <line x1="170" y1="91" x2="170" y2="106" stroke="var(--mut)" stroke-width="2" fill="none" marker-end="url(#mme8)"/>
  <rect x="20" y="108" width="300" height="30" rx="2" fill="var(--X)" fill-opacity="0.18" stroke="var(--X)" stroke-width="1.5"/>
  <text x="170" y="128" class="sm bd" text-anchor="middle">10 golpes: Q = 329 J</text>
  <line x1="170" y1="139" x2="170" y2="154" stroke="var(--mut)" stroke-width="2" fill="none" marker-end="url(#mme8)"/>
  <rect x="20" y="156" width="300" height="30" rx="2" fill="var(--acc)" fill-opacity="0.18" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="170" y="176" class="sm bd" text-anchor="middle">ΔT = Q/(m c) = 329/(0,00800·910) = 45,1 C°</text>
</svg>
