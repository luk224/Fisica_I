  <rect x="220" y="108" width="12" height="52" rx="2" fill="var(--mut)" fill-opacity="0.35" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="232" y1="108" x2="220" y2="117" stroke="var(--mut)" stroke-width="1"/>
  <line x1="232" y1="117" x2="220" y2="126" stroke="var(--mut)" stroke-width="1"/>
  <line x1="232" y1="126" x2="220" y2="135" stroke="var(--mut)" stroke-width="1"/>
  <line x1="232" y1="135" x2="220" y2="144" stroke="var(--mut)" stroke-width="1"/>
