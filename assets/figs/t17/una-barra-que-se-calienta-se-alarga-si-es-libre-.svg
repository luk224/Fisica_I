  <rect x="20" y="120" width="200" height="28" rx="2" fill="var(--acc)" fill-opacity="0.22" stroke="var(--acc)" stroke-width="1.5"/>
  <line x1="24" y1="134" x2="56" y2="134" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbest)"/>
  <line x1="216" y1="134" x2="184" y2="134" stroke="var(--A)" stroke-width="3" fill="none" marker-end="url(#mbest)"/>
  <text x="120" y="138" class="bd" text-anchor="middle">F</text>
  <text x="170" y="180" class="bd" text-anchor="middle">esfuerzo (compresión):  F/A = −Y α ΔT</text>
  <text x="170" y="196" class="sm" text-anchor="middle">ΔT > 0 ⇒ F/A < 0;   ΔT < 0 ⇒ tracción</text>
</svg>
