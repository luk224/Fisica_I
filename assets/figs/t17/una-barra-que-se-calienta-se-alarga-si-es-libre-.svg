<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 204" width="100%" role="img" aria-label="Una barra que se calienta se alarga si es libre, pero si está entre paredes rígidas queda comprimida con un esfuerzo F/A = −Y α ΔT">
  <defs><marker id="maest" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbest" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mmest" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mgest" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpest" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfest" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="10" y="14" class="sm bd">a) libre: se alarga</text>
  <rect x="8" y="20" width="12" height="52" rx="2" fill="var(--mut)" fill-opacity="0.35" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="8" y1="20" x2="20" y2="29" stroke="var(--mut)" stroke-width="1"/>
  <line x1="8" y1="29" x2="20" y2="38" stroke="var(--mut)" stroke-width="1"/>
  <line x1="8" y1="38" x2="20" y2="47" stroke="var(--mut)" stroke-width="1"/>
  <line x1="8" y1="47" x2="20" y2="56" stroke="var(--mut)" stroke-width="1"/>
  <line x1="8" y1="56" x2="20" y2="65" stroke="var(--mut)" stroke-width="1"/>
  <line x1="8" y1="65" x2="20" y2="72" stroke="var(--mut)" stroke-width="1"/>
  <rect x="20" y="32" width="200" height="28" rx="2" fill="var(--acc)" fill-opacity="0.22" stroke="var(--acc)" stroke-width="1.5"/>
  <rect x="20" y="32" width="200" height="28" rx="2" fill="none" stroke="var(--mut)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="220" y="32" width="22" height="28" rx="2" fill="var(--A)" fill-opacity="0.35" stroke="var(--A)" stroke-width="1.5"/>
  <text x="231" y="52" class="sm bd" text-anchor="middle">ΔL</text>
  <text x="10" y="100" class="sm bd">b) entre paredes rígidas: no puede alargarse</text>
  <rect x="8" y="108" width="12" height="52" rx="2" fill="var(--mut)" fill-opacity="0.35" stroke="var(--mut)" stroke-width="1.5"/>
  <line x1="8" y1="108" x2="20" y2="117" stroke="var(--mut)" stroke-width="1"/>
  <line x1="8" y1="117" x2="20" y2="126" stroke="var(--mut)" stroke-width="1"/>
