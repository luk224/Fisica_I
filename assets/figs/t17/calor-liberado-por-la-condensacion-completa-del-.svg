<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 340 166" width="100%" role="img" aria-label="Calor liberado por la condensación completa del vapor (90,2 kJ) frente a lo que el agua puede absorber hasta 100 °C (41,9 kJ)">
  <defs><marker id="mae14" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--acc)"/></marker><marker id="mbe14" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--A)"/></marker><marker id="mme14" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--mut)"/></marker><marker id="mge14" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--X)"/></marker><marker id="mpe14" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--E)"/></marker><marker id="mfe14" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--fg)"/></marker></defs>
  <text x="86" y="23.0" class="sm" text-anchor="end">vapor</text>
  <text x="86" y="36.0" class="sm" text-anchor="end">condensado</text>
  <text x="86" y="49.0" class="sm" text-anchor="end">del todo</text>
  <rect x="94" y="14" width="153.408" height="36" rx="2" fill="var(--A)" fill-opacity="0.3" stroke="var(--A)" stroke-width="1.5"/>
  <text x="252.4" y="36.0" class="sm bd" text-anchor="start">90,2 kJ</text>
  <text x="86" y="81.0" class="sm" text-anchor="end">agua</text>
  <text x="86" y="94.0" class="sm" text-anchor="end">(absorbe</text>
  <text x="86" y="107.0" class="sm" text-anchor="end">hasta 100 °C)</text>
  <rect x="94" y="72" width="71.22999999999999" height="36" rx="2" fill="var(--acc)" fill-opacity="0.3" stroke="var(--acc)" stroke-width="1.5"/>
  <text x="170.2" y="94.0" class="sm bd" text-anchor="start">41,9 kJ</text>
  <text x="14" y="140" class="sm bd" text-anchor="start">no se condensa todo: T<tspan dy="3" font-size="9">f</tspan><tspan dy="-3"> = 100 °C</tspan></text>
  <text x="14" y="156" class="sm" text-anchor="start">se condensan 0,0186 kg; quedan 0,0214 kg</text>
</svg>
